const t = (k) => T[lang][k];

const CORE = [0, 1, 2, 3, 5];
const S = { cats: new Set(CORE), st: 0, kinds: new Set([0, 1, 2, 3]), from: 0, to: 9999, rank: 0, sel: -1 };
let N = 0, TNC = [], CAT = null, DATE = null, ST = null, EDG = null, OUT = null, IN = null, AMD = null;
const KC = ['--ka', '--ki', '--kp', '--kr'];
const catCol = () => [0, 1, 2, 3, 4, 5, 6, 7].map((i) => css('--c' + i));
const kindCol = () => KC.map(css);
const yr = (i) => Math.floor(DATE[i] / 10000);

function prep() {
  const n = D.nodes; N = n.id.length; DATE = n.date; ST = n.st;
  TNC = D.types.map((x) => x[1]); CAT = new Uint8Array(N); for (let i = 0; i < N; i++) CAT[i] = TNC[n.tn[i]];
  EDG = D.edges; OUT = Array.from({ length: N }, () => []); IN = Array.from({ length: N }, () => []);
  const am = Array.from({ length: N }, () => new Set());
  for (let k = 0; k < EDG.length; k += 3) { const s = EDG[k], d = EDG[k + 1], c = EDG[k + 2]; OUT[s].push([d, c]); IN[d].push([s, c]); if (c === 0) am[d].add(s); }
  AMD = new Uint16Array(N); for (let i = 0; i < N; i++) AMD[i] = am[i].size;
  let lo = 9999; for (let i = 0; i < N; i++) lo = Math.min(lo, yr(i));
  S.from = lo; S.to = D.y1; D._lo = lo;
  for (const id of ['yfrom', 'yto']) { $(id).min = lo; $(id).max = D.y1; }
  $('yfrom').value = lo; $('yto').value = D.y1;
}

function loadTitles() {

  $('cats').querySelectorAll('button').forEach((b) => (b.onclick = () => { const c = +b.dataset.c; S.cats.has(c) ? S.cats.delete(c) : S.cats.add(c); controls(); rebuild(); }));
  $('kinds').innerHTML = [0, 1, 2, 3].map((i) => `<button type="button" class="chip" data-k="${i}" aria-pressed="${S.kinds.has(i)}"><i class="ln" style="--c:${kc[i]}"></i>${esc(t('kinds')[i])}</button>`).join('');
  $('kinds').querySelectorAll('button').forEach((b) => (b.onclick = () => { const k = +b.dataset.k; S.kinds.has(k) ? S.kinds.delete(k) : S.kinds.add(k); controls(); rebuild(); }));
  $('yfromo').textContent = S.from; $('ytoo').textContent = S.to;
}
$('yfrom').oninput = () => { S.from = Math.min(+$('yfrom').value, S.to); $('yfrom').value = S.from; $('yfromo').textContent = S.from; rebuildSoon(); };
$('yto').oninput = () => { S.to = Math.max(+$('yto').value, S.from); $('yto').value = S.to; $('ytoo').textContent = S.to; rebuildSoon(); };
let rt = 0; const rebuildSoon = () => { clearTimeout(rt); rt = setTimeout(rebuild, 120); };

// ---- the network
const pos = { x: null, y: null };
function initPos() {
  pos.x = new Float32Array(N); pos.y = new Float32Array(N); let s = 12345;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < N; i++) { const a = rnd() * 6.2832, r = 700 * Math.sqrt(rnd()); pos.x[i] = 2048 + Math.cos(a) * r; pos.y[i] = 2048 + Math.sin(a) * r; }
}
const stOk = (i) => ST[i] === (S.st === 1 ? 1 : 0);
function visible() {
  const ok = new Uint8Array(N);
  for (let i = 0; i < N; i++) { const y = yr(i); ok[i] = S.cats.has(CAT[i]) && y >= S.from && y <= S.to ? 1 : 0; }
  const has = new Uint8Array(N), L = [];
  for (let k = 0; k < EDG.length; k += 3) { const s = EDG[k], d = EDG[k + 1], c = EDG[k + 2]; if (ok[s] && ok[d] && S.kinds.has(c) && (S.st === 0 || stOk(s) || stOk(d))) { has[s] = has[d] = 1; L.push(s, d, c); } }
  const idx = new Int32Array(N).fill(-1); vis = []; for (let i = 0; i < N; i++) if (has[i]) { idx[i] = vis.length; vis.push(i); }
  return { idx, L };
}
let cur = null;
const amCount = () => { let a = 0; for (let k = 2; k < cur.L.length; k += 3) if (cur.L[k] === 0) a++; return a; };
function rebuild() {
  if (!D) return;
  if (graph && gReady) { try { const p = graph.getPointPositions(); vis.forEach((n, j) => { if (p[2 * j] === p[2 * j] && Math.abs(p[2 * j]) < 1e6) { pos.x[n] = p[2 * j]; pos.y[n] = p[2 * j + 1]; } }); } catch {} }
  const { idx, L } = visible(); cur = { idx, L };
  const nl = L.length / 3;
  $('stats').innerHTML = [[vis.length, t('stNodes')], [nl, t('stLinks')], [amCount(), t('stAmend')], [`${S.from}–${S.to}`, t('stYears')]].map(([v, l]) => `<div><b>${typeof v === 'number' ? nf(v) : v}</b><span>${esc(l)}</span></div>`).join('');
  $('gload').textContent = vis.length ? '' : t('gnone'); $('gload').hidden = !!vis.length;
  if (!graph) { if (!vis.length) return; makeGraph(); }
  const P = new Float32Array(vis.length * 2); vis.forEach((n, j) => { P[2 * j] = pos.x[n]; P[2 * j + 1] = pos.y[n]; });
  const LK = new Float32Array(nl * 2); for (let k = 0; k < nl; k++) { LK[2 * k] = idx[L[3 * k]]; LK[2 * k + 1] = idx[L[3 * k + 1]]; }
  graph.setPointPositions(P); graph.setLinks(LK); paint();
  if (vis.length) { graph.start(0.9); paused = false; $('gpause').textContent = t('gpause'); }
  if (!rebuild.fitted) { rebuild.fitted = 1; setTimeout(() => graph.fitView(600, 0.06), 3500); } else setTimeout(() => graph.fitView(500, 0.06), 2000);
  $('netHint').textContent = t('netHint');
}
function makeGraph() {
  graph = new window.Cosmos.Graph($('cg'), {
    backgroundColor: css('--frame') || '#E9E2D6', spaceSize: 4096, enableSimulation: true, enableDrag: true, fitViewOnInit: false, scalePointsOnZoom: true,
    curvedLinks: false, linkDefaultWidth: 0.6, pointDefaultSize: 2, renderHoveredPointRing: true, hoveredPointRingColor: css('--accent') || '#A81E28', showFPSMonitor: false, attribution: '',
    simulationGravity: 0.12, simulationRepulsion: 1.4, simulationLinkSpring: 0.8, simulationLinkDistance: 8, simulationFriction: 0.88, simulationDecay: 6000,
    onPointMouseOver: (j, _p, ev) => tip(j, ev), onPointMouseOut: () => { $('gtip').hidden = true; },
    onPointClick: (j) => { const i = vis[j]; if (i !== undefined) show(i, 'gcard'); }, onClick: (j) => { if (j === undefined) $('gtip').hidden = true; },
  });
  gReady = true; window.__graph = graph;
}
function paint() {
  if (!graph || !cur) return;
  const cc = catCol().map(hex), kc = kindCol().map(hex), dk = dark();
  const pc = new Float32Array(vis.length * 4), ps = new Float32Array(vis.length);
  vis.forEach((n, j) => { const c = cc[CAT[n]]; pc.set([c[0], c[1], c[2], S.st === 0 || stOk(n) ? 1 : 0.3], 4 * j); ps[j] = 2 + Math.min(Math.sqrt(AMD[n]) * 1.1, 16); });
  const nl = cur.L.length / 3, lc = new Float32Array(nl * 4), lw = new Float32Array(nl);
  for (let k = 0; k < nl; k++) { const c = kc[cur.L[3 * k + 2]]; lc.set([c[0], c[1], c[2], dk ? 0.3 : 0.35], 4 * k); lw[k] = 0.6; }
  graph.setConfigPartial({ backgroundColor: css('--frame') || '#E9E2D6' });
  graph.setPointColors(pc); graph.setPointSizes(ps); graph.setLinkColors(lc); graph.setLinkWidths(lw); graph.render();
  const lk = kindCol(), cs = catCol();
  $('lgd').innerHTML = [...S.cats].sort().map((c) => `<span><i style="--c:${cs[c]}"></i>${esc(t('cats')[D.cats[c]])}</span>`).join('') + [0, 1, 2, 3].filter((k) => S.kinds.has(k)).map((k) => `<span><i class="ln" style="--c:${lk[k]}"></i>${esc(t('kindsFrom')[k])}</span>`).join('');
}
function tip(j, ev) {
  const i = vis[j]; if (i === undefined) return; const tp = $('gtip'); tp.hidden = false;
  tp.innerHTML = `<b>${esc(TT ? titleOf(i).slice(0, 140) : pretty(typeName(i)))}</b><br><span class="muted">${esc(t('cats')[D.cats[CAT[i]]])} · ${fmtDate(DATE[i])} · ${esc(t('tip')(nf(AMD[i])))}</span>`;
  if (ev) { const r = $('cg').getBoundingClientRect(); tp.style.left = Math.max(4, Math.min(ev.clientX - r.left + 12, r.width - 200)) + 'px'; tp.style.top = ev.clientY - r.top + 12 + 'px'; }
}
$('gfit').onclick = () => graph && graph.fitView(300, 0.08);
$('gpause').onclick = () => { if (!graph) return; paused = !paused; paused ? graph.pause() : graph.start(0.5); $('gpause').textContent = paused ? t('gresume') : t('gpause'); };

// ---- the card
const spark = (years) => {
  const ys = Object.keys(years).map(Number).sort((a, b) => a - b); if (!ys.length) return '';
  const a = ys[0], b = ys[ys.length - 1], n = b - a + 1, mx = Math.max(...Object.values(years)), W = 300, Hh = 44, bw = W / Math.max(n, 12);
  let g = ''; for (let y = a; y <= b; y++) { const v = years[y] || 0, h = v ? Math.max(2, (Hh - 4) * v / mx) : 0; g += `<rect x="${(y - a) * bw + 0.5}" y="${Hh - h}" width="${Math.max(bw - 1, 1)}" height="${h}" fill="var(--ink)"><title>${y}: ${v}</title></rect>`; }
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh + 12}" role="img" aria-label="${esc(t('amByYear'))}">${g}<text x="0" y="${Hh + 10}">${a}</text><text x="${Math.min(n, 12) * bw}" y="${Hh + 10}" text-anchor="end">${b}</text></svg>`;
};
function relList(i, title, items, open) {
  if (!items.length) return '';
  items = [...new Set(items)].sort((a, b) => DATE[b] - DATE[a]);
  const row = (j) => `<li><button type="button" data-a="${j}">${esc(titleOf(j))}</button> <span class="d">${citOf(j) ? '№ ' + esc(citOf(j)) + ' · ' : ''}${fmtDate(DATE[j])}</span></li>`;
  const cut = 6, rest = items.length - cut;
  return `<h4>${esc(title)} (${nf(items.length)})</h4><ul>${items.slice(0, cut).map(row).join('')}${rest > 0 ? `<span hidden data-rest>${items.slice(cut).map(row).join('')}</span>` : ''}</ul>${rest > 0 ? `<button type="button" class="more" data-more>${esc(t('showAll')(items.length))}</button>` : ''}`;
}
function show(i, target, noscroll) {
  S.sel = i; const el = $(target); el.dataset.a = i;
  const draw = () => {
    const c = CAT[i], cc = catCol(), years = {}; let last = -1;
    const by = (k, dir) => (dir ? IN[i] : OUT[i]).filter((x) => x[1] === k).map((x) => x[0]);
    const am = by(0, true); for (const j of new Set(am)) { years[yr(j)] = (years[yr(j)] || 0) + 1; if (last < 0 || DATE[j] > DATE[last]) last = j; }
    const R = t('rel');
    el.innerHTML = `<div class="card"><button type="button" class="x" data-x aria-label="${esc(t('close'))}">×</button>
      <h3>${esc(titleOf(i))}</h3>
      <dl><dt>${esc(t('ty'))}</dt><dd><span class="tag"><i style="--c:${cc[c]}"></i>${esc(t('cats')[D.cats[c]])}</span> <span class="muted">· ${esc(pretty(typeName(i)))}</span></dd>
      ${citOf(i) ? `<dt>${esc(t('nr'))}</dt><dd>${esc(citOf(i))}</dd>` : ''}<dt>${esc(t('dt'))}</dt><dd>${fmtDate(DATE[i])}</dd>
      <dt>${esc(t('stt'))}</dt><dd><span class="badge ${ST[i] ? 'ok' : 'off'}">${esc(ST[i] ? t('inForce') : t('repealed'))}</span></dd>
      <dt>${esc(t('amended'))}</dt><dd>${AMD[i] ? esc(t('times')(AMD[i])) : esc(t('never'))}${last >= 0 ? `<br><span class="muted">${esc(t('lastAm'))}: ${fmtDate(DATE[last])}</span>` : ''}</dd></dl>
      ${AMD[i] > 1 ? spark(years) : ''}
      <a class="src" href="${link(D.nodes.id[i])}" target="_blank" rel="noopener">${esc(t('open'))} ↗</a>
      ${relList(i, R.implements, by(1, false)) + relList(i, R.implementedBy, by(1, true)) + relList(i, R.applies, by(2, false)) + relList(i, R.appliedBy, by(2, true)) + relList(i, R.repeals, by(3, false)) + relList(i, R.repealedBy, by(3, true)) + relList(i, R.amendedBy, am) + relList(i, R.amends, by(0, false))}
    </div>`;
    el.querySelector('[data-x]').onclick = () => { el.innerHTML = ''; S.sel = -1; try { const u = new URL(location.href); u.searchParams.delete('a'); history.replaceState(null, '', u); } catch {} };
    el.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => show(+b.dataset.a, target)));
    el.querySelectorAll('[data-more]').forEach((b) => (b.onclick = () => { b.previousElementSibling.querySelector('[data-rest]').hidden = false; b.remove(); }));
  };
  draw();
  if (!TT) loadTitles().then(() => { if (+el.dataset.a === i && el.firstChild) draw(); });
  try { const u = new URL(location.href); u.searchParams.set('a', D.nodes.id[i]); history.replaceState(null, '', u); } catch {}
  if (!noscroll) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  if (graph && vis.length) { const j = cur.idx[i]; try { j >= 0 ? graph.selectPointByIndex(j) : graph.unselectPoints(); } catch {} }
}

// ---- search
function rowHtml(i, cnt) {
  const cc = catCol();
  return `<li><button type="button" data-a="${i}"><i style="--c:${cc[CAT[i]]}"></i><span class="tt">${esc(titleOf(i))}</span><span class="nn">${cnt ?? ''}</span><span class="mt">${esc(t('cats')[D.cats[CAT[i]]])}${citOf(i) ? ' · № ' + esc(citOf(i)) : ''} · ${fmtDate(DATE[i])}${ST[i] ? '' : ' · ' + esc(t('repealed'))}</span></button></li>`;
}
function search() {
  const q = norm($('q').value).trim().split(/\s+/).filter(Boolean), el = $('results'), SHOW = 30;
  if (!q.length) { $('qhint').textContent = t('qTop'); el.innerHTML = D.rank.mostAmended.slice(0, 12).map(([i, n]) => rowHtml(i, nf(n))).join(''); bind(el); return; }
  if (!H) { $('qhint').textContent = t('qWait'); el.innerHTML = ''; loadTitles(); return; }
  const m = []; for (let i = 0; i < N; i++) { const h = H[i]; if (q.every((w) => h.includes(w))) m.push(i); }
  m.sort((a, b) => AMD[b] - AMD[a] || DATE[b] - DATE[a]);
  $('qhint').textContent = m.length ? t('qFound')(m.length, SHOW) : t('qNone');
  el.innerHTML = m.slice(0, SHOW).map((i) => rowHtml(i, AMD[i] ? nf(AMD[i]) : '')).join(''); bind(el);
}
function bind(el) { el.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => { el.querySelectorAll('.on').forEach((x) => x.classList.remove('on')); b.classList.add('on'); show(+b.dataset.a, el.id === 'rank' ? 'rcard' : 'scard', el.id === 'rank'); })); }
$('q').addEventListener('input', search);
$('q').addEventListener('focus', loadTitles, { once: true });

// ---- rankings
function ranking() {
  seg($('rtabs'), t('tabs'), S.rank, (i) => { S.rank = i; ranking(); });
  const R = [D.rank.mostAmended, D.rank.inOneYear, D.rank.mostImplemented][S.rank], cc = catCol();
  $('rank').innerHTML = R.map(([i, n, y]) => `<li><button type="button" data-a="${i}"><span></span><span class="tt">${esc(titleOf(i))}</span><span class="nn">${nf(n)}${y ? ' · ' + esc(t('inYear')(y)) : ''}</span><span class="mt">${esc(t('cats')[D.cats[CAT[i]]])} · ${fmtDate(DATE[i])}${ST[i] ? '' : ' · ' + esc(t('repealed'))}</span></button></li>`).join('');
  bind($('rank'));
  const s = D.stats; $('rankP').textContent = t('rankP');
}

// ---- yearly charts
function stacked(svg, series) {
  const W = 640, Hh = 230, L = 38, B = 22, y0 = D.y0, n = series[0].length, bw = (W - L) / n;
  const tot = series[0].map((_, k) => series.reduce((a, s) => a + s[k], 0)), mx = Math.max(...tot);
  const step = mx > 3000 ? 1000 : mx > 1500 ? 500 : mx > 600 ? 200 : mx > 300 ? 100 : mx > 120 ? 50 : 20, base = Hh - B;
  let g = ''; for (let v = 0; v <= mx; v += step) { const y = base - (base - 6) * v / mx; g += `<g class="axis"><line x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">${nf(v)}</text></g>`; }
  for (let k = 0; k < n; k++) {
    let acc = 0;
    series.forEach((s, c) => { const h = (base - 6) * s[k] / mx; if (h > 0) g += `<rect x="${L + k * bw + 0.4}" y="${base - acc - h}" width="${Math.max(bw - 0.8, 1)}" height="${h}" style="fill:var(--c${c})"><title>${y0 + k} · ${esc(t('cats')[D.cats[c]])}: ${nf(s[k])}</title></rect>`; acc += h; });
    if ((y0 + k) % 5 === 0) g += `<text class="axis" x="${L + k * bw + bw / 2}" y="${Hh - 6}" text-anchor="middle" style="font:.6875rem var(--sans);fill:var(--muted)">${y0 + k}</text>`;
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`); svg.innerHTML = g;
}
function years() {
  $('capNew').textContent = t('capNew'); $('capAm').textContent = t('capAm');
  stacked($('chNew'), D.newByYear); stacked($('chAm'), D.amendByYear);
  $('chNew').setAttribute('aria-label', t('capNew')); $('chAm').setAttribute('aria-label', t('capAm'));
  const cc = catCol(); $('ylgd').innerHTML = [0, 1, 2, 3, 4, 5, 6, 7].map((c) => `<span><i style="--c:${cc[c]}"></i>${esc(t('cats')[D.cats[c]])}</span>`).join('');
}

// ---- language
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((e) => (e.textContent = t(e.dataset.i18n)));
  document.querySelectorAll('[data-i18n-label]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.i18nLabel)));
  document.querySelectorAll('[data-i18n-ph]').forEach((e) => e.setAttribute('placeholder', t(e.dataset.i18nPh)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.title = { az: 'Hüquqi aktlar şəbəkəsi', ru: 'Сеть правовых актов', en: 'Network of legal acts' }[lang] + ' · Azad Bilik';
  document.querySelectorAll('a[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.origin); if (lang !== 'az') u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
  if (!D) return;
  const s = D.stats;
  $('lede').textContent = t('lede')(s.actsInRegister, s.nodes, s.edges); $('method').innerHTML = t('method')(s); $('foot').innerHTML = t('foot')(D.built);
  $('gfit').textContent = t('gfit'); $('gpause').textContent = paused ? t('gresume') : t('gpause');
  controls(); ranking(); years(); search();
  if (cur) { paint(); statsOnly(); }
  $('netHint').textContent = t('netHint');
  for (const id of ['gcard', 'scard', 'rcard']) { const e = $(id); if (e.dataset.a && e.firstChild) show(+e.dataset.a, id, true); }
}
function statsOnly() { const nl = cur.L.length / 3; $('stats').innerHTML = [[vis.length, t('stNodes')], [nl, t('stLinks')], [amCount(), t('stAmend')], [`${S.from}–${S.to}`, t('stYears')]].map(([v, l]) => `<div><b>${typeof v === 'number' ? nf(v) : v}</b><span>${esc(l)}</span></div>`).join(''); }
document.querySelectorAll('[data-lang]').forEach((b) => (b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  applyLang();
}));
addEventListener('themechange', () => setTimeout(() => { try { controls(); paint(); years(); search(); } catch {} }));
applyLang();
$('gload').textContent = t('gload');

fetch('data/qanunlar.json').then((r) => r.json()).then((d) => {
  D = d; prep(); initPos(); applyLang();
  const go = () => { if (!gReady) { rebuild(); const a = +qs.get('a'); if (a) { const i = D.nodes.id.indexOf(a); if (i >= 0) { show(i, 'gcard', true); } } } };
  if ('IntersectionObserver' in window) { const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { go(); io.disconnect(); } }, { rootMargin: '300px' }); io.observe($('cg')); } else go();
  if ('requestIdleCallback' in window) requestIdleCallback(() => loadTitles(), { timeout: 4000 }); else setTimeout(loadTitles, 2500);
  window.__q = { D, S };
}).catch((e) => { console.error(e); $('lede').textContent = 'Error: ' + e.message; });
})();
</script>
