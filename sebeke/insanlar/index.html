  .sugg { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .6rem; font-size: .8125rem; align-items: center; color: var(--muted); }
  .sugg button { padding: .2rem .55rem; border: 1px solid var(--rule); border-radius: 99px; color: var(--ink); }
  .sugg button:hover { border-color: var(--ink); }

  .charts { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2rem; margin-top: 1rem; }
  .charts figure { margin: 0; min-width: 0; }
  .charts figcaption { font-size: .8125rem; font-weight: 500; margin-bottom: .3rem; }
  .charts svg { display: block; width: 100%; height: auto; overflow: visible; }
  .charts .axis text { font: .6875rem var(--sans); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .charts .axis line { stroke: var(--rule); }
  .bars { display: grid; gap: .35rem; font-size: .8125rem; }
  .bars div { display: grid; grid-template-columns: minmax(0, 9rem) 1fr 3.4rem; gap: .5rem; align-items: center; }

  .method { max-width: 46rem; display: grid; gap: .75rem; font-size: .9375rem; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 48rem) {

    .bars div { grid-template-columns: minmax(0, 6.5rem) 1fr 3rem; }
  }
  /* The hub's header: one language at a time, the sections wrapping on a narrow screen */
  html:not([lang="az"]) [data-l="az"], html:not([lang="ru"]) [data-l="ru"], html:not([lang="en"]) [data-l="en"] { display: none !important; }
  header nav { flex-wrap: wrap; justify-content: flex-end; row-gap: .25rem; }

  @media (max-width: 40rem) {

<header class="hub-header"></header><script src="/shared/header.js"></script>
<div class="wrap">

</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  const q = qs.get('lang'); if (LANGS.includes(q)) return q;

  return 'az';

const NF = { az: 'ru-RU', ru: 'ru-RU', en: 'en-GB' };
const nf = (v) => new Intl.NumberFormat(NF[lang]).format(v);

const CAT_ORDER = ['lit', 'music', 'art', 'stage', 'rel', 'sci', 'mil', 'pol', 'biz', 'sport', 'other'];
const T = {

  erasL: 'Dövrlər', eras: ['1828-ə qədər', '1828–1920', '1920–1991', '1991-dən sonra'], catL: 'Peşə', catAll: 'Hamısı', grpL: 'Doğum yeri', grpAll: 'Hamısı (1897 qəzaları daxil)', grpDef: 'Standart: Respublika + İran', grpNote: '«1897-ci ilin digər qəzaları» (İrəvan, Zəngəzur, Borçalı, Dərbənd…) standart olaraq gizlidir: orada doğulanların çoxu erməni, gürcü, ləzgi, rusdur, Wikidata isə etnik mənsubiyyəti az yazır. Süzgəcdən seçib görə bilərsiniz.', sexL: 'Cins', sexAll: 'Hamısı', sexM: 'Kişilər', sexF: 'Qadınlar', topL: 'Qövs sayı',

  methodH: 'Metod və məhdudiyyətlər', method: () => `<p>Mənbə: Wikidata (CC0), sorğu xidməti query.wikidata.org. Seçilənlər: insan (Q5), doğum yeri (P19) koordinatı olan bir yer, ən azı bir Vikimedia səhifəsi (sitelink). Doğum yerinin nöqtəsi hubun öz sərhədlərinə görə yoxlanır: bugünkü 78 rayon, İranın 4 ostanının 55 şəhristanı və 1897-ci ildə ana dili kimi azərbaycancanı göstərənlərin ən azı 25% olduğu qəzalar (Dərbənd üçün 25 km-lik dairə). Etnik qrupu (P172) azərbaycanlı olanlar harada doğulmalarından asılı olmayaraq əlavə edilir.</p>

  covK: 'Охват', covH: 'Как видит Wikidata',
  covP: 'Это не «люди исторического Азербайджана», а те, кого записала Wikidata и у кого есть хотя бы одна страница Викимедиа. Цифры ниже показывают перекос.',

  methodH: 'Метод и ограничения', method: () => `<p>Источник: Wikidata (CC0), сервис запросов query.wikidata.org. Отбор: человек (Q5), место рождения (P19) с координатами и хотя бы одна страница Викимедиа (sitelink). Точка места рождения проверяется на попадание в границы из самого хаба: 78 нынешних районов и 55 шахрестанов четырёх иранских останов, уезды 1897 года, где азербайджанский назвали родным не менее 25% (для Дербента — круг 25 км). Отдельно взяты люди с этнической группой (P172) «азербайджанцы», где бы ни родились.</p>

  <li><b>Смешанные места рождения.</b> В группе «другие уезды» (Эривань, Зангезур, Борчалы, Дербент…) родилось много армян, грузин, лезгин, русских. Этническая группа в Wikidata указана у немногих, разделить нельзя; есть фильтр по группе.</li>
  <li><b>Путь.</b> Только рождение и смерть; места жизни (P551, P937) без дат, в дугу не входят и видны в карточке человека. Эпоха — по году смерти, а не миграции.</li>
  <li><b>Координаты.</b> Если у места нет своих координат, берутся координаты вышестоящей единицы (P131); такие места неточны. Места рождения без координат выпадают.</li>
  <li><b>Живущие.</b> Люди без даты смерти, родившиеся после 1906 года, показаны только при странице минимум в трёх проектах Викимедиа; показано лишь то, что уже есть в Wikidata (имя, год, место).</li>

  <li><b>Не проверено.</b> У большинства утверждений Wikidata (место, дата) источник не указан; здесь они независимо не проверялись.</li></ul>`,

  covP: 'This is not "the people of historical Azerbaijan" but those Wikidata has recorded and that have at least one Wikimedia page. The figures below show the tilt.',
  decCap: 'People by decade of birth', gdM: 'men', gdF: 'women', gdO: 'other', grpCap: 'By birthplace', catCap: 'By occupation (one person, one group)', undated: 'no birth year',
  methodH: 'Method and limits', method: () => `<p>Source: Wikidata (CC0), the query service at query.wikidata.org. Selected: humans (Q5) with a place of birth (P19) that has coordinates and at least one Wikimedia page (sitelink). The birthplace point is tested against boundaries from the hub's own data: today's 78 districts, the 55 counties of the four Iranian provinces, and the 1897 uezds where at least 25% gave Azerbaijani as native language (a 25 km disc for Derbent). People whose ethnic group (P172) is Azerbaijani are added wherever they were born.</p>
  <ul><li><b>Tilt.</b> Wikidata over-represents the Soviet era, men, townspeople, writers and scholars; women are few, people before 1828 and peasants nearly absent. This is a portrait of written memory, not of the population.</li>
  <li><b>Mixed birthplaces.</b> The "other uezds" group (Erivan, Zangezur, Borchali, Derbent…) includes many Armenians, Georgians, Lezgians and Russians. Ethnic group is recorded on Wikidata for few people, so they cannot be told apart; there is a filter by group.</li>
  <li><b>The path.</b> Only birth and death; places lived in (P551, P937) are undated, not part of an arc, and appear on a person's card. The era is by the year of death, not of the move.</li>

  <li><b>Living people.</b> Those without a death date born after 1906 appear only with pages on at least three Wikimedia sites, and only what Wikidata already shows (name, year, place).</li>
  <li><b>Occupation colour.</b> Wikidata's occupations are sorted into 11 groups by keywords (scripts/build.mjs); a person gets the group counted most often. Rough.</li>
  <li><b>Unverified.</b> Most Wikidata claims (place, date) cite no source; none was independently checked here.</li></ul>`,

    ${langs ? `<dt>${t('pLang')}</dt><dd>${langs}</dd>` : ''}${r[R.unit] ? `<dt>${t('pGrp')}</dt><dd>${esc(r[R.unit])}</dd>` : ''}<dt>${t('pSites')}</dt><dd>${r[R.sl]}</dd></dl>

  history.replaceState(null, '', (() => { const u = new URL(location.href); u.searchParams.set('p', 'Q' + r[R.id]); return u; })());
  drawPath(i);
  if (scroll) $('h-find').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function drawPath(i) {
  const r = P[i], pts = [], feats = [];
  const bp = r[R.bp] >= 0 ? plc(r[R.bp]) : null, dp = r[R.dp] >= 0 ? plc(r[R.dp]) : null;
  if (bp) pts.push({ c: bp, k: 'b', n: plName(r[R.bp]) });
  r[R.res].forEach((p) => pts.push({ c: plc(p), k: 'r', n: plName(p) }));
  if (dp) pts.push({ c: dp, k: 'd', n: plName(r[R.dp]) });
  if (bp && dp && r[R.bp] !== r[R.dp]) feats.push({ type: 'Feature', properties: { l: 1 }, geometry: { type: 'LineString', coordinates: arc(bp, dp) } });
  const dashed = [];
  if (bp) r[R.res].forEach((p) => dashed.push({ type: 'Feature', properties: { l: 0 }, geometry: { type: 'LineString', coordinates: arc(bp, plc(p)) } }));
  const pf = pts.map((p) => ({ type: 'Feature', properties: { k: p.k, n: p.n }, geometry: { type: 'Point', coordinates: p.c } }));
  $('pnote').textContent = pts.length ? '' : t('pathNone');
  if (pmap) { try { pmap.remove(); } catch {} pmap = null; }
  if (!pts.length) { $('pmap').parentElement.hidden = true; return; }
  pmap = new maplibregl.Map({ container: 'pmap', style: `https://tiles.openfreemap.org/styles/${dark() ? 'dark' : 'positron'}`, center: pts[0].c, zoom: 5, attributionControl: { compact: true }, cooperativeGestures: phone() });
  pmap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  pmap.on('style.load', () => { for (const l of pmap.getStyle().layers) { if (l.type === 'background') pmap.setPaintProperty(l.id, 'background-color', css('--land')); if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) pmap.setPaintProperty(l.id, 'fill-color', css('--water')); if (l.type === 'symbol' && l.layout?.['text-field']) pmap.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']]); } });
  pmap.on('load', () => {
    pmap.addSource('l', { type: 'geojson', data: { type: 'FeatureCollection', features: [...dashed, ...feats] } });
    pmap.addSource('p', { type: 'geojson', data: { type: 'FeatureCollection', features: pf } });
    pmap.addLayer({ id: 'ld', type: 'line', source: 'l', filter: ['==', ['get', 'l'], 0], paint: { 'line-color': css('--muted'), 'line-width': 1.2, 'line-dasharray': [2, 2] } });
    pmap.addLayer({ id: 'ls', type: 'line', source: 'l', filter: ['==', ['get', 'l'], 1], layout: { 'line-cap': 'round' }, paint: { 'line-color': css('--accent'), 'line-width': 3 } });
    pmap.addLayer({ id: 'pt', type: 'circle', source: 'p', paint: { 'circle-radius': ['match', ['get', 'k'], 'r', 5, 7], 'circle-color': ['match', ['get', 'k'], 'b', css('--e1'), 'd', css('--accent'), css('--paper')], 'circle-stroke-width': 2, 'circle-stroke-color': ['match', ['get', 'k'], 'r', css('--muted'), css('--paper')] } });
    pmap.addLayer({ id: 'pl', type: 'symbol', source: 'p', layout: { 'text-field': ['get', 'n'], 'text-size': 12, 'text-offset': [0, 1.1], 'text-anchor': 'top', 'text-font': ['Noto Sans Regular'], 'text-allow-overlap': false }, paint: { 'text-color': css('--ink'), 'text-halo-color': css('--paper'), 'text-halo-width': 1.5 } });
    const b = new maplibregl.LngLatBounds(); pts.forEach((p) => b.extend(p.c));
    pmap.fitBounds(b, { padding: 50, maxZoom: 9, duration: 0 });
    window.__pmapReady = true;
  });
}
function suggest() {
  const want = [234908, 317397, 315158, 983507, 535932, 1366531, 361311];
  const byId = new Map(P.map((r, i) => [r[0], i]));
  const pick = want.map((q) => byId.get(q)).filter((x) => x != null);
  $('sugg').innerHTML = `<span>${esc(t('sugg'))}</span>` + pick.map((i) => `<button type="button" data-p="${i}">${esc(pname(P[i]))}</button>`).join('');
  bindPeople($('sugg'));
}

// ---- coverage
function coverage() {
  const st = D.stats, dec = st.decades, keys = Object.keys(dec).filter((k) => k !== 'u').map(Number).sort((a, b) => a - b);
  const lo = Math.max(keys[0], 1100), hi = keys.at(-1);
  const ds = []; for (let d = lo; d <= hi; d += 10) ds.push(d);
  // wide ranges before 1700 are pooled by century, so one chart tells the whole story
  const bins = []; const pool = (a, b) => { const v = [0, 0, 0]; for (let d = a; d < b; d += 10) (dec[d] ?? [0, 0, 0]).forEach((x, i) => (v[i] += x)); return v; };
  bins.push({ l: '<1700', v: pool(0, 1700), w: 4 }); for (let d = 1700; d <= hi; d += 10) bins.push({ l: String(d), v: dec[d] ?? [0, 0, 0], w: 1 });
  const rawMax = Math.max(...bins.map((b) => b.v[0] + b.v[1] + b.v[2])), max = Math.ceil(rawMax / 400) * 400, W = 640, H = 220, L = 36, B = 22, bw = (W - L) / bins.length;
  const col = [css('--e1'), css('--e2'), css('--off')]; // index 0 other, 1 male, 2 female per SEX codes
  const sc = { 1: css('--e1'), 2: css('--e2'), 0: css('--off') };
  let g = '', y0 = H - B;
  for (let k = 0; k <= 4; k++) { const v = Math.round((max * k) / 4); const y = y0 - ((H - B - 6) * k) / 4; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">${nf(v)}</text>`; }
  bins.forEach((b, i) => { let acc = 0; for (const s of [1, 2, 0]) { const h = ((H - B - 6) * b.v[s]) / max; g += `<rect x="${L + i * bw + 0.5}" y="${y0 - acc - h}" width="${Math.max(bw - 1, 1)}" height="${h}" fill="${sc[s]}"><title>${b.l}: ${b.v[s]}</title></rect>`; acc += h; } if (i === 0 || (i > 5 && b.l % 50 === 0)) g += `<text x="${L + i * bw}" y="${H - 6}" text-anchor="middle">${b.l}</text>`; });
  $('dec').setAttribute('viewBox', `0 0 ${W} ${H}`); $('dec').innerHTML = `<g class="axis">${g}</g>`;
  $('decCap').textContent = t('decCap');
  const tot = st.total, f = st.bySex[2], m = st.bySex[1];
  $('declgd').innerHTML = `<span><i style="--c:${sc[1]}"></i>${t('gdM')} ${nf(m)} (${Math.round((m / tot) * 100)}%)</span><span><i style="--c:${sc[2]}"></i>${t('gdF')} ${nf(f)} (${Math.round((f / tot) * 100)}%)</span><span><i style="--c:${sc[0]}"></i>${t('gdO')} ${nf(st.bySex[0])}</span><span>${t('undated')}: ${nf(tot - st.withBorn)}</span>`;
  $('grpCap').textContent = t('grpCap'); $('catCap').textContent = t('catCap');
  const bar = (rows) => { const mx = Math.max(...rows.map((r) => r[1])); return rows.map(([n, v, c]) => `<div><span class="t" title="${esc(n)}">${esc(n)}</span><span class="b"><i style="width:${(v / mx) * 100}%;--c:${c}"></i></span><span class="n">${nf(v)}</span></div>`).join(''); };
  $('grps').innerHTML = bar(D.grps.map((g, i) => [t('grps')[i], st.byGrp[g] ?? 0, css('--ink')]));
  const cc = catColors();
  $('cats').innerHTML = bar(CAT_ORDER.map((k, i) => [t('cats')[k], st.byCat[k] ?? 0, cc[i]]).sort((a, b) => b[1] - a[1]));
}

// ---- controls
function controls() {
  const ec = eraColors();
  $('eras').innerHTML = t('eras').map((e, i) => `<button type="button" class="chip" aria-pressed="${S.eras.has(i)}" data-e="${i}" style="--c:${ec[i]}"><i></i>${esc(e)}</button>`).join('');
  $('eras').querySelectorAll('[data-e]').forEach((b) => (b.onclick = () => { const e = +b.dataset.e; S.eras.has(e) ? S.eras.delete(e) : S.eras.add(e); if (!S.eras.size) S.eras.add(e); controls(); update(); }));
  const opt = (v, l, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${esc(l)}</option>`;
  $('fcat').innerHTML = opt(-1, t('catAll'), S.cat < 0) + CAT_ORDER.map((k, i) => opt(i, t('cats')[k], S.cat === i)).join('');
  $('fgrp').innerHTML = opt(-2, t('grpDef'), S.grp === -2) + opt(-1, t('grpAll'), S.grp === -1) + t('grps').map((g, i) => opt(i, g, S.grp === i)).join('');
  $('fsex').innerHTML = opt(0, t('sexAll'), S.sex === 0) + opt(1, t('sexM'), S.sex === 1) + opt(2, t('sexF'), S.sex === 2);
  const seg = (id, items, cur, key) => { $(id).innerHTML = items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${cur === v}">${esc(l)}</button>`).join(''); $(id).querySelectorAll('button').forEach((b) => (b.onclick = () => { S[key] = b.dataset.v; controls(); if (key === 'lay') { if (gReady) makeGraph(); } else refreshNet(); })); };
  seg('lay', [['geo', t('lay')[0]], ['force', t('lay')[1]]], S.lay, 'lay');
  seg('col', [['cat', t('col')[0]], ['era', t('col')[1]]], S.col, 'col');
}
let ut = 0;
function update() { clearTimeout(ut); ut = setTimeout(() => { refilter(); drawMap(); if (G) refreshNet(); $('routeList').innerHTML = ''; if (mapReady) map.getSource('sel').setData({ type: 'FeatureCollection', features: [] }); }, 30); }
$('fcat').onchange = (e) => { S.cat = +e.target.value; update(); };
$('fgrp').onchange = (e) => { S.grp = +e.target.value; update(); };
$('fsex').onchange = (e) => { S.sex = +e.target.value; update(); };
$('ftop').oninput = (e) => { S.top = +e.target.value; drawMap(); };
$('mreg').onclick = () => map.fitBounds(regionBox, { padding: 10, duration: 600 });
$('mwide').onclick = () => { if (!cur?.shown.length) return; const b = new maplibregl.LngLatBounds(); cur.shown.forEach((x) => { b.extend(plc(x.bp)); b.extend(plc(x.dp)); }); map.fitBounds(b, { padding: 30, duration: 600 }); };
let qt = 0; $('q').oninput = () => { clearTimeout(qt); qt = setTimeout(runSearch, 120); };

function applyLang() {
  document.documentElement.lang = lang; document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((e) => { const v = t(e.dataset.i18n); if (typeof v === 'string') e.textContent = v; });
  document.querySelectorAll('[data-i18n-label]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.i18nLabel)));
  document.querySelectorAll('[data-i18n-ph]').forEach((e) => e.setAttribute('placeholder', t(e.dataset.i18nPh)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
  $('kx-nav').href = `https://kitabxana.az${lang === 'az' ? '' : '/' + lang}/`;
  $('mapP').textContent = t('mapP'); $('netP').textContent = t('netP'); $('findP').textContent = t('findP'); $('covP').textContent = t('covP');
  $('grpNote').textContent = t('grpNote'); $('mreg').textContent = t('mreg'); $('mwide').textContent = t('mwide'); G?.setStrings({ search: t('gsearch') }); $('mapHint').textContent = t('mapHint'); $('gload').textContent = t('gload');
  $('method').innerHTML = t('method')(); $('ftop').setAttribute('aria-label', t('topL')); $('cg').setAttribute('aria-label', t('netL'));
  if (!D) return;
  $('lede').textContent = t('lede')(D.stats.total, D.stats.withDeathPlace); $('foot').innerHTML = t('foot')(D.built);
  controls(); stats(); legendMap(); legendNet(); coverage(); suggest();
  if (G && NET) { $('netHint').textContent = t('netStats')(NET.nodes.size, NET.links.size) + '. ' + t('netHint'); G.relabel(); }
  if (curP >= 0) selectPerson(curP, false);
}
document.querySelectorAll('[data-lang]').forEach((b) => (b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  applyLang();
}));
// The maps change style in place (shared/theme.js); the network, the legends and the colours drawn from CSS follow
addEventListener('themechange', () => setTimeout(() => { try { legendMap(); legendNet(); G?.relabel(); } catch {} }));
applyLang();
$('gload').textContent = t('gload');

fetch('data/insanlar.json').then((r) => r.json()).then((d) => {
  D = d; P = d.people; PL = d.places; D.cats.forEach((k, i) => (catIdx[k] = i));
  refilter(); initMap(); drawMap(); buildIndex(); applyLang();
  // the network starts when it comes into view
  const go = () => { if (!gReady) makeGraph(); };
  if ('IntersectionObserver' in window) { const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { go(); io.disconnect(); } }, { rootMargin: '300px' }); io.observe($('cg')); } else go();
  const pq = qs.get('p'); if (pq) { const i = P.findIndex((r) => 'Q' + r[0] === pq); if (i >= 0) selectPerson(i, false); }
  window.__people = { P, PL, S };
}).catch((e) => { console.error(e); $('lede').textContent = 'Error: ' + e.message; });
})();
</script>
