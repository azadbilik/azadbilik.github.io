<style>
  /* On top of the story maps' panel and legend: the measure switch, the census rounds, the chart */
  .controls { padding: 1rem 1.5rem; border-bottom: 1px solid var(--rule); display: grid; gap: .9rem; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); border-radius: 3px; padding: 2px; }
  .seg button { padding: .35rem .4rem; border-radius: 2px; font-size: .8125rem; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .rounds { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .rounds button { padding: .3rem 0; font-size: .75rem; color: var(--muted); border-bottom: 2px solid var(--rule); font-variant-numeric: tabular-nums; }
  .rounds button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .round-note { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .round-note select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: .1rem .3rem; }
  .timeline { display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: end; }
  .play { width: 2rem; height: 2rem; border: 1px solid var(--rule); border-radius: 50%; display: grid; place-items: center; font-size: .75rem; }
  .play:hover { border-color: var(--ink); }
  .check { display: flex; align-items: center; gap: .5rem; font-size: .8125rem; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); }
  .search input { width: 100%; font: inherit; font-size: .875rem; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: .4rem .6rem; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .spark { display: block; margin-top: .25rem; }
  .unit .trend { padding: .5rem 1.5rem 0; }
  .unit .trend svg { width: 100%; height: auto; display: block; overflow: visible; }
  .unit .trend text { font: .625rem var(--sans); fill: var(--muted); }
  .unit .share { padding: .5rem 1.5rem 0; font-size: .8125rem; color: var(--muted); }
  .totals { padding: 1rem 1.5rem .5rem; display: grid; gap: .6rem; }
  .total { display: grid; grid-template-columns: 1fr auto; gap: 0 .75rem; align-items: baseline; }
  .total b { font: 400 1.5rem/1.1 var(--serif); font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
  .total span { font-size: .875rem; font-weight: 500; }
  .total small { font-size: .75rem; color: var(--muted); }
  .chart { padding: .25rem 1.5rem 1rem; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font: .625rem var(--sans); fill: var(--muted); }
  .rank h2, .unit h2 { padding: .75rem 1.5rem .35rem; font: 500 .75rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .rank ol { list-style: none; padding: 0 0 .5rem; }
  .rank li button { display: grid; grid-template-columns: 1.5rem 1fr auto; gap: .5rem; width: 100%; text-align: left; padding: .3rem 1.5rem; font-size: .875rem; }
  .rank li button:hover { background: var(--rule); }
  .rank .v { font-variant-numeric: tabular-nums; color: var(--muted); }
  .unit { padding: 1rem 0; }
  .unit .back { display: block; padding: 0 1.5rem .75rem; font-size: .8125rem; color: var(--muted); }
  .unit .back:hover { color: var(--ink); }
  .unit .title { padding: 0 1.5rem; font: 400 1.5rem/1.15 var(--serif); }
  .unit .where { padding: .15rem 1.5rem 0; font-size: .8125rem; color: var(--muted); }
  .unit table { width: calc(100% - 3rem); margin: .75rem 1.5rem 0; border-collapse: collapse; font-size: .875rem; font-variant-numeric: tabular-nums; }
  .unit th { text-align: left; font-weight: 500; color: var(--muted); font-size: .75rem; padding: .25rem 0; border-bottom: 1px solid var(--rule); }
  .unit td { padding: .3rem 0; border-bottom: 1px solid var(--rule); }
  .unit td:not(:first-child), .unit th:not(:first-child) { text-align: right; }
  .unit td a { color: var(--muted); text-decoration: none; } .unit td a:hover { color: var(--accent); }
  .up { color: var(--accent); } .down { color: var(--second); }
  .legend .ramp { display: flex; }
  .legend .ramp span { flex: 1; height: .6rem; }
  .legend .ticks { display: flex; justify-content: space-between; font-size: .625rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend .nodata { display: flex; align-items: center; gap: .4rem; color: var(--muted); }
  .legend .nodata i { width: .9rem; height: .6rem; background: repeating-linear-gradient(45deg, var(--rule) 0 2px, transparent 2px 4px); border: 1px solid var(--rule); }
  .legend { min-width: 13rem; }
  @media (max-width: 48rem) { .controls, .totals, .chart { padding-inline: 1rem; } .rank h2, .rank li button, .unit h2, .unit .title, .unit .where { padding-inline: 1rem; } .unit table { margin-inline: 1rem; width: calc(100% - 2rem); } .legend { min-width: 0; } }
</style>

<body>
<div id="map" role="region" aria-label="Xəritə"></div>

<aside class="panel">
  <div class="head">
    <div class="top"><a class="brand" href="/" data-keep-lang><svg viewBox="0 0 512 512" aria-hidden="true"><g class="star"><rect x="126" y="126" width="260" height="260"/><polygon points="256,72 440,256 256,440 72,256"/></g><polygon class="gem" points="256,196 316,256 256,316 196,256"/></svg>Azad Bilik</a><nav><a href="/atlas/" data-keep-lang>Atlas</a><span class="langs" role="group" aria-label="Dil · Язык · Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></span></nav></div>
    <h1 data-i18n="title">Əhali</h1>
    <p class="sub" data-i18n="sub">Tarixi Azərbaycan siyahıyaalmalar üzrə</p>
  </div>
  <div class="body" id="body">
    <div class="controls">
      <div class="search"><input type="search" id="find" list="units-list" autocomplete="off"><datalist id="units-list"></datalist></div>
      <div class="seg" role="group" id="measures"></div>
      <div>
        <div class="timeline"><button type="button" class="play" id="play">▶</button><div class="rounds" role="group" id="rounds"></div></div>
        <div class="round-note" id="round-note"></div>
      </div>
      <label class="check"><input type="checkbox" id="terrain"> <span data-i18n="terrain">3D: hündürlük sıxlığı göstərir</span></label>
    </div>
    <div id="side" aria-live="polite"></div>
  </div>
</aside>

<div class="legend" id="legend"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
const dark = window.abTheme ? abTheme.dark() : matchMedia('(prefers-color-scheme: dark)').matches;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const LANGS = ['az', 'ru', 'en'];
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch {}
  return 'az';
})();
const nf = () => new Intl.NumberFormat({ az: 'az-Latn-AZ', ru: 'ru-RU', en: 'en-GB' }[lang]);
const T = {
  az: { doc: 'Əhali · Azad Bilik', title: 'Əhali', sub: 'Tarixi Azərbaycan siyahıyaalmalar üzrə', maps: 'Xəritələr',
    terrain: '3D: hündürlük sıxlığı göstərir',
    pop: 'Əhali', density: 'Sıxlıq', change: 'Dəyişmə', perKm: 'nəfər/km²', since: (y) => `${y}-dən bəri`,
    az: 'Azərbaycan Respublikası', ir: 'İran Azərbaycanı', irNote: 'Şərqi və Qərbi Azərbaycan, Ərdəbil, Zəncan ostanları',
    onMap: (n, m) => `xəritədə ${m} bölgədən ${n}-i`, lastKnown: (y) => `son məlum rəqəm: ${y}`, carriedNote: 'son məlum rəqəm (bu il yoxdur)', find: 'Rayon və ya şəhristan axtar…', play: 'Siyahıyaalmaları ardıcıl göstər', pause: 'Dayandır', base: 'müqayisə:', rankIn: (k, n) => `${n} bölgə arasında ${k}-ci`, peak: (y) => `ən çox ${y}-də`, round: (a, i) => `Azərbaycan ${a} · İran ${i}`, top: 'Ən çox', back: '← Bütün bölgələr',
    year: 'İl', people: 'Əhali', chg: 'Dəyişmə', src: 'mənbə', area: (k) => `${k} km²`, nodata: 'məlumat yoxdur', city: 'şəhər',
    note: 'Siyahıyaalmalar iki ölkədə fərqli illərdə keçirilib; xəritə onları yaxın illər üzrə cütləşdirir. Sərhədlər bugünküdür. Siyahıyaalmada rəqəmi olmayan bölgə son məlum rəqəmlə, solğun göstərilir; hələ heç rəqəmi olmayan boş qalır. Rəqəmlər rəsmi siyahıyaalma nəticələridir, hər biri öz mənbəyi ilə.' },
  ru: { doc: 'Население · Azad Bilik', title: 'Население', sub: 'Исторический Азербайджан по переписям', maps: 'Карты',
    terrain: '3D: высота — плотность населения',
    pop: 'Население', density: 'Плотность', change: 'Изменение', perKm: 'чел./км²', since: (y) => `с ${y} г.`,
    az: 'Азербайджанская Республика', ir: 'Иранский Азербайджан', irNote: 'останы Восточный и Западный Азербайджан, Ардебиль, Зенджан',
    onMap: (n, m) => `на карте ${n} из ${m} единиц`, lastKnown: (y) => `последняя известная цифра: ${y}`, carriedNote: 'последняя известная цифра (за этот год нет)', find: 'Найти район или шахрестан…', play: 'Показать переписи по очереди', pause: 'Пауза', base: 'сравнить с:', rankIn: (k, n) => `${k}-е место из ${n}`, peak: (y) => `больше всего в ${y}`, round: (a, i) => `Азербайджан ${a} · Иран ${i}`, top: 'Крупнейшие', back: '← Все единицы',
    year: 'Год', people: 'Население', chg: 'Изменение', src: 'источник', area: (k) => `${k} км²`, nodata: 'нет данных', city: 'город',
    note: 'Переписи в двух странах проходили в разные годы; карта соединяет их по близким годам. Границы — нынешние. Единица без цифры в этой переписи показана бледно, с последней известной цифрой; та, у которой цифр ещё нет, остаётся пустой. Цифры — официальные итоги переписей, у каждой указан источник.' },
  en: { doc: 'Population · Azad Bilik', title: 'Population', sub: 'Historical Azerbaijan, census by census', maps: 'Maps',
    terrain: '3D: height shows people per km²',
    pop: 'Population', density: 'Density', change: 'Change', perKm: 'people/km²', since: (y) => `since ${y}`,
    az: 'Republic of Azerbaijan', ir: 'Iranian Azerbaijan', irNote: 'East and West Azerbaijan, Ardabil and Zanjan provinces',
    onMap: (n, m) => `${n} of ${m} units on the map`, lastKnown: (y) => `last known figure: ${y}`, carriedNote: 'last known figure (none this census)', find: 'Find a district or county…', play: 'Play the censuses in turn', pause: 'Pause', base: 'compared with:', rankIn: (k, n) => `${k} of ${n}`, peak: (y) => `largest in ${y}`, round: (a, i) => `Azerbaijan ${a} · Iran ${i}`, top: 'Largest', back: '← All units',
    year: 'Year', people: 'Population', chg: 'Change', src: 'source', area: (k) => `${k} km²`, nodata: 'no data', city: 'city',
    note: "The two countries counted in different years; the map pairs their censuses by the nearest year. Borders are today's. A unit with no figure at a census is shown faintly with its last known figure; one with no figure yet is left empty. The figures are the official census results, each with its source." },
};
const t = (k) => T[lang][k];
const L = (p) => p[lang] ?? p.az;

// Census rounds: each country's census nearest the same decade
const ROUNDS = [[1939, null], [1959, 1956], [1970, 1966], [1979, 1976], [1989, 1986], [1999, 1996], [2009, 2006], [2019, 2016]].map(([az, ir], i) => ({ i, az, ir }));
let round = ROUNDS.length - 1, base = null, measure = 'pop', units = [], sources = {}, official = {}, selected = null, hovered = null, playing = null, terrain = false;
// The view in the link (?m=density&y=1989&b=1959&u=Barda District), so a view can be shared
const params = new URLSearchParams(location.search);
if (['pop', 'density', 'change'].includes(params.get('m'))) measure = params.get('m');
const atYear = (y) => ROUNDS.findIndex((r) => String(r.az) === y || String(r.ir) === y);
if (atYear(params.get('y')) >= 0) round = atYear(params.get('y'));
if (atYear(params.get('b')) >= 0) base = atYear(params.get('b'));
terrain = params.get('v') === '3d';
const baseOf = () => (base != null && base < round ? base : round - 1);
const yearOf = (u, r = round) => ROUNDS[r]?.[u.country];
const popAt = (u, r = round) => u.pop[yearOf(u, r)] ?? null;
// No figure for this census: the last one known, shown as such (not for change: that would be 0%)
function carried(u, r = round) {
  if (popAt(u, r) != null) return null;
  for (let k = r - 1; k >= 0; k--) if (popAt(u, k) != null) return { pop: popAt(u, k), year: yearOf(u, k) };
  return null;
}
function value(u, r = round, m = measure) {
  const c = m !== 'change' && carried(u, r);
  const p = popAt(u, r) ?? (c ? c.pop : null);
  if (p == null) return null;
  if (m === 'pop') return p;
  if (m === 'density') return u.area ? p / u.area : null;
  const b = r === round ? baseOf() : r - 1;
  const before = b >= 0 ? popAt(u, b) : null;
  return before ? (p / before - 1) * 100 : null;
}

// Fixed classes, so a colour means the same in every census
const SCALES = {
  pop: { breaks: [10e3, 25e3, 50e3, 100e3, 200e3, 500e3], ticks: ['', '10k', '25k', '50k', '100k', '200k', '500k+'] },
  density: { breaks: [10, 25, 50, 100, 200, 500], ticks: ['', '10', '25', '50', '100', '200', '500+'] },
  change: { breaks: [-10, -2, 2, 10, 25, 50], ticks: ['', '−10%', '−2%', '+2%', '+10%', '+25%', '+50%'] },
};
const SEQ = dark ? ['#2B211B', '#4A2C24', '#6B3129', '#8E3430', '#B33A37', '#D45A55', '#F08A80'] : ['#F2E6DA', '#EACAB6', '#E0A88E', '#D2836A', '#BF5C48', '#A6362E', '#7A1B1E'];
const DIV = dark ? ['#2C5A6E', '#3F7D93', '#5E9DB0', '#3A322B', '#B5574F', '#D27063', '#F08A80'] : ['#1F5C73', '#4A8AA0', '#9CC3D0', '#EFE6DA', '#E5A58F', '#C9634E', '#9A2A25'];
const colors = () => measure === 'change' ? DIV : SEQ;
const classOf = (v) => SCALES[measure].breaks.filter((b) => v >= b).length;

const map = new maplibregl.Map({
  container: 'map',
  style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  bounds: [[43.5, 35], [51, 42]], minZoom: 4, maxZoom: 10,
  attributionControl: { compact: true, customAttribution: '<a href="https://www.geoboundaries.org">geoBoundaries</a> (CC BY-SA 3.0, ODbL) · stat.gov.az · Demoscope · amar.org.ir' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 60, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 32, bottom: 32, left: 27 * 16 + 32 };
const labelExpr = () => ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']];
map.on('style.load', () => {
  for (const l of map.getStyle().layers) {
    if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', css('--land'));
    if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', css('--water'));
    if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
  }
});

map.on('load', async () => {
  const [geo, src, tot] = await Promise.all(['units.geojson', 'sources.json', 'totals.json'].map((f) => fetch(`data/${f}`).then((r) => r.json())));
  sources = src; official = tot;
  geo.features.forEach((f, k) => { f.id = k; });
  units = geo.features.map((f) => ({ ...f.properties, fid: f.id }));
  map.fitBounds([[43.5, 35], [51, 42]], { padding: pad(), duration: 0 });
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
  // The choropleth sits under the base map's labels and roads
  const firstSymbol = map.getStyle().layers.find((l) => l.type === 'symbol')?.id;
  map.addSource('units', { type: 'geojson', data: geo });
  map.addLayer({ id: 'units', type: 'fill', source: 'units', paint: { 'fill-color': ['coalesce', ['feature-state', 'color'], 'rgba(0,0,0,0)'], 'fill-opacity': ['case', ['boolean', ['feature-state', 'carried'], false], .4, .85] } }, firstSymbol);
  // 3D (after The Pudding's «Human Terrain»): each unit raised by its density, the census on show; colour stays the measure
  map.addLayer({ id: 'units-3d', type: 'fill-extrusion', source: 'units', layout: { visibility: 'none' }, paint: {
    'fill-extrusion-color': ['coalesce', ['feature-state', 'color'], 'rgba(0,0,0,0)'],
    'fill-extrusion-height': ['coalesce', ['feature-state', 'h'], 0], 'fill-extrusion-opacity': .92,
    'fill-extrusion-height-transition': { duration: still() ? 0 : 900 } } });
  map.addLayer({ id: 'units-line', type: 'line', source: 'units', paint: {
    'line-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--ink'), ['boolean', ['feature-state', 'hover'], false], css('--ink'), css('--paper')],
    'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.25, ['boolean', ['feature-state', 'hover'], false], 1.5, .6],
  } }, firstSymbol);
  for (const layer of ['units', 'units-3d']) map.on('mousemove', layer, (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const u = units[e.features[0].id];
    if (hovered !== u.fid) {
      if (hovered != null) map.setFeatureState({ source: 'units', id: hovered }, { hover: false });
      hovered = u.fid;
      map.setFeatureState({ source: 'units', id: hovered }, { hover: true });
    }
    const c = measure !== 'change' && carried(u);
    tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(L(u))}</strong> · ${fmt(value(u))}${c ? ` <small>(${t('lastKnown')(c.year)})</small>` : ''}${spark(u, 120, 28)}`).addTo(map);
  });
  for (const layer of ['units', 'units-3d']) map.on('mouseleave', layer, () => {
    map.getCanvas().style.cursor = ''; tip.remove();
    if (hovered != null) map.setFeatureState({ source: 'units', id: hovered }, { hover: false });
    hovered = null;
  });
  for (const layer of ['units', 'units-3d']) map.on('click', layer, (e) => select(e.features[0].id, false));
  units.forEach((u) => { u.bbox = bboxOf(geo.features[u.fid].geometry); });
  document.getElementById('units-list').innerHTML = units.map((u) => `<option value="${esc(L(u))}">`).join('');
  map.on('click', (e) => { if (!map.queryRenderedFeatures(e.point, { layers: [terrain ? 'units-3d' : 'units'] }).length && selected != null) select(null); });
  draw();
  if (terrain) setTerrain(true, false);
  const start = params.get('u') && units.find((u) => u.key === params.get('u'));
  if (start) select(start.fid);
});

// height grows with the cube root of density, so the small city units do not stand up as needles; the camera tilts to see it
function setTerrain(on, ease = true) {
  terrain = on;
  document.getElementById('terrain').checked = on;
  if (!map.getLayer('units-3d')) return;
  map.setLayoutProperty('units-3d', 'visibility', on ? 'visible' : 'none');
  map.setLayoutProperty('units', 'visibility', on ? 'none' : 'visible');
  map.setLayoutProperty('units-line', 'visibility', on ? 'none' : 'visible');
  map.easeTo({ pitch: on ? 55 : 0, bearing: on ? -12 : 0, duration: ease && !still() ? 900 : 0 });
  keepUrl();
}
document.getElementById('terrain').onchange = (e) => setTerrain(e.target.checked);
function bboxOf(g) {
  let b = [180, 90, -180, -90];
  for (const poly of g.type === 'Polygon' ? [g.coordinates] : g.coordinates)
    for (const [x, y] of poly[0]) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)];
  return [[b[0], b[1]], [b[2], b[3]]];
}
// A unit's population over the censuses as a small line, the census on show marked
function spark(u, W, H, axis = false) {
  const pts = ROUNDS.map((r) => popAt(u, r.i));
  const vals = pts.filter((v) => v != null);
  if (vals.length < 2) return '';
  const max = Math.max(...vals), min = axis ? 0 : Math.min(...vals) * 0.9;
  const X = (i) => 4 + i * (W - 8) / (ROUNDS.length - 1), Y = (v) => (axis ? H - 14 : H - 3) - (v - min) / (max - min || 1) * (axis ? H - 22 : H - 6);
  const segs = pts.map((v, i) => v == null ? '|' : `${X(i)},${Y(v)}`).join(' ').split('|').map((x) => x.trim()).filter((x) => x.includes(' '));
  const c = u.country === 'az' ? css('--accent') : css('--second');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${segs.map((p) => `<polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.5"/>`).join('')}
    ${pts.map((v, i) => v == null ? '' : `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === round ? 3 : 1.6}" fill="${c}"/>`).join('')}
    ${axis ? ROUNDS.map((r, i) => `<text x="${X(i)}" y="${H}" text-anchor="middle">${r[u.country] ?? ''}</text>`).join('') : ''}</svg>`;
}

function fmt(v, m = measure) {
  if (v == null) return t('nodata');
  if (m === 'pop') return nf().format(Math.round(v));
  if (m === 'density') return `${nf().format(Math.round(v))} ${t('perKm')}`;
  return `${v > 0 ? '+' : ''}${v.toFixed(1)}%`;
}

function paint() {
  for (const u of units) {
    const v = value(u);
    const d = value(u, round, 'density');
    map.setFeatureState({ source: 'units', id: u.fid }, { color: v == null ? (dark ? 'rgba(255,255,255,.06)' : 'rgba(26,20,16,.07)') : colors()[classOf(v)], carried: v != null && measure !== 'change' && !!carried(u), h: d ? Math.cbrt(d) * 5500 : 0 });
  }
}

function drawControls() {
  const ms = document.getElementById('measures');
  ms.innerHTML = ['pop', 'density', 'change'].map((m) => `<button type="button" data-m="${m}" aria-pressed="${m === measure}">${t(m)}</button>`).join('');
  ms.querySelectorAll('button').forEach((b) => b.onclick = () => { measure = b.dataset.m; base = null; draw(); });
  const rs = document.getElementById('rounds');
  rs.innerHTML = ROUNDS.map((r) => `<button type="button" data-r="${r.i}" aria-pressed="${r.i === round}" ${measure === 'change' && r.i === 0 ? 'disabled' : ''}>${r.az}</button>`).join('');
  rs.querySelectorAll('button').forEach((b) => b.onclick = () => { if (playing) togglePlay(); round = +b.dataset.r; draw(); });
  const r = ROUNDS[round];
  const note = document.getElementById('round-note');
  note.innerHTML = `<span>${t('round')(r.az, r.ir ?? '—')}</span>` + (measure === 'change' && round > 0
    ? `<label>${t('base')} <select id="base">${ROUNDS.filter((x) => x.i < round).map((x) => `<option value="${x.i}"${x.i === baseOf() ? ' selected' : ''}>${x.az}${x.ir ? ` · ${x.ir}` : ''}</option>`).join('')}</select></label>` : '');
  const sel = document.getElementById('base');
  if (sel) sel.onchange = () => { base = +sel.value; draw(); };
  const play = document.getElementById('play');
  play.textContent = playing ? '❚❚' : '▶';
  play.setAttribute('aria-label', playing ? t('pause') : t('play'));
  play.title = play.getAttribute('aria-label');
}

// Play: a census every second and a half, from the first (with a change: the second) to the last
function togglePlay() {
  if (playing) { clearInterval(playing); playing = null; drawControls(); return; }
  const first = measure === 'change' ? 1 : 0;
  if (round >= ROUNDS.length - 1) round = first;
  base = null;
  playing = setInterval(() => {
    if (round >= ROUNDS.length - 1) { clearInterval(playing); playing = null; drawControls(); return; }
    round++; draw();
  }, still() ? 2500 : 1500);
  draw();
}

function drawLegend() {
  const s = SCALES[measure], c = colors();
  document.getElementById('legend').innerHTML = `<span>${t(measure)}${measure === 'density' ? `, ${t('perKm')}` : ''}</span>
    <div class="ramp">${c.map((x) => `<span style="background:${x}"></span>`).join('')}</div>
    <div class="ticks">${s.ticks.slice(1).map((x) => `<span>${x}</span>`).join('')}</div>
    ${measure !== 'change' ? `<div class="nodata"><i style="background:${colors()[3]};opacity:.4"></i>${t('carriedNote')}</div>` : ''}
    <div class="nodata"><i></i>${t('nodata')}</div>`;
}

// Each side's official census total (data/totals.json); the units on the map are counted
// separately, since they don't always cover the whole (missing districts, older counties)
function totals(country, r = round) {
  const us = units.filter((u) => u.country === country && !u.inDistrict);
  const n = us.filter((u) => popAt(u, r) != null).length;
  const o = official[country]?.[ROUNDS[r][country]];
  return { sum: o?.population ?? null, source: o?.source, n, of: us.length };
}
function chart() {
  const W = 320, H = 90, P = 18;
  const series = ['az', 'ir'].map((c) => ({ c, pts: ROUNDS.map((r) => totals(c, r.i).sum) }));
  const max = Math.max(1, ...series.flatMap((s) => s.pts.filter(Boolean)));
  const X = (i) => P + i * (W - 2 * P) / (ROUNDS.length - 1), Y = (v) => H - 14 - (v / max) * (H - 24);
  // A gap in a series (no official total that census) breaks its line
  const line = (s) => s.pts.map((v, i) => v == null ? '|' : `${X(i)},${Y(v)}`).join(' ').split('|').map((x) => x.trim()).filter((x) => x.includes(' ')).map((pts) => `<polyline points="${pts}" fill="none" stroke-width="1.75"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('pop')}">
    ${series.map((s, k) => `<g stroke="${k ? css('--second') : css('--accent')}">${line(s).join('')}</g>
      ${s.pts.map((v, i) => v == null ? '' : `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === round ? 3.5 : 2}" fill="${k ? css('--second') : css('--accent')}"/>`).join('')}`).join('')}
    ${ROUNDS.map((r, i) => `<text x="${X(i)}" y="${H}" text-anchor="middle">${r.az}</text>`).join('')}
  </svg>`;
}

function drawSide() {
  const el = document.getElementById('side');
  if (selected != null) return drawUnit(el, units[selected]);
  const tot = (c) => { const x = totals(c); return `<div class="total"><span>${t(c)}</span><b>${x.sum != null ? nf().format(x.sum) : '—'}</b><small>${c === 'ir' ? t('irNote') + ' · ' : ''}${yearOf({ country: c }) ?? '—'} · ${t('onMap')(x.n, x.of)}</small></div>`; };
  const ranked = units.filter((u) => value(u) != null).sort((a, b) => value(b) - value(a)).slice(0, 12);
  el.innerHTML = `<div class="totals">${tot('az')}${tot('ir')}</div><div class="chart">${chart()}</div>
    <section class="rank"><h2>${t('top')}: ${t(measure).toLowerCase()}</h2><ol>${ranked.map((u, i) => `<li><button type="button" data-u="${u.fid}"><span class="v">${i + 1}</span><span>${esc(L(u))}</span><span class="v">${fmt(value(u))}</span></button></li>`).join('')}</ol></section>
    <p class="note">${t('note')}</p>`;
  el.querySelectorAll('[data-u]').forEach((b) => b.onclick = () => select(+b.dataset.u));
}

function drawUnit(el, u) {
  const rows = ROUNDS.filter((r) => r[u.country] != null).map((r) => {
    const y = r[u.country], p = u.pop[y];
    const prev = r.i > 0 ? u.pop[ROUNDS[r.i - 1][u.country]] : null;
    const ch = p != null && prev ? (p / prev - 1) * 100 : null;
    const s = sources[u.id]?.[y];
    return `<tr><td>${y}</td><td>${p != null ? nf().format(p) : '—'}</td><td class="${ch > 0 ? 'up' : ch < 0 ? 'down' : ''}">${ch != null ? fmt(ch, 'change') : ''}</td><td>${s ? `<a href="${esc(s)}" target="_blank" rel="noopener">${t('src')} ↗</a>` : ''}</td></tr>`;
  }).join('');
  const where = u.country === 'az' ? t('az') : `${t('ir')}${u.province ? ` · ${u.province}` : ''}`;
  const ranked = units.filter((x) => value(x) != null && !x.inDistrict).sort((a, b) => value(b) - value(a));
  const k = ranked.indexOf(u);
  const peakYear = Object.entries(u.pop).sort((a, b) => b[1] - a[1])[0]?.[0];
  el.innerHTML = `<div class="unit"><button type="button" class="back" id="back">${t('back')}</button>
    <p class="title">${esc(L(u))}</p><p class="where">${esc(where)} · ${t('area')(nf().format(u.area))}</p>
    <p class="share">${value(u) != null ? `${fmt(value(u))}${carried(u) && measure !== 'change' ? ` (${t('lastKnown')(carried(u).year)})` : ''}${k >= 0 ? ` · ${t('rankIn')(k + 1, ranked.length)}` : ''}` : t('nodata')}${peakYear ? ` · ${t('peak')(peakYear)}` : ''}</p>
    <div class="trend">${spark(u, 320, 96, true)}</div>
    <table><thead><tr><th>${t('year')}</th><th>${t('people')}</th><th>${t('chg')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  document.getElementById('back').onclick = () => select(null);
}

function select(fid, fly = true) {
  if (selected != null) map.setFeatureState({ source: 'units', id: selected }, { sel: false });
  selected = fid;
  if (fid != null) map.setFeatureState({ source: 'units', id: fid }, { sel: true });
  if (fid != null && fly) map.fitBounds(units[fid].bbox, { padding: pad(), maxZoom: 8, duration: still() ? 0 : 700 });
  drawSide(); keepUrl();
  document.getElementById('body').scrollTop = phone() ? document.getElementById('side').offsetTop - 8 : 0;
}

function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (measure !== 'pop') q.set('m', measure);
  if (terrain) q.set('v', '3d');
  if (round !== ROUNDS.length - 1) q.set('y', ROUNDS[round].az);
  if (measure === 'change' && base != null && base !== round - 1) q.set('b', ROUNDS[base].az);
  if (selected != null && units[selected]) q.set('u', units[selected].key);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}

function draw() {
  if (measure === 'change' && round === 0) round = 1;
  drawControls(); drawLegend(); drawSide();
  if (map.getSource('units')) paint();
  if (units.length) keepUrl();
}

document.getElementById('play').onclick = togglePlay;
// Find: a name typed or picked from the list, in any of the three languages
document.getElementById('find').addEventListener('change', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const u = units.find((x) => [x.az, x.ru, x.en, x.key].some((n) => n?.toLowerCase() === q)) ?? units.find((x) => [x.az, x.ru, x.en].some((n) => n?.toLowerCase().startsWith(q)));
  if (u) { select(u.fid); e.target.value = ''; e.target.blur(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea')) return;
  const first = measure === 'change' ? 1 : 0;
  if (e.key === 'ArrowRight' && round < ROUNDS.length - 1) { round++; draw(); }
  if (e.key === 'ArrowLeft' && round > first) { round--; draw(); }
  if (e.key === 'Escape' && selected != null) select(null);
});

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('find').placeholder = t('find');
  if (units.length) document.getElementById('units-list').innerHTML = units.map((u) => `<option value="${esc(L(u))}">`).join('');
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href);
  if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang);
  history.replaceState(null, '', u);
  applyLang(); draw();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
</body>
</html>
