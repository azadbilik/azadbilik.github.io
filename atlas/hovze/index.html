    map.setPaintProperty('rivers-glow', 'line-width', ['*', w, 3]);

function stopMonths() { clearInterval(monthTimer); monthTimer = null; const b = document.getElementById('mplay'); if (b) b.textContent = '▶'; }

function drawRain() { const b = document.getElementById('rain'); b.setAttribute('aria-pressed', rainMode); b.lastChild.textContent = t(rainMode ? 'rainOn' : 'rain'); map.getCanvas().style.cursor = rainMode ? 'crosshair' : ''; }

const DASH = [[0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5], [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0], [0, 0.5, 3, 3.5], [0, 1, 3, 3], [0, 1.5, 3, 2.5], [0, 2, 3, 2], [0, 2.5, 3, 1.5], [0, 3, 3, 1], [0, 3.5, 3, 0.5]].map((d) => d.map((x) => x * 3));

// A small chevron pointing along the line (east = downstream), drawn once

function bboxOf(g) { let b = [180, 90, -180, -90]; for (const l of g.coordinates) for (const [x, y] of l) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; return [[b[0], b[1]], [b[2], b[3]]]; }
