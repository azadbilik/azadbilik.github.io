<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kür–Araz hövzəsi · Azad Bilik</title>
<meta name="description" content="Kür–Araz hövzəsi: Kür, Araz, Samur, Qanıx, Qabırlı, Tərtər və 150-dən çox çay, uzunluqları və adları ilə. The Kura–Araz basin: rivers and lakes.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://azadbilik.org/atlas/hovze/">
<meta property="og:title" content="Kür–Araz hövzəsi · The Kura–Araz basin">
<meta property="og:description" content="Kür, Araz və Azərbaycanın 150-dən çox çayı xəritədə.">
<meta property="og:image" content="https://azadbilik.org/atlas/hovze/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/shared/story-map.css">
<style>
  .search input { width: 100%; font: inherit; font-size: .875rem; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: .4rem .6rem; }
  .controls { padding: 1rem 1.5rem; border-bottom: 1px solid var(--rule); }
  .riverlist { list-style: none; padding: .25rem 0 .5rem; }
  .riverlist button { display: grid; grid-template-columns: 1fr auto; gap: .75rem; width: 100%; text-align: left; padding: .35rem 1.5rem; font-size: .875rem; }
  .riverlist button:hover { background: var(--rule); }
  .riverlist button[aria-pressed="true"] { background: var(--rule); box-shadow: inset 2px 0 var(--accent); font-weight: 500; }
  .riverlist .v { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .river { padding: 1rem 1.5rem; display: grid; gap: .35rem; font-size: .875rem; }
  .river h2 { font: 400 1.5rem/1.15 var(--serif); }
  .river .k { color: var(--muted); }
  .river a { color: inherit; }
  .rank h2 { padding: .75rem 1.5rem .35rem; font: 500 .75rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .back { display: block; padding: 1rem 1.5rem 0; font-size: .8125rem; color: var(--muted); }
  .legend .row { display: flex; align-items: center; gap: .5rem; }
  .legend .row b { display: inline-block; width: 1.75rem; background: var(--second); border-radius: 2px; }
  @media (max-width: 48rem) { .controls, .river { padding-inline: 1rem; } .riverlist button, .rank h2 { padding-inline: 1rem; } }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Xəritə"></div>

<aside class="panel">
  <div class="head">
    <div class="top"><a class="brand" href="/" data-keep-lang><svg viewBox="0 0 512 512" aria-hidden="true"><g class="star"><rect x="126" y="126" width="260" height="260"/><polygon points="256,72 440,256 256,440 72,256"/></g><polygon class="gem" points="256,196 316,256 256,316 196,256"/></svg>Azad Bilik</a><nav><a href="/atlas/" data-keep-lang>Atlas</a><span class="langs" role="group" aria-label="Dil · Язык · Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></span></nav></div>
    <h1 data-i18n="title">Kür–Araz hövzəsi</h1>
    <p class="sub" data-i18n="sub">Azərbaycanın çayları və gölləri</p>
  </div>
  <div class="controls"><div class="search"><input type="search" id="find" autocomplete="off"></div></div>
  <div class="body" id="body" aria-live="polite"></div>
</aside>

<div class="legend" id="legend"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const LANGS = ['az', 'ru', 'en'];
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch {}
  return 'az';
})();
const nf = () => new Intl.NumberFormat({ az: 'az-Latn-AZ', ru: 'ru-RU', en: 'en-GB' }[lang]);
const T = {
  az: { doc: 'Kür–Araz hövzəsi · Azad Bilik', title: 'Kür–Araz hövzəsi', sub: 'Çaylar və göllər', find: 'Çay axtar…', rivers: (n) => `${n} çay`, lakes: 'Göllər və su anbarları', length: 'Uzunluğu', whole: 'bütün uzunluğu, mənbədən mənsəbədək', inAz: 'Azərbaycandakı hissəsi', names: 'Adları', back: '← Bütün çaylar', km: 'km', area: 'sahəsi', wiki: 'Vikipediya',
    legend: 'Çay: xəttin qalınlığı uzunluğa görə, ştrixlər axın istiqamətində', legendStill: 'Çay: xəttin qalınlığı uzunluğa görə, oxlar axın istiqamətində', lake: 'göl', reservoir: 'su anbarı', lakeL: 'göl, su anbarı',
    note: 'Çaylar və göllər OpenStreetMap-dəndir (ODbL). Uzunluq xəritədəki xəttə görə ölçülüb və rəsmi rəqəmlərdən bir qədər fərqlənə bilər: Kür üçün 1471 km (soraqlarda ~1515), Araz üçün 1068 km (~1072). Kür və Arazın 10 km-dən uzun bütün qolları (qolların qolları da) Gürcüstanda, Ermənistanda, Türkiyədə və İranda da, bütün uzunluğu ilə göstərilir, onların keçdiyi göllər və su anbarları ilə (Göyçə, Arpi…); Azərbaycanın başqa çayları ölkədəki hissəsi ilə.' },
  ru: { doc: 'Бассейн Куры и Аракса · Azad Bilik', title: 'Бассейн Куры и Аракса', sub: 'Реки и озёра', find: 'Найти реку…', rivers: (n) => `${n} рек`, lakes: 'Озёра и водохранилища', length: 'Длина', whole: 'вся длина, от истока до устья', inAz: 'часть в Азербайджане', names: 'Названия', back: '← Все реки', km: 'км', area: 'площадь', wiki: 'Википедия',
    legend: 'Река: толщина линии — по длине, штрихи — по течению', legendStill: 'Река: толщина линии — по длине, стрелки — по течению', lake: 'озеро', reservoir: 'водохранилище', lakeL: 'озеро, водохранилище',
    note: 'Реки и озёра — из OpenStreetMap (ODbL). Длина измерена по линии на карте и может немного отличаться от официальной: Кура 1471 км (по справочникам ~1515), Аракс 1068 км (~1072). Все притоки Куры и Аракса длиннее 10 км (и притоки притоков) показаны на всём протяжении, в Грузии, Армении, Турции и Иране тоже, с озёрами и водохранилищами на них (Севан, Арпи…); остальные реки Азербайджана — их частью в стране.' },
  en: { doc: 'The Kura–Araz basin · Azad Bilik', title: 'The Kura–Araz basin', sub: 'Rivers and lakes', find: 'Find a river…', rivers: (n) => `${n} rivers`, lakes: 'Lakes and reservoirs', length: 'Length', whole: 'whole length, source to mouth', inAz: 'the part in Azerbaijan', names: 'Names', back: '← All rivers', km: 'km', area: 'area', wiki: 'Wikipedia',
    legend: 'River: line width by length, dashes run downstream', legendStill: 'River: line width by length, arrows point downstream', lake: 'lake', reservoir: 'reservoir', lakeL: 'lake, reservoir',
    note: "Rivers and lakes are from OpenStreetMap (ODbL). Lengths are measured along the mapped line and may differ a little from official figures: the Kura 1,471 km (references ~1,515), the Araz 1,068 km (~1,072). Every tributary of the Kura and the Araz longer than 10 km (and theirs in turn) is shown over its whole length, in Georgia, Armenia, Turkey and Iran too, with the lakes and reservoirs on them (Sevan, Arpi…); Azerbaijan's other rivers by their part in the country." },
};
const t = (k) => T[lang][k];
const L = (p) => p[lang] || p.az;
let rivers = [], lakes = [], geo = null, lakeGeo = null, selected = null, hovered = null, query = '';
const params = new URLSearchParams(location.search);

const map = new maplibregl.Map({
  container: 'map', style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  bounds: [[41.0, 37.6], [50.4, 42.8]], minZoom: 4, maxZoom: 12,
  attributionControl: { compact: true, customAttribution: 'Rivers and lakes: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a> (ODbL)' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 60, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 32, bottom: 32, left: 27 * 16 + 32 };
const labelExpr = () => ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']];
map.on('style.load', () => {
  for (const l of map.getStyle().layers) {
    if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', css('--land'));
    if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', css('--water'));
    // The base map's own rivers stay faint under ours
    if (l.type === 'line' && /waterway|river/.test(l.id)) map.setPaintProperty(l.id, 'line-opacity', .25);
    if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
  }
});
map.on('load', async () => {
  const [rg, lg] = await Promise.all(['rivers.geojson', 'lakes.geojson'].map((f) => fetch(`data/${f}`).then((r) => r.json())));
  geo = rg; lakeGeo = lg;
  rg.features.forEach((f, k) => { f.id = k; });
  lg.features.forEach((f, k) => { f.id = k; });
  rivers = rg.features.map((f) => ({ ...f.properties, fid: f.id, bbox: bboxOf(f.geometry) }));
  lakes = lg.features.map((f) => ({ ...f.properties, fid: f.id }));
  map.fitBounds([[41.0, 37.6], [50.4, 42.8]], { padding: pad(), duration: 0 });
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
  const C = css('--second');
  map.addSource('lakes', { type: 'geojson', data: lg });
  map.addLayer({ id: 'lakes', type: 'fill', source: 'lakes', paint: { 'fill-color': C, 'fill-opacity': .45 } });
  map.addSource('rivers', { type: 'geojson', data: rg });
  // Width by length: the Kür and Araz boldest, brooks hairlines; the chosen river in ink
  const width = ['interpolate', ['linear'], ['get', 'length'], 3, .6, 50, 1.2, 200, 2.2, 1000, 3.5];
  map.addLayer({ id: 'rivers-hit', type: 'line', source: 'rivers', paint: { 'line-color': 'rgba(0,0,0,0)', 'line-width': 10 } });
  map.addLayer({ id: 'rivers', type: 'line', source: 'rivers', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: {
    'line-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--accent'), ['boolean', ['feature-state', 'hover'], false], css('--ink'), C],
    'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], ['*', width, 1.8], width],
    'line-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], .3, .9],
  } });
  // Which way the water runs (OSM draws every river downstream): dashes drifting along the line,
  // or, for readers who ask for less motion, small chevrons
  map.addLayer({ id: 'rivers-flow', type: 'line', source: 'rivers', layout: { 'line-cap': 'butt', 'line-join': 'round', visibility: still() ? 'none' : 'visible' }, paint: {
    'line-color': css('--paper'),
    // At the country's scale only the chosen river flows; from zoom 7 all of them
    'line-opacity': ['interpolate', ['linear'], ['zoom'], 6.5, ['case', ['boolean', ['feature-state', 'sel'], false], .8, 0], 7.5, ['case', ['boolean', ['feature-state', 'dim'], false], .15, .7]],
    'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], ['*', width, .7], ['*', width, .55]], 'line-dasharray': DASH[0],
  } });
  map.addImage('chevron', chevron(), { pixelRatio: 2 });
  map.addLayer({ id: 'rivers-arrows', type: 'symbol', source: 'rivers', filter: ['>=', ['get', 'length'], 15], layout: {
    visibility: still() ? 'visible' : 'none', 'symbol-placement': 'line', 'symbol-spacing': 70, 'icon-image': 'chevron', 'icon-size': ['interpolate', ['linear'], ['zoom'], 5, .6, 9, 1],
    'icon-rotation-alignment': 'map', 'icon-allow-overlap': true, 'icon-ignore-placement': true,
  }, paint: { 'icon-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], .25, .85] } });
  flow();
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { map.setLayoutProperty('rivers-flow', 'visibility', still() ? 'none' : 'visible'); map.setLayoutProperty('rivers-arrows', 'visibility', still() ? 'visible' : 'none'); flow(); drawLegend(); });
  map.addLayer({ id: 'river-names', type: 'symbol', source: 'rivers', filter: ['>=', ['get', 'length'], 40], layout: {
    'symbol-placement': 'line', 'text-field': ['get', lang], 'text-font': ['Noto Sans Italic'], 'text-size': 11, 'symbol-spacing': 400,
  }, paint: { 'text-color': C, 'text-halo-color': css('--paper'), 'text-halo-width': 1.5 } });
  map.on('mousemove', 'rivers-hit', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const r = rivers[e.features[0].id];
    if (hovered !== r.fid) { if (hovered != null) map.setFeatureState({ source: 'rivers', id: hovered }, { hover: false }); hovered = r.fid; map.setFeatureState({ source: 'rivers', id: hovered }, { hover: true }); }
    tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(L(r))}</strong> · ${nf().format(r.length)} ${t('km')}`).addTo(map);
  });
  map.on('mouseleave', 'rivers-hit', () => { map.getCanvas().style.cursor = ''; tip.remove(); if (hovered != null) map.setFeatureState({ source: 'rivers', id: hovered }, { hover: false }); hovered = null; });
  map.on('click', 'rivers-hit', (e) => select(e.features[0].id));
  map.on('click', 'lakes', (e) => { if (!map.queryRenderedFeatures(e.point, { layers: ['rivers-hit'] }).length) zoomLake(e.features[0].id); });
  map.on('mouseenter', 'lakes', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mousemove', 'lakes', (e) => { const l = lakes[e.features[0].id]; tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(L(l))}</strong>`).addTo(map); });
  map.on('mouseleave', 'lakes', () => { tip.remove(); map.getCanvas().style.cursor = ''; });
  const start = params.get('r') && rivers.find((r) => r.id === params.get('r'));
  draw();
  if (start) select(start.fid);
});
function zoomLake(i) { const f = lakeGeo.features[i]; let bb = [180, 90, -180, -90]; for (const poly of f.geometry.coordinates) for (const [x, y] of poly[0]) bb = [Math.min(bb[0], x), Math.min(bb[1], y), Math.max(bb[2], x), Math.max(bb[3], y)]; map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: pad(), maxZoom: 11, duration: still() ? 0 : 700 }); }
// The marching-dash steps (MapLibre's line animation): each step moves the gap a little downstream
const DASH = [[0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5], [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0], [0, 0.5, 3, 3.5], [0, 1, 3, 3], [0, 1.5, 3, 2.5], [0, 2, 3, 2], [0, 2.5, 3, 1.5], [0, 3, 3, 1], [0, 3.5, 3, 0.5]].map((d) => d.map((x) => x * 3));
let flowStep = -1, flowing = false;
function flow() {
  if (flowing || still()) return;
  flowing = true;
  const tick = (ts) => {
    if (still() || !map.getLayer('rivers-flow')) { flowing = false; return; }
    const k = Math.floor(ts / 90) % DASH.length;
    if (k !== flowStep) { flowStep = k; map.setPaintProperty('rivers-flow', 'line-dasharray', DASH[k]); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
// A small chevron pointing along the line (east = downstream), drawn once
function chevron() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d'); g.lineCap = 'round'; g.lineJoin = 'round';
  // ink on a paper halo, so it reads on the line and off it
  for (const [color, w] of [[css('--paper'), 8], [css('--ink'), 4]]) { g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(10, 7); g.lineTo(21, 16); g.lineTo(10, 25); g.stroke(); }
  return g.getImageData(0, 0, 32, 32);
}
function bboxOf(g) { let b = [180, 90, -180, -90]; for (const l of g.coordinates) for (const [x, y] of l) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; return [[b[0], b[1]], [b[2], b[3]]]; }
function select(fid, fly = true) {
  if (selected != null) map.setFeatureState({ source: 'rivers', id: selected }, { sel: false });
  selected = fid;
  rivers.forEach((r) => map.setFeatureState({ source: 'rivers', id: r.fid }, { dim: fid != null && r.fid !== fid, sel: r.fid === fid }));
  if (fid != null && fly) map.fitBounds(rivers[fid].bbox, { padding: pad(), maxZoom: 10, duration: still() ? 0 : 800 });
  draw();
}
function drawLegend() {
  document.getElementById('legend').innerHTML = `<div class="row"><b style="height:3px"></b>${t(still() ? 'legendStill' : 'legend')}</div>${lakes.length ? `<div class="row"><b style="height:.6rem;opacity:.45"></b>${t('lakeL')}</div>` : ''}`;
}
function draw() {
  const el = document.getElementById('body');
  drawLegend();
  if (!rivers.length) return;
  if (selected != null) {
    const r = rivers[selected];
    const wiki = r.wikidata ? `https://www.wikidata.org/wiki/Special:GoToLinkedPage/${lang}wiki/${r.wikidata}` : null;
    el.innerHTML = `<button type="button" class="back" id="back">${t('back')}</button><div class="river"><h2>${esc(L(r))}</h2>
      <p><span class="k">${t('length')}:</span> ${nf().format(r.length)} ${t('km')} <span class="k">(${r.whole ? t('whole') : t('inAz')})</span></p>
      <p><span class="k">${t('names')}:</span> ${[...new Set([r.az, r.ru, r.en])].map(esc).join(' · ')}</p>
      ${wiki ? `<p><a href="${wiki}" target="_blank" rel="noopener">${t('wiki')} ↗</a></p>` : ''}</div>`;
    document.getElementById('back').onclick = () => select(null);
  } else {
    const q = query.trim().toLowerCase();
    const list = rivers.filter((r) => !q || [r.az, r.ru, r.en].some((n) => n?.toLowerCase().includes(q)));
    el.innerHTML = `<section class="rank"><h2>${t('rivers')(list.length)}</h2><ul class="riverlist">${list.map((r) => `<li><button type="button" data-r="${r.fid}"><span>${esc(L(r))}</span><span class="v">${nf().format(r.length)} ${t('km')}</span></button></li>`).join('')}</ul></section>`
      + (lakes.length && !q ? `<section class="rank"><h2>${t('lakes')}</h2><ul class="riverlist">${lakes.slice(0, 20).map((l) => `<li><button type="button" data-l="${l.fid}"><span>${esc(L(l))}</span><span class="v">${l.kind === 'reservoir' ? t('reservoir') : t('lake')}</span></button></li>`).join('')}</ul></section>` : '')
      + `<p class="note">${t('note')}</p>`;
    el.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => select(+b.dataset.r));
    el.querySelectorAll('[data-l]').forEach((b) => b.onclick = () => zoomLake(+b.dataset.l));
  }
  const u = new URLSearchParams();
  if (lang !== 'az') u.set('lang', lang);
  if (selected != null) u.set('r', rivers[selected].id);
  history.replaceState(null, '', `${location.pathname}${u.size ? '?' + u : ''}`);
}
document.getElementById('find').addEventListener('input', (e) => { query = e.target.value; if (selected != null) select(null); else draw(); });
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('find').placeholder = t('find');
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getLayer('river-names')) map.setLayoutProperty('river-names', 'text-field', ['get', lang]);
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field'] && l.id !== 'river-names') map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
</body>
</html>
