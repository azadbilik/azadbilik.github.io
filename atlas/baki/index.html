    old.addLayer({ id: `p${y}`, type: 'raster', source: `p${y}`, paint: { 'raster-opacity': 0, 'raster-opacity-transition': { duration: still() ? 0 : 400 }, 'raster-fade-duration': 0 } }, first);
  }
  for (const l of old.getStyle().layers) if (l.type === 'symbol') old.setLayoutProperty(l.id, 'visibility', 'none');
  apply(true, true);
});

// ---- the four ways to look
const oldEl = document.getElementById('old'), lensEl = document.getElementById('lens'), dv = document.getElementById('divider');
const scratch = document.createElement('canvas'), sctx = scratch.getContext('2d');
function sizeScratch() { scratch.width = Math.ceil(innerWidth / 3); scratch.height = Math.ceil(innerHeight / 3); }
sizeScratch();
function centreLens() { const p = map.getPadding(); lensAt = [p.left + (innerWidth - p.left - p.right) / 2, p.top + (innerHeight - p.top - p.bottom) / 2]; draw2(); }
function draw2() {
  // what of the old map shows
  oldEl.style.webkitMaskImage = oldEl.style.maskImage = 'none';
  lensEl.style.display = 'none'; dv.classList.remove('on');
  if (mode === 'lens') {
    if (!lensAt) centreLens();
    const [x, y] = lensAt;
    oldEl.style.clipPath = `circle(${R}px at ${x}px ${y}px)`;
    Object.assign(lensEl.style, { display: 'block', left: `${x - R}px`, top: `${y - R}px`, width: `${2 * R}px`, height: `${2 * R}px` });
    document.getElementById('lens-tag').textContent = lab(year);
  } else if (mode === 'swipe') {
    const x = Math.round(split * innerWidth);
    oldEl.style.clipPath = `inset(0 ${innerWidth - x}px 0 0)`; dv.style.left = `${x}px`; dv.classList.add('on');
    dv.setAttribute('aria-valuenow', Math.round(split * 100));
    document.getElementById('yl').textContent = lab(year); document.getElementById('yr').textContent = t('now');
  } else if (mode === 'scratch') {
    oldEl.style.clipPath = 'none';
    const url = `url(${scratch.toDataURL()})`; oldEl.style.webkitMaskImage = oldEl.style.maskImage = url;
  } else oldEl.style.clipPath = 'none';
}
// lens follows the mouse; on a touch screen it stays in the middle and the map moves under it
map.getContainer().addEventListener('pointermove', (e) => { if (mode === 'lens' && e.pointerType === 'mouse') { lensAt = [e.clientX, e.clientY]; requestAnimationFrame(draw2); } });
map.getContainer().addEventListener('wheel', (e) => { if (mode === 'lens' && e.shiftKey) { e.preventDefault(); e.stopPropagation(); R = Math.max(60, Math.min(360, R - Math.sign(e.deltaY) * 15)); draw2(); drawTool(); } }, { capture: true, passive: false });
// scratch: paint where the pointer drags (the map does not pan meanwhile)
let painting = false, scheduled = false;
function paint(e) {
  sctx.fillStyle = '#000'; sctx.beginPath(); sctx.arc(e.clientX / 3, e.clientY / 3, 16, 0, Math.PI * 2); sctx.fill();
  if (!scheduled) { scheduled = true; requestAnimationFrame(() => { scheduled = false; draw2(); }); }
}
map.getContainer().addEventListener('pointerdown', (e) => { if (mode !== 'scratch') return; painting = true; map.dragPan.disable(); paint(e); });
addEventListener('pointermove', (e) => { if (painting) paint(e); });
addEventListener('pointerup', () => { if (painting) { painting = false; map.dragPan.enable(); } });
// swipe: drag anywhere on the line, or arrow keys
let dragging = false;
dv.addEventListener('pointerdown', (e) => { dragging = true; dv.setPointerCapture(e.pointerId); });
dv.addEventListener('pointermove', (e) => { if (!dragging) return; split = Math.min(.98, Math.max(.02, e.clientX / innerWidth)); draw2(); });
dv.addEventListener('pointerup', () => { dragging = false; });
dv.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') split = Math.max(.02, split - .03); else if (e.key === 'ArrowRight') split = Math.min(.98, split + .03); else return; e.preventDefault(); draw2(); });
addEventListener('resize', () => { sizeScratch(); setPad(); if (mode === 'lens' && coarse()) centreLens(); draw2(); });
// the line slides once when the swipe opens, to show it moves
function peek() {
  const p = map.getPadding(), mid = (p.left + (innerWidth - p.left) / 2) / innerWidth;
  if (still()) { split = mid; return draw2(); }
  const t0 = performance.now(), from = mid - .12;
  const step = (now) => { const k = Math.min(1, (now - t0) / 1100); split = from + (mid - from) * (1 - Math.cos(k * Math.PI * 2.5) * (1 - k)); draw2(); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function apply(fly = false, first = false) {
  city = cityOf(year);
  for (const y of YEARS) if (old.getLayer(`p${y}`)) old.setPaintProperty(`p${y}`, 'raster-opacity', y === year ? (mode === 'fade' ? fade : 1) : 0);
  if (fly) map.flyTo({ center: PLANS[year].center, zoom: PLANS[year].zoom, duration: still() || first ? 0 : 1400, essential: true });
  draw2(); draw();
}
function setMode(m) {
  mode = m;
  if (m === 'scratch') sctx.clearRect(0, 0, scratch.width, scratch.height);
  if (m === 'lens' && coarse()) centreLens();
  apply();
  if (m === 'swipe') peek();
}
function drawTool() {
  const el = document.getElementById('tool-row');
  if (mode === 'lens') el.innerHTML = `<span>${t('size')}</span><input type="range" id="tool" min="60" max="360" value="${R}"><span></span>`;
  else if (mode === 'fade') el.innerHTML = `<span>${t('now')}</span><input type="range" id="tool" min="0" max="100" value="${Math.round(fade * 100)}"><span>${lab(year)}</span>`;
  else if (mode === 'scratch') el.innerHTML = `<span></span><span></span><button type="button" id="clear">${t('clear')}</button>`;
  else el.innerHTML = '';
  const r = document.getElementById('tool');
  if (r) r.oninput = (e) => { if (mode === 'lens') R = +e.target.value; else { fade = +e.target.value / 100; apply(); } draw2(); };
  document.getElementById('clear')?.addEventListener('click', () => { sctx.clearRect(0, 0, scratch.width, scratch.height); draw2(); });
  document.getElementById('hint').textContent = t('hint')[mode === 'lens' && coarse() ? 'lensTouch' : mode];
}
function draw() {
  document.getElementById('cities').innerHTML = Object.entries(CITIES).map(([k, c]) => `<button type="button" data-c="${k}" aria-pressed="${k === city}">${esc(L(c.name))}</button>`).join('');
  document.querySelectorAll('#cities button').forEach((b) => b.onclick = () => { city = b.dataset.c; year = CITIES[city].plans.at(-1); poi = -1; apply(true); });
  document.getElementById('years').style.gridTemplateColumns = `repeat(${CITIES[city].plans.length}, 1fr)`;
  document.getElementById('years').innerHTML = CITIES[city].plans.map((y) => `<button type="button" data-y="${y}" aria-pressed="${y === year}">${lab(y)}</button>`).join('');
  document.querySelectorAll('#years button').forEach((b) => b.onclick = () => { year = b.dataset.y; poi = -1; apply(true); });
  const ICON = { lens: '◎', swipe: '⇆', scratch: '✎', fade: '◐' };
  document.getElementById('modes').innerHTML = ['lens', 'swipe', 'scratch', 'fade'].map((m) => `<button type="button" data-m="${m}" aria-pressed="${m === mode}"><i aria-hidden="true">${ICON[m]}</i>${t(m)}</button>`).join('');
  document.querySelectorAll('#modes button').forEach((b) => b.onclick = () => setMode(b.dataset.m));
  drawTool();
  const p = PLANS[year], m = meta[year];
  document.getElementById('side').innerHTML = `<div class="about"><h2>${esc(L(p.title))}</h2><p>${esc(L(p.text))}</p>
      ${m ? `<p class="k">${t('fit')}: ${esc(t('fitText')[p.fit])}, ${esc(t('acc')(p.acc))}. ${t('source')}: <a href="${m.source}" target="_blank" rel="noopener">Wikimedia Commons ↗</a></p>` : ''}</div>
    <h2 class="sec">${t('places')}</h2><ul class="pois">${POIS.map((q, i) => cityOf(q.year) !== city ? '' : `<li><button type="button" data-p="${i}" aria-current="${i === poi}"><span class="y">${lab(q.year)}</span><span><b>${esc(L(q.name))}</b><small>${esc(L(q.text))}</small></span></button></li>`).join('')}</ul>
    <p class="note">${t('note')}</p>`;
  document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => goPoi(+b.dataset.p));
  const q = new URLSearchParams(); if (lang !== 'az') q.set('lang', lang); if (year !== '1898') q.set('y', year); if (mode !== 'lens') q.set('m', mode);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
function goPoi(i) {
  const q = POIS[i]; poi = i; year = q.year; city = cityOf(year);
  if (mode !== 'lens' && mode !== 'swipe') mode = 'lens';
  apply();
  map.flyTo({ center: q.at, zoom: q.z, duration: still() ? 0 : 1600, essential: true });
  // the lens opens on the place when the flight lands
  map.once('moveend', () => { if (mode === 'lens') { const pt = map.project(q.at); lensAt = [pt.x, pt.y]; draw2(); } else { split = map.project(q.at).x / innerWidth; draw2(); } });
}
document.getElementById('fold').onclick = () => {
  const min = panelEl.classList.toggle('min');
  document.getElementById('fold').textContent = min ? '›' : '‹';
  document.getElementById('fold').setAttribute('aria-expanded', !min);
  setPad(); if (mode === 'lens' && coarse()) centreLens();
};
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang(); draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw(); draw2();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
</body>
