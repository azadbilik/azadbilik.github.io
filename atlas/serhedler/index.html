<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const LANGS = ['az', 'ru', 'en'];
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch {}
  return 'az';
})();
const fmt = (n) => n == null ? '' : n.toLocaleString(lang === 'en' ? 'en' : lang === 'ru' ? 'ru' : 'az');
const parse = (v) => v == null || v === 'null' ? null : typeof v === 'string' ? JSON.parse(v) : v;

// The eras, oldest first. Each is drawn from its own map's data; the panel links back to that map.
const ERAS = [
  { id: '1800', tick: '1800', file: '../xanliqlar/data/khanates.geojson', page: '/atlas/xanliqlar/', unitParam: 'k',
    year: { az: 'təx. 1800', ru: 'ок. 1800', en: 'c. 1800' },
    name: { az: 'Xanlıqlar', ru: 'Ханства', en: 'The khanates' },
    about: { az: 'Arazın şimalındakı xanlıqlar Rusiyaya keçəndə: sərhədlər V. İ. Tomkeyevin 1801–1813-cü illərin sərhədlərini göstərən xəritəsindən (Tiflis, 1901) köçürülüb. İlisu, Qazax və Borçalı 1897-ci il qəzaları ilə göstərilir.',
             ru: 'Ханства к северу от Аракса на момент перехода к России: границы перенесены с карты В. И. Томкеева, показывающей границы 1801–1813 гг. (Тифлис, 1901). Илису, Казах и Борчалы показаны уездами 1897 г.',
             en: "The khanates north of the Araz as Russia took them: borders traced from V. I. Tomkeev's map of the borders of 1801–1813 (Tiflis, 1901). Ilisu, Qazax and Borchali are shown as their 1897 uezds." },
    open: { az: 'Xanlıqlar xəritəsi', ru: 'Карта ханств', en: 'The khanates map' } },
  { id: '1897', tick: '1897', file: '../1897/data/units.geojson', page: '/atlas/1897/',
    year: { az: '1897', ru: '1897', en: '1897' },
    name: { az: 'Qəzalar', ru: 'Уезды', en: 'The uezds' },
    about: { az: 'Rusiya imperiyasının ilk siyahıyaalması vaxtı Bakı, Yelizavetpol və İrəvan quberniyalarının, Zaqatala dairəsinin, Dağıstanın və Qars vilayətinin qəzaları. Sərhədlər: RISTAT (Kessler və Markeviç), CC0.',
             ru: 'Уезды Бакинской, Елисаветпольской и Эриванской губерний, Закатальского округа, Дагестана и Карсской области на момент первой всеобщей переписи. Границы: RISTAT (Кесслер и Маркевич), CC0.',
             en: "The uezds of the Baku, Elisabethpol and Erivan governorates, the Zaqatala okrug, Dagestan and the Kars oblast at the Empire's first census. Borders: RISTAT (Kessler and Markevich), CC0." },
    open: { az: '1897: ana dilləri', ru: '1897: родные языки', en: 'Native languages, 1897' } },
  { id: '1926', tick: '1926', file: '../rayonlar/data/raions-1926.geojson', page: '/atlas/rayonlar/?y=1926', unitParam: 'r',
    year: { az: '1926', ru: '1926', en: '1926' },
    name: { az: 'Sovet qəzaları', ru: 'Советские уезды', en: 'Soviet uezds' },
    about: { az: 'Rayonlaşmadan əvvəl Azərbaycan SSR-in qəzaları, Naxçıvan və Dağlıq Qarabağ. Hər biri bugünkü rayonlardan yığılıb, ona görə sərhədlər təxminidir.',
             ru: 'Уезды Азербайджанской ССР до районирования, Нахичевань и Нагорный Карабах. Каждый собран из нынешних районов, поэтому границы приблизительны.',
             en: 'The uezds of the Azerbaijan SSR before the raions, with Nakhchivan and Nagorno-Karabakh. Each is built from today\'s districts, so the borders are approximate.' },
    open: { az: 'Sovet rayonları, 1926', ru: 'Советские районы, 1926', en: 'Soviet raions, 1926' } },
  { id: '1939', tick: '1939', file: '../rayonlar/data/raions-1939.geojson', page: '/atlas/rayonlar/?y=1939', unitParam: 'r',
    year: { az: '1939', ru: '1939', en: '1939' },
    name: { az: 'Sovet rayonları', ru: 'Советские районы', en: 'Soviet raions' },
    about: { az: '1930-cu ildən sonrakı rayonlar 1939-cu il siyahıyaalmasında, bugünkü rayonlardan yığılmış şəkildə. Boz: torpağı bir neçə Sovet rayonu arasında bölünmüş bugünkü rayon.',
             ru: 'Районы, созданные после 1930 г., по переписи 1939 г., собранные из нынешних районов. Серым — нынешний район, земли которого делили несколько советских.',
             en: 'The raions made after 1930, at the 1939 census, built from today\'s districts. Grey: a district of today whose land was split among several Soviet raions.' },
    open: { az: 'Sovet rayonları, 1939', ru: 'Советские районы, 1939', en: 'Soviet raions, 1939' } },
  { id: '1989', tick: '1979–89', file: '../rayonlar/data/raions.geojson', page: '/atlas/rayonlar/', unitParam: 'r',
    year: { az: '1979–1989', ru: '1979–1989', en: '1979–1989' },
    name: { az: 'Son Sovet rayonları', ru: 'Поздние советские районы', en: 'Late Soviet raions' },
    about: { az: '1979 və 1989-cu il siyahıyaalmalarının rayonları və şəhər sovetləri, bugünkü rayonlardan yığılmış şəkildə; sonradan birləşdirilənlər bir şəkil kimi çəkilib.',
             ru: 'Районы и горсоветы переписей 1979 и 1989 гг., собранные из нынешних районов; позже объединённые нарисованы одной фигурой.',
             en: 'The raions and city councils of the 1979 and 1989 censuses, built from today\'s districts; those merged since are drawn as one shape.' },
    open: { az: 'Sovet rayonları, 1989', ru: 'Советские районы, 1989', en: 'Soviet raions, 1989' } },
  { id: 'today', tick: { az: 'indi', ru: 'сейчас', en: 'now' }, file: '../ehali/data/units.geojson', page: '/atlas/ehali/', unitParam: 'u', unitKey: 'key', only: (f) => f.properties.country === 'az',
    year: { az: 'Bu gün', ru: 'Сегодня', en: 'Today' },
    name: { az: 'Bugünkü rayonlar', ru: 'Нынешние районы', en: "Today's districts" },
    about: { az: 'Azərbaycan Respublikasının bugünkü rayonları və şəhərləri. Sərhədlər: geoBoundaries.',
             ru: 'Нынешние районы и города Азербайджанской Республики. Границы: geoBoundaries.',
             en: 'The districts and cities of the Republic of Azerbaijan today. Borders: geoBoundaries.' },
    open: { az: 'Əhali xəritəsi', ru: 'Карта населения', en: 'The population map' } },
];
const T = {
  az: { doc: 'Sərhədlər · Azad Bilik', title: 'Sərhədlər', sub: 'Xanlıqlardan bugünkü rayonlara', todayLines: 'Bugünkü rayon sərhədləri üstündə', open: 'Ayrıca xəritədə aç', unitOpen: 'Bu vahidi öz xəritəsində aç', pop: 'Əhali', capital: 'Paytaxtı', annexed: (y) => `Rusiyaya keçib: ${y}`, gov: 'Quberniya', today: 'Bugünkü rayonlar', legendUnit: 'vahid', legendGap: 'aydın deyil', legendToday: 'bugünkü rayonlar', prev: 'Əvvəlki dövr', next: 'Sonrakı dövr', hint: 'Xəritədə bir vahidə toxunun.' },
  ru: { doc: 'Границы · Azad Bilik', title: 'Границы', sub: 'От ханств до нынешних районов', todayLines: 'Поверх — границы нынешних районов', open: 'Открыть отдельную карту', unitOpen: 'Открыть на своей карте', pop: 'Население', capital: 'Столица', annexed: (y) => `Отошло России: ${y}`, gov: 'Губерния', today: 'Нынешние районы', legendUnit: 'единица', legendGap: 'не установлено', legendToday: 'нынешние районы', prev: 'Предыдущая эпоха', next: 'Следующая эпоха', hint: 'Нажмите на единицу на карте.' },
  en: { doc: 'Borders · Azad Bilik', title: 'Borders', sub: "From the khanates to today's districts", todayLines: "Today's district borders on top", open: 'Open its own map', unitOpen: 'Open on its own map', pop: 'Population', capital: 'Capital', annexed: (y) => `Passed to Russia: ${y}`, gov: 'Governorate', today: "Today's districts", legendUnit: 'unit', legendGap: 'not established', legendToday: "today's districts", prev: 'Earlier', next: 'Later', hint: 'Tap a unit on the map.' },
};
const t = (k) => T[lang][k];
const L = (o) => o?.[lang] ?? o?.az ?? o;
const params = new URLSearchParams(location.search);
let era = Math.max(0, ERAS.findIndex((e) => e.id === params.get('e'))), selected = null, showToday = params.get('t') === '1';
const data = {};
const BOUNDS = [[43.3, 37.2], [50.6, 42.6]];
const FILL = ['case', ['boolean', ['feature-state', 'sel'], false], .75, ['boolean', ['feature-state', 'hover'], false], .62, ['==', ['get', 'kind'], 'gap'], .22, .45];

// Colour: a khanate keeps its own; other units take one of eight muted tones, so neighbours mostly differ
const TONES = dark ? ['#8E6F3A', '#3B6EA8', '#B0563A', '#2E7D6B', '#7A3E8E', '#A23B6A', '#5B8A9E', '#C9862B'] : ['#C9A46A', '#7FA3CF', '#D58C72', '#6FB09B', '#A98BC0', '#CF7FA0', '#8FB5C6', '#E2B26B'];
function colour(gj) {
  // greedy colouring over shared vertices, so neighbouring units rarely share a tone
  const vtx = new Map(), fs = gj.features;
  fs.forEach((f, i) => { const g = f.geometry; if (!g) return; const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    for (const p of polys) for (const ring of p) for (let j = 0; j < ring.length; j += 3) { const k = ring[j][0].toFixed(3) + ',' + ring[j][1].toFixed(3); if (!vtx.has(k)) vtx.set(k, new Set()); vtx.get(k).add(i); } });
  const nb = fs.map(() => new Set());
  for (const s of vtx.values()) if (s.size > 1) for (const a of s) for (const b of s) if (a !== b) nb[a].add(b);
  const got = [];
  fs.forEach((f, i) => { const used = new Set([...nb[i]].map((j) => got[j]).filter((x) => x != null)); let c = 0; while (used.has(c) && c < TONES.length - 1) c++; got[i] = c; f.properties.tone = f.properties.color ?? TONES[c]; });
}

const map = new maplibregl.Map({
  container: 'map', style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  bounds: BOUNDS, minZoom: 4.5, maxZoom: 10,
  attributionControl: { compact: true, customAttribution: 'Tomkeev 1901 · <a href="https://ristat.org/">RISTAT</a> · Demoscope · <a href="https://www.geoboundaries.org">geoBoundaries</a> · OpenStreetMap' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 60, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 32, bottom: 32, left: 27 * 16 + 32 };
const labelExpr = () => ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']];
map.on('style.load', () => {
  for (const l of map.getStyle().layers) {
    if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', css('--land'));
    if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', css('--water'));
    if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
  }
});
map.on('load', async () => {
  map.fitBounds(BOUNDS, { padding: pad(), duration: 0 });
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
  const firstSymbol = map.getStyle().layers.find((l) => l.type === 'symbol')?.id;
  const ink = css('--ink');
  // the era on screen first, the rest after it
  const add = async (i) => {
    const e = ERAS[i], gj = await fetch(e.file).then((r) => r.json());
    gj.features = gj.features.filter((f) => f.geometry && f.geometry.type !== 'Point' && (!e.only || e.only(f)));
    gj.features.forEach((f, k) => { f.id = k; });
    colour(gj);
    data[e.id] = gj;
    map.addSource(e.id, { type: 'geojson', data: gj });
    const on = i === era;
    map.addLayer({ id: `${e.id}-fill`, type: 'fill', source: e.id, paint: {
      'fill-color': ['case', ['==', ['get', 'kind'], 'gap'], css('--muted'), ['get', 'tone']],
      'fill-opacity': on ? FILL : 0, 'fill-opacity-transition': { duration: still() ? 0 : 450 } } }, firstSymbol);
    map.addLayer({ id: `${e.id}-line`, type: 'line', source: e.id, paint: {
      'line-color': ink, 'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.2, .8],
      'line-opacity': on ? .75 : 0, 'line-opacity-transition': { duration: still() ? 0 : 450 } } }, firstSymbol);
  };
  await add(era);
  await Promise.all(ERAS.map((_, i) => i !== era ? add(i) : null));
  map.addLayer({ id: 'today-over', type: 'line', source: 'today', layout: { visibility: showToday ? 'visible' : 'none' }, paint: { 'line-color': ink, 'line-width': .7, 'line-opacity': .5, 'line-dasharray': [2, 2] } }, firstSymbol);
  let hovered = null;
  const fillOf = () => `${ERAS[era].id}-fill`;
  map.on('mousemove', (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: [fillOf()] })[0];
    const src = ERAS[era].id;
    if (hovered && (!f || hovered.id !== f.id || hovered.src !== src)) { map.setFeatureState({ source: hovered.src, id: hovered.id }, { hover: false }); hovered = null; }
    if (!f) { map.getCanvas().style.cursor = ''; tip.remove(); return; }
    map.getCanvas().style.cursor = 'pointer';
    hovered = { src, id: f.id }; map.setFeatureState({ source: src, id: f.id }, { hover: true });
    tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(f.properties[lang] ?? f.properties.az)}</strong>`).addTo(map);
  });
  map.on('mouseout', () => { tip.remove(); });
  map.on('click', (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: [fillOf()] })[0];
    select(f ? f.id : null);
  });
  if (params.get('u')) { const i = data[ERAS[era].id].features.findIndex((f) => String(f.properties.id) === params.get('u')); if (i >= 0) select(i); }
  draw();
});

function setEra(i) {
  if (i < 0 || i >= ERAS.length || i === era) return;
  select(null, false);
  const was = ERAS[era].id; era = i; const now = ERAS[era].id;
  if (map.getLayer(`${was}-fill`)) { map.setPaintProperty(`${was}-fill`, 'fill-opacity', 0); map.setPaintProperty(`${was}-line`, 'line-opacity', 0); }
  if (map.getLayer(`${now}-fill`)) { map.setPaintProperty(`${now}-fill`, 'fill-opacity', FILL); map.setPaintProperty(`${now}-line`, 'line-opacity', .75); }
  draw();
}
function select(id, redraw = true) {
  const src = ERAS[era].id;
  if (selected != null && data[selected.src]) map.setFeatureState({ source: selected.src, id: selected.id }, { sel: false });
  selected = id == null ? null : { src, id };
  if (selected) map.setFeatureState({ source: src, id }, { sel: true });
  if (redraw) draw();
}
function unitCard() {
  if (!selected) return `<p class="k" style="padding:1rem 1.5rem 0">${t('hint')}</p>`;
  const e = ERAS[era], p = data[e.id].features[selected.id].properties;
  const pop = parse(p.pop), cap = parse(p.capitalName), gov = parse(p.gov);
  const popNow = pop ? (pop[e.id === '1989' ? '1989' : e.id] ?? (e.id === 'today' ? Object.values(pop).at(-1) : null)) : (p.total ?? null);
  const today = parse(p.today);
  const key = e.unitKey ? p[e.unitKey] : p.id;
  const link = e.unitParam ? (() => { const u = new URL(e.page, location.href); u.searchParams.set(e.unitParam, key); if (lang !== 'az') u.searchParams.set('lang', lang); return u.pathname + u.search; })() : null;
  return `<div class="card"><h3><i style="background:${p.kind === 'gap' ? css('--muted') : p.tone}"></i>${esc(p[lang] ?? p.az)}</h3>
    ${cap ? `<p><span class="k">${t('capital')}:</span> ${esc(cap[LANGS.indexOf(lang)])}</p>` : ''}
    ${p.annexed && e.id === '1800' ? `<p class="k">${t('annexed')(p.annexed)}</p>` : ''}
    ${gov ? `<p><span class="k">${t('gov')}:</span> ${esc(gov[LANGS.indexOf(lang)])}</p>` : ''}
    ${popNow ? `<p><span class="k">${t('pop')}:</span> ${fmt(popNow)}</p>` : ''}
    ${today && today.length ? `<p><span class="k">${t('today')}:</span> ${esc(today.map((x) => x[lang] ?? x.az).join(', '))}</p>` : ''}
    ${p.kind === 'gap' && p.note ? `<p class="k">${esc(L(parse(p.note)) ?? p.note)}</p>` : ''}
    ${link && p.kind !== 'gap' ? `<p><a href="${link}">${t('unitOpen')} →</a></p>` : ''}</div>`;
}
function draw() {
  const e = ERAS[era];
  document.getElementById('era').value = era;
  document.getElementById('era').setAttribute('aria-valuetext', `${L(e.year)}: ${L(e.name)}`);
  document.getElementById('era-year').textContent = L(e.year);
  document.getElementById('era-name').textContent = L(e.name);
  document.getElementById('ticks').innerHTML = ERAS.map((x, i) => `<button type="button" data-i="${i}" style="--at:${i / (ERAS.length - 1)}" aria-current="${i === era}">${esc(L(x.tick))}</button>`).join('');
  document.querySelectorAll('#ticks button').forEach((b) => b.onclick = () => setEra(+b.dataset.i));
  document.getElementById('prev').disabled = era === 0; document.getElementById('next').disabled = era === ERAS.length - 1;
  document.getElementById('prev').setAttribute('aria-label', t('prev')); document.getElementById('next').setAttribute('aria-label', t('next'));
  const page = (() => { const u = new URL(e.page, location.href); if (lang !== 'az') u.searchParams.set('lang', lang); return u.pathname + u.search; })();
  document.getElementById('side').innerHTML = `<div class="about"><h2>${e.id === 'today' ? esc(L(e.name)) : `${esc(L(e.name))}, ${esc(L(e.year))}`}</h2><p>${esc(L(e.about))}</p><p><a class="open" href="${page}">${esc(L(e.open))} →</a></p></div>${unitCard()}`;
  document.getElementById('legend').innerHTML = `<div class="row"><span class="sw"></span>${t('legendUnit')}</div>`
    + (['1939', '1989'].includes(e.id) ? `<div class="row"><span class="sw gap"></span>${t('legendGap')}</div>` : '')
    + (showToday ? `<div class="row"><span class="ln"></span>${t('legendToday')}</div>` : '');
  keepUrl();
}
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (era !== 0) q.set('e', ERAS[era].id);
  if (showToday) q.set('t', '1');
  if (selected && data[selected.src]) q.set('u', data[selected.src].features[selected.id].properties.id);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
document.getElementById('era').oninput = (e) => setEra(+e.target.value);
document.getElementById('prev').onclick = () => setEra(era - 1);
document.getElementById('next').onclick = () => setEra(era + 1);
document.getElementById('today').checked = showToday;
document.getElementById('today').onchange = (e) => { showToday = e.target.checked; if (map.getLayer('today-over')) map.setLayoutProperty('today-over', 'visibility', showToday ? 'visible' : 'none'); draw(); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, textarea')) return;
  if (e.key === 'ArrowRight') setEra(era + 1);
  else if (e.key === 'ArrowLeft') setEra(era - 1);
  else if (e.key === 'Escape') select(null);
});
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
</body>
