  // greedy colouring over shared vertices, so neighbouring units rarely share a tone
  const vtx = new Map(), fs = gj.features;
  fs.forEach((f, i) => { const g = f.geometry; if (!g) return; const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    for (const p of polys) for (const ring of p) for (let j = 0; j < ring.length; j += 3) { const k = ring[j][0].toFixed(3) + ',' + ring[j][1].toFixed(3); if (!vtx.has(k)) vtx.set(k, new Set()); vtx.get(k).add(i); } });
  const nb = fs.map(() => new Set());
  for (const s of vtx.values()) if (s.size > 1) for (const a of s) for (const b of s) if (a !== b) nb[a].add(b);
  const got = [];
  fs.forEach((f, i) => { const used = new Set([...nb[i]].map((j) => got[j]).filter((x) => x != null)); let c = 0; while (used.has(c) && c < TONES.length - 1) c++; got[i] = c; f.properties.tone = f.properties.color ?? TONES[c]; });
}

const map = new maplibregl.Map({
  container: 'map', style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  bounds: BOUNDS, minZoom: 2.5, maxZoom: 10,
  attributionControl: { compact: true, customAttribution: 'Tomkeev 1901 · <a href="https://ristat.org/">RISTAT</a> · Demoscope · <a href="https://www.geoboundaries.org">geoBoundaries</a> · OpenStreetMap' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 60, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 32, bottom: 32, left: 27 * 16 + 32 };
const labelExpr = () => ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']];
map.on('style.load', () => {
  for (const l of map.getStyle().layers) {
    if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', css('--land'));
    if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', css('--water'));
    if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
  }
});
map.on('load', async () => {
  map.fitBounds(ERAS[era].bounds ?? BOUNDS, { padding: pad(), duration: 0 });
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
  const firstSymbol = map.getStyle().layers.find((l) => l.type === 'symbol')?.id;
  const ink = css('--ink');
  // the era on screen first, the rest after it
  const add = async (i) => {
    const e = ERAS[i], gj = await fetch(e.file).then((r) => r.json());
    gj.features = gj.features.filter((f) => f.geometry && f.geometry.type !== 'Point' && !f.geometry.type.includes('Line') && (!e.only || e.only(f)));
    gj.features.forEach((f, k) => { f.id = k; });
    colour(gj);
    data[e.id] = gj;
    map.addSource(e.id, { type: 'geojson', data: gj });
    const on = i === era;
    map.addLayer({ id: `${e.id}-fill`, type: 'fill', source: e.id, paint: {
      'fill-color': ['case', ['==', ['get', 'kind'], 'gap'], css('--muted'), ['get', 'tone']],
      'fill-opacity': on ? FILL : 0, 'fill-opacity-transition': { duration: still() ? 0 : 450 } } }, firstSymbol);
    map.addLayer({ id: `${e.id}-line`, type: 'line', source: e.id, paint: {
      'line-color': ink, 'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.2, .8],
      'line-opacity': on ? .75 : 0, 'line-opacity-transition': { duration: still() ? 0 : 450 } } }, firstSymbol);
  };
  // Tomkeev's 1901 map, warped onto the web map (xanliqlar/scripts/trace/warp.py): faded in on the khanates
  for (const [id, base] of [['tomkeev', '../xanliqlar/data/tomkeev-1901'], ['delisle', 'safavi/data/delisle-1724']]) {
    const sc = await fetch(`${base}.json`).then((r) => r.json());
    map.addSource(id, { type: 'image', url: `${base}.webp`, coordinates: sc.coordinates });
    map.addLayer({ id, type: 'raster', source: id, paint: { 'raster-opacity': 0, 'raster-opacity-transition': { duration: 0 } } }, firstSymbol);
  }
  map.addSource('hl', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  await add(era);
  map.addLayer({ id: 'hl-fill', type: 'fill', source: 'hl', paint: { 'fill-color': ['get', 'c'], 'fill-opacity': 0 } }, firstSymbol);
  map.addLayer({ id: 'hl-line', type: 'line', source: 'hl', paint: { 'line-color': ['get', 'c'], 'line-width': 3, 'line-opacity': 0 } }, firstSymbol);
  await Promise.all(ERAS.map((_, i) => i !== era ? add(i) : null));
  map.addLayer({ id: 'today-over', type: 'line', source: 'today', layout: { visibility: showToday ? 'visible' : 'none' }, paint: { 'line-color': ink, 'line-width': .7, 'line-opacity': .5, 'line-dasharray': [2, 2] } }, firstSymbol);
  let hovered = null;
  const fillOf = () => `${ERAS[era].id}-fill`;
  map.on('mousemove', (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: [fillOf()] })[0];
    const src = ERAS[era].id;
    if (hovered && (!f || hovered.id !== f.id || hovered.src !== src)) { map.setFeatureState({ source: hovered.src, id: hovered.id }, { hover: false }); hovered = null; }
    if (!f) { map.getCanvas().style.cursor = ''; tip.remove(); return; }
    map.getCanvas().style.cursor = 'pointer';
    hovered = { src, id: f.id }; map.setFeatureState({ source: src, id: f.id }, { hover: true });
    if (game) { tip.remove(); map.getCanvas().style.cursor = 'crosshair'; return; } // no names while playing
    tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(f.properties[lang] ?? f.properties.az)}</strong>`).addTo(map);
  });
  map.on('mouseout', () => { tip.remove(); });
  map.on('click', (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: [fillOf()] })[0];
    if (game) return guess(f);
    select(f ? f.id : null);
  });
  applyScan();
  if (params.get('u')) { const i = data[ERAS[era].id].features.findIndex((f) => String(f.properties.id) === params.get('u')); if (i >= 0) select(i); }
  draw();
});

// the scan shows only on the khanates; as it comes in, their colours step back to outlines
function applyScan() {
  const e = ERAS[era], on = e.scan ? scan / 100 : 0;
  document.getElementById('scan-row').hidden = !e.scan;
  document.querySelector('#scan-row [data-i18n]').textContent = t(e.scan === 'delisle' ? 'scanDelisle' : 'scan');
  for (const id of ['tomkeev', 'delisle']) if (map.getLayer(id)) map.setPaintProperty(id, 'raster-opacity', e.scan === id ? on : 0);
  if (map.getLayer(`${e.id}-fill`) && e.scan) map.setPaintProperty(`${e.id}-fill`, 'fill-opacity', on ? ['*', FILL, 1 - on * .85] : FILL);
}
// a unit flashes: green where it is, red where the reader tapped; two soft pulses
function flash(items) {
  const src = map.getSource('hl'); if (!src) return;
  src.setData({ type: 'FeatureCollection', features: items.map(([f, c]) => ({ type: 'Feature', geometry: f.geometry, properties: { c } })) });
  const t0 = performance.now(), dur = still() ? 0 : 1300;
  const step = (now) => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    const a = still() ? .7 : .75 * Math.abs(Math.sin(k * Math.PI * 2));
    map.setPaintProperty('hl-fill', 'fill-opacity', k < 1 ? a : (still() ? .5 : 0));
    map.setPaintProperty('hl-line', 'line-opacity', k < 1 ? 1 : (still() ? 1 : 0));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function units() { return (data[ERAS[era].id]?.features ?? []).filter((f) => f.properties.kind !== 'gap'); }
function startGame() {
  const pool = units(); if (!pool.length) return;
  const order = pool.map((f) => f.id).sort(() => Math.random() - .5).slice(0, Math.min(10, pool.length));
  game = { era: ERAS[era].id, order, i: 0, score: 0, streak: 0, verdict: null };
  select(null, false); stopPlay(); map.fitBounds(ERAS[era].bounds ?? BOUNDS, { padding: pad(), duration: still() ? 0 : 600 });
  draw();
}
function endGame() { game = null; gameLock = false; draw(); }
function best() { try { return +localStorage.getItem(`serhedler-best-${ERAS[era].id}`) || 0; } catch { return 0; } }
function guess(f) {
  if (gameLock || game.i >= game.order.length) return;
  const target = data[game.era].features[game.order[game.i]], ok = f && f.id === target.id;
  const name = (p) => p[lang] ?? p.az;
  gameLock = true;
  if (ok) { game.score++; game.streak++; game.verdict = { ok: true }; flash([[target, '#2F7D3B']]); }
  else { game.streak = 0; game.verdict = { ok: false, was: f ? name(f.properties) : null }; flash([...(f && f.properties.kind !== 'gap' ? [[f, css('--accent')]] : []), [target, '#2F7D3B']]); }
  draw();
  setTimeout(() => { gameLock = false; if (!game) return; game.i++; game.verdict = null;
    if (game.i >= game.order.length) { try { if (game.score > best()) localStorage.setItem(`serhedler-best-${game.era}`, game.score); } catch {} }
    draw(); }, still() ? 900 : 1400);
}
function gamePanel() {
  const n = game.order.length, b = best();
  if (game.i >= n) return `<div class="game"><p class="ask">${esc(L(ERAS[era].name))}, ${esc(L(ERAS[era].year))}</p><p class="final">${game.score}/${n}</p><p>${t('done')(game.score, n)} · ${t('best')}: ${Math.max(b, game.score)}</p><div class="row"><button type="button" id="again">${t('again')}</button><button type="button" id="end">${t('gameEnd')}</button></div></div>`;
  const p = data[game.era].features[game.order[game.i]].properties;
  const v = game.verdict;
  return `<div class="game"><div class="bar"><i style="width:${game.i / n * 100}%"></i></div>
    <p class="ask">${t('ask')} <span>${game.i + 1}/${n}</span></p><p class="target${v ? '' : ' pop'}">${esc(p[lang] ?? p.az)}</p>
    <p class="verdict ${v ? (v.ok ? 'ok' : 'no') : ''}">${v ? (v.ok ? t('ok') : (v.was ? esc(t('no')(v.was)) : '')) : ''}</p>
    <div class="stats"><span>${t('score')} <b>${game.score}</b></span><span>${t('streak')} <b>${game.streak}</b></span><span>${t('best')} <b>${b || t('noBest')}</b></span></div>
    <div class="row"><button type="button" id="skip">${t('skip')}</button><button type="button" id="end">${t('gameEnd')}</button></div></div>`;
}
function setEra(i) {
  if (i < 0 || i >= ERAS.length || i === era) return;
  select(null, false);
  const was = ERAS[era].id; era = i; const now = ERAS[era].id;
  if (game) { game = null; setTimeout(startGame, 500); }
  if (ERAS[i].bounds || ERAS.find((e) => e.id === was)?.bounds) map.fitBounds(ERAS[i].bounds ?? BOUNDS, { padding: pad(), duration: still() ? 0 : 1200 });
  if (map.getLayer(`${was}-fill`)) { map.setPaintProperty(`${was}-fill`, 'fill-opacity', 0); map.setPaintProperty(`${was}-line`, 'line-opacity', 0); }
  if (map.getLayer(`${now}-fill`)) { map.setPaintProperty(`${now}-fill`, 'fill-opacity', FILL); map.setPaintProperty(`${now}-line`, 'line-opacity', .75); }
  applyScan();
  draw();
}
function select(id, redraw = true) {
  const src = ERAS[era].id;
  if (selected != null && data[selected.src]) map.setFeatureState({ source: selected.src, id: selected.id }, { sel: false });
  selected = id == null ? null : { src, id };
  if (selected) map.setFeatureState({ source: src, id }, { sel: true });
  if (redraw) draw();
}
function unitCard() {
  if (!selected) return `<p class="k" style="padding:1rem 1.5rem 0">${t('hint')}</p>`;
  const e = ERAS[era], p = data[e.id].features[selected.id].properties;
  const pop = parse(p.pop), cap = parse(p.capitalName), gov = parse(p.gov);
  const popNow = pop ? (pop[e.id === '1989' ? '1989' : e.id] ?? (e.id === 'today' ? Object.values(pop).at(-1) : null)) : (p.total ?? null);
  const today = parse(p.today);
  const key = e.unitKey ? p[e.unitKey] : p.id;
  const link = e.unitParam ? (() => { const u = new URL(e.page, location.href); u.searchParams.set(e.unitParam, key); if (lang !== 'az') u.searchParams.set('lang', lang); return u.pathname + u.search; })() : null;
  return `<div class="card"><h3><i style="background:${p.kind === 'gap' ? css('--muted') : p.tone}"></i>${esc(p[lang] ?? p.az)}</h3>
    ${cap ? `<p><span class="k">${t('capital')}:</span> ${esc(cap[LANGS.indexOf(lang)])}</p>` : ''}
    ${p.seat ? `<p><span class="k">${t('seat')}:</span> ${esc(p.seat)}</p>` : ''}
    ${p.annexed && e.id === '1800' ? `<p class="k">${t('annexed')(p.annexed)}</p>` : ''}
    ${gov ? `<p><span class="k">${t('gov')}:</span> ${esc(gov[LANGS.indexOf(lang)])}</p>` : ''}
    ${popNow ? `<p><span class="k">${t('pop')}:</span> ${fmt(popNow)}</p>` : ''}
    ${today && today.length ? `<p><span class="k">${t('today')}:</span> ${esc(today.map((x) => x[lang] ?? x.az).join(', '))}</p>` : ''}
    ${p.kind === 'gap' && p.note ? `<p class="k">${esc(L(parse(p.note)) ?? p.note)}</p>` : ''}
    ${link && p.kind !== 'gap' ? `<p><a href="${link}">${t('unitOpen')} →</a></p>` : ''}</div>`;
}
function draw() {
  const e = ERAS[era];
  document.getElementById('era').value = era;
  document.getElementById('era').setAttribute('aria-valuetext', `${L(e.year)}: ${L(e.name)}`);
  document.getElementById('era-year').textContent = L(e.year);
  document.getElementById('era-name').textContent = L(e.name);
  document.getElementById('ticks').innerHTML = ERAS.map((x, i) => `<button type="button" data-i="${i}" style="--at:${i / (ERAS.length - 1)}" aria-current="${i === era}">${esc(L(x.tick))}</button>`).join('');
  document.querySelectorAll('#ticks button').forEach((b) => b.onclick = () => { clearInterval(timer); timer = null; drawPlay(); setEra(+b.dataset.i); });
  document.getElementById('prev').disabled = era === 0; document.getElementById('next').disabled = era === ERAS.length - 1;
  document.getElementById('prev').setAttribute('aria-label', t('prev')); document.getElementById('next').setAttribute('aria-label', t('next'));
  const page = (() => { const u = new URL(e.page, location.href); if (lang !== 'az') u.searchParams.set('lang', lang); return u.pathname + u.search; })();
  document.getElementById('game').setAttribute('aria-pressed', !!game);
  document.getElementById('game').textContent = game ? t('gameEnd') : t('gameBtn');
  if (game) {
    document.getElementById('side').innerHTML = gamePanel();
    document.getElementById('skip')?.addEventListener('click', () => guess(null));
    document.getElementById('end')?.addEventListener('click', endGame);
    document.getElementById('again')?.addEventListener('click', startGame);
  } else document.getElementById('side').innerHTML = `<div class="about"><h2>${e.id === 'today' ? esc(L(e.name)) : `${esc(L(e.name))}, ${esc(L(e.year))}`}</h2><p>${esc(L(e.about))}</p><p><a class="open" href="${page}">${esc(L(e.open))} →</a></p></div>${unitCard()}`;
  document.getElementById('legend').innerHTML = `<div class="row"><span class="sw"></span>${t('legendUnit')}</div>`
    + (['1939', '1989'].includes(e.id) ? `<div class="row"><span class="sw gap"></span>${t('legendGap')}</div>` : '')
    + (showToday ? `<div class="row"><span class="ln"></span>${t('legendToday')}</div>` : '');
  keepUrl();
}
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (era !== 0) q.set('e', ERAS[era].id);
  if (showToday) q.set('t', '1');
  if (scan && ERAS[era].scan) q.set('s', scan);
  if (selected && data[selected.src]) q.set('u', data[selected.src].features[selected.id].properties.id);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
// ▶ steps through the eras, from the first again if at the last; any other move stops it
let timer = null;
function stopPlay() { clearInterval(timer); timer = null; drawPlay(); }
function stop() { clearInterval(timer); timer = null; drawPlay(); }
function drawPlay() { const b = document.getElementById('play'); b.setAttribute('aria-pressed', !!timer); b.textContent = timer ? '❚❚' : '▶'; b.setAttribute('aria-label', t(timer ? 'pause' : 'play')); }
document.getElementById('play').onclick = () => {
  if (timer) return stop();
  if (era === ERAS.length - 1) setEra(0);
  timer = setInterval(() => { if (era >= ERAS.length - 1) return stop(); setEra(era + 1); }, still() ? 4000 : 2600);
  drawPlay();
};
drawPlay();
document.getElementById('game').onclick = () => game ? endGame() : startGame();
document.getElementById('era').oninput = (e) => { stop(); setEra(+e.target.value); };
document.getElementById('prev').onclick = () => { stop(); setEra(era - 1); };
document.getElementById('next').onclick = () => { stop(); setEra(era + 1); };
document.getElementById('scan').value = scan;
document.getElementById('scan').oninput = (e) => { scan = +e.target.value; applyScan(); keepUrl(); };
document.getElementById('today').checked = showToday;
document.getElementById('today').onchange = (e) => { showToday = e.target.checked; if (map.getLayer('today-over')) map.setLayoutProperty('today-over', 'visibility', showToday ? 'visible' : 'none'); draw(); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, textarea')) return;
  if (e.key === 'ArrowRight') setEra(era + 1);
  else if (e.key === 'ArrowLeft') setEra(era - 1);
  else if (e.key === 'Escape') { if (game) endGame(); else select(null); }
});
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw(); drawPlay(); applyScan();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
