    let html = `<strong>${esc(L(u))}</strong>`;
    if (mode === 'top') { const m = largestMinority(u); html += m && !m.p ? ` · ${t('under1')}` : m ? ` · ${esc(pname(m.p))}: ${nf().format(m.n)} (${(m.n / m.total * 100).toFixed(1)}%)${m.carried ? ` <small>(${t('lastKnown')(m.year)})</small>` : ''}` : ` · ${t('nodata')}`; }
    else { const c = count(u); html += c ? ` · ${esc(pname(people))}: ${nf().format(c.n)} · ${(c.total ? c.n / c.total * 100 : 0).toFixed(1)}% ${t('ofDistrict')}${c.carried ? ` <small>(${t('lastKnown')(c.year)})</small>` : ''}` : ` · ${t('nodata')}`; }
    tip.setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
  map.on('mouseleave', 'units', () => { map.getCanvas().style.cursor = ''; tip.remove(); if (hovered != null) map.setFeatureState({ source: 'units', id: hovered }, { hover: false }); hovered = null; });
  map.on('click', 'units', (e) => { const m = largestMinority(units[e.features[0].id]); if (mode === 'top' && m?.p) { people = m.p; mode = 'one'; draw(); } });
  draw();
});
function paint() {
  for (const u of units) {
    let color = dark ? 'rgba(255,255,255,.05)' : 'rgba(26,20,16,.06)', carried = false;
    if (mode === 'top') { const m = largestMinority(u); if (m) { color = m.p ? COLORS[m.p] : (dark ? '#4A423B' : '#E2DBD0'); carried = m.carried; } }
    else { const v = value(u); if (v != null) { color = SEQ[classOf(v)]; carried = count(u).carried; } }
    map.setFeatureState({ source: 'units', id: u.fid }, { color, carried });
  }
}
function drawControls() {
  const md = document.getElementById('modes');
  md.style.gridTemplateColumns = 'repeat(2, 1fr)';
  md.innerHTML = [['one', t('one')], ['top', t('top')]].map(([m, l]) => `<button type="button" data-mode="${m}" aria-pressed="${m === mode}">${l}</button>`).join('');
  md.querySelectorAll('button').forEach((b) => b.onclick = () => { mode = b.dataset.mode; draw(); });
  const ms = document.getElementById('measures');
  ms.style.gridTemplateColumns = 'repeat(2, 1fr)';
  ms.hidden = mode === 'top';
  ms.innerHTML = ['share', 'count'].map((m) => `<button type="button" data-m="${m}" aria-pressed="${m === measure}">${t(m)}</button>`).join('');
  ms.querySelectorAll('button').forEach((b) => b.onclick = () => { measure = b.dataset.m; draw(); });
  const rs = document.getElementById('rounds');
  rs.innerHTML = ROUNDS.map((y, i) => `<button type="button" data-r="${i}" aria-pressed="${i === round}">${y}</button>`).join('');
  rs.querySelectorAll('button').forEach((b) => b.onclick = () => { if (playing) togglePlay(); round = +b.dataset.r; draw(); });
  const play = document.getElementById('play');
  play.textContent = playing ? '❚❚' : '▶';
}
function togglePlay() {
  if (playing) { clearInterval(playing); playing = null; drawControls(); return; }
  if (round >= ROUNDS.length - 1) round = 0;
  playing = setInterval(() => { if (round >= ROUNDS.length - 1) { clearInterval(playing); playing = null; drawControls(); return; } round++; draw(); }, still() ? 2500 : 1500);
  draw();
}
function drawLegend() {
  const el = document.getElementById('legend');
  if (mode === 'top') {
    const shown = [...new Set(units.map((u) => largestMinority(u)?.p).filter(Boolean))];
    el.innerHTML = `<span>${t('largest')}</span>` + shown.map((p) => `<div class="nodata"><i style="background:${COLORS[p]};border:0"></i>${esc(pname(p))}</div>`).join('')
      + `<div class="nodata"><i style="background:${dark ? '#4A423B' : '#E2DBD0'};border:0"></i>${t('under1')}</div><div class="nodata"><i></i>${t('nodata')}</div>`;
    return;
  }
  el.innerHTML = `<span>${esc(pname(people))} · ${t(measure)}</span>
    <div class="ramp">${SEQ.map((x) => `<span style="background:${x}"></span>`).join('')}</div>
    <div class="ticks">${SCALES[measure].ticks.slice(1).map((x) => `<span>${x}</span>`).join('')}</div>
    <div class="nodata"><i style="background:${SEQ[3]};opacity:.4"></i>${t('carriedNote')}</div>
    <div class="nodata"><i></i>${t('nodata')}</div>`;
}
// A people's line over the censuses, in the Republic
function spark(p) {
  const tot = info[p]?.totals ?? {};
  const pts = Object.entries(tot).map(([y, n]) => [+y, n]).sort((a, b) => a[0] - b[0]);
  if (pts.length < 2) return '';
  const W = 320, H = 70, max = Math.max(...pts.map((x) => x[1]));
  const X = (y) => 8 + (y - 1959) / (2019 - 1959) * (W - 16), Y = (v) => H - 14 - v / max * (H - 22);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true"><polyline points="${pts.map(([y, n]) => `${X(y)},${Y(n)}`).join(' ')}" fill="none" stroke="${COLORS[p] ?? css('--accent')}" stroke-width="1.75"/>${pts.map(([y, n]) => `<circle cx="${X(y)}" cy="${Y(n)}" r="2.2" fill="${COLORS[p] ?? css('--accent')}"><title>${y}: ${nf().format(n)}</title></circle><text x="${X(y)}" y="${H}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">${y}</text>`).join('')}</svg>`;
}
function drawSide() {
  const el = document.getElementById('side');
  const yr = ROUNDS[round];
  const repCount = (p) => info[p]?.totals?.[yr] ?? info[p]?.totals?.[{ 1979: '1979', 1999: '1999', 2009: '2009', 2019: '2019' }[yr]];
  const x = info[people] ?? {};
  const lg = x.language ?? {};
  const card = mode === 'one' ? `<div class="lang">
    <h3>${esc(pname(people))}</h3>
    ${repCount(people) != null ? `<p>${t('inRep')(nf().format(repCount(people)), yr)}</p>` : ''}
    <p><span class="k">${t('language')}:</span> ${lg.wiki ? `<a href="${esc(lg.wiki)}" target="_blank" rel="noopener">${esc(x.langName?.[LI[lang]] ?? '')}</a>` : esc(x.langName?.[LI[lang]] ?? '')}</p>
    ${x.family?.name ? `<p><span class="k">${t('family')}:</span> ${esc(x.family.name[LI[lang]])}</p>` : ''}
    ${lg.unesco ? `<p><span class="k">${t('status')}:</span> <span class="badge u${lg.unesco}">${t('unesco')[lg.unesco]}</span></p>` : ''}
    ${lg.scripts?.length ? `<p><span class="k">${t('scripts')}:</span> ${esc(lg.scripts.join(', '))}</p>` : ''}
    ${spark(people)}
  </div>
  <section class="rank"><h2>${t('districts')}</h2><ol>${units.map((u) => ({ u, c: count(u) })).filter((z) => z.c && z.c.n).sort((a, b) => b.c.n - a.c.n).slice(0, 8).map((z, i) => `<li><button type="button" data-u="${z.u.fid}"><span class="v">${i + 1}</span><span>${esc(L(z.u))}</span><span class="v">${nf().format(z.c.n)} · ${(z.c.total ? z.c.n / z.c.total * 100 : 0).toFixed(1)}%</span></button></li>`).join('')}</ol></section>` : '';
  el.innerHTML = card + `<section class="rank"><h2>${t('peoples')} · ${yr}</h2><ul class="peoplelist">${ORDER.filter((p) => info[p]).map((p) => `<li><button type="button" data-p="${esc(p)}" aria-pressed="${mode === 'one' && p === people}"><i style="background:${COLORS[p]}"></i><span>${esc(pname(p))}</span><span class="v">${repCount(p) != null ? nf().format(repCount(p)) : '—'}</span></button></li>`).join('')}</ul></section>
    <p class="note">${t('note')}</p>`;
  el.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { people = b.dataset.p; mode = 'one'; draw(); document.getElementById('body').scrollTop = 0; });
  el.querySelectorAll('[data-u]').forEach((b) => b.onclick = () => { const u = units[+b.dataset.u]; map.fitBounds(bbox(geoData.features[u.fid].geometry), { padding: pad(), maxZoom: 9, duration: still() ? 0 : 700 }); });
}
function bbox(g) { let b = [180, 90, -180, -90]; for (const poly of g.type === 'Polygon' ? [g.coordinates] : g.coordinates) for (const [x, y] of poly[0]) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; return [[b[0], b[1]], [b[2], b[3]]]; }
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (mode === 'top') q.set('mode', 'top'); else if (people !== 'Lezgins') q.set('p', people);
  if (round !== 3) q.set('y', ROUNDS[round]);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
function draw() { drawControls(); if (!units.length) return; drawLegend(); drawSide(); paint(); keepUrl(); }
document.getElementById('play').onclick = togglePlay;
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight' && round < ROUNDS.length - 1) { round++; draw(); }
  if (e.key === 'ArrowLeft' && round > 0) { round--; draw(); }
});
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
