function drawControls() {
  const rs = document.getElementById('rounds');
  rs.innerHTML = ROUNDS.map((y, i) => `<button type="button" data-r="${i}" aria-pressed="${i === round}">${y}</button>`).join('');
  rs.querySelectorAll('button').forEach((b) => b.onclick = () => { if (playing) togglePlay(); setRound(+b.dataset.r); });
  document.getElementById('play').textContent = playing ? '❚❚' : '▶';
}
function togglePlay() {
  if (playing) { clearInterval(playing); playing = null; drawControls(); return; }
  if (round >= ROUNDS.length - 1) setRound(0);
  playing = setInterval(() => { if (round >= ROUNDS.length - 1) { clearInterval(playing); playing = null; drawControls(); return; } setRound(round + 1); }, still() ? 2500 : 1600);
  drawControls();
}
function drawLegend() {
  const per = dots[yr()]?.per ?? 200;
  document.getElementById('legend').innerHTML = `<div class="row"><span class="dot" style="background:${css('--ink')}"></span>${t('dot')(per)}</div>
    <div class="row"><span class="dot" style="background:${AZ_COLOR}"></span>${t('azerbaijanis')}</div>
    <div class="row k">${t('click')}</div>`;
}
function spark(p) {
  const tot = p === 'Azerbaijanis' ? info._azerbaijanis ?? {} : info[p]?.totals ?? {};
  const pts = Object.entries(tot).map(([y, n]) => [+y, n]).filter(([, n]) => n != null).sort((a, b) => a[0] - b[0]);
  if (pts.length < 2) return '';
  const W = 320, H = 72, min = Math.min(...pts.map((x) => x[1])), max = Math.max(...pts.map((x) => x[1]));
  // The axis starts near the lowest figure, not at zero, so a change shows
  const lo = Math.max(0, min - (max - min) * .25), span = max - lo || 1;
  const X = (y) => 10 + (y - pts[0][0]) / (pts.at(-1)[0] - pts[0][0] || 1) * (W - 20), Y = (v) => H - 16 - (v - lo) / span * (H - 26);
  const c = color(p);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(([y, n]) => `${X(y)},${Y(n)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="1.75"/>${pts.map(([y, n]) => `<circle cx="${X(y)}" cy="${Y(n)}" r="2.4" fill="${c}"><title>${y}: ${nf().format(n)}</title></circle><text x="${X(y)}" y="${H - 2}" text-anchor="middle">${y}</text>`).join('')}<text x="${X(pts.at(-1)[0])}" y="${Y(pts.at(-1)[1]) - 6}" text-anchor="end">${nf().format(pts.at(-1)[1])}</text></svg>`;
}
function card(p) {
  const x = info[p] ?? {}, lg = x.language ?? {};
  const n = repCount(p), all = info._republic?.[yr()];
  return `<div class="card"><h2><i style="background:${color(p)}"></i>${esc(pname(p))}</h2>
    ${n != null ? `<p><span class="k">${t('inRep')} (${yr()}):</span> <span class="big">${nf().format(n)}</span>${all ? ` <span class="k">· ${pct(n, all)}</span>` : ''}</p>` : `<p class="k">${t('notCounted')}</p>`}
    ${x.langName ? `<p><span class="k">${t('language')}:</span> ${lg.wiki ? `<a href="${esc(lg.wiki)}" target="_blank" rel="noopener">${esc(x.langName[LI[lang]])}</a>` : esc(x.langName[LI[lang]])}</p>` : ''}
    ${x.family?.name ? `<p><span class="k">${t('family')}:</span> ${esc(x.family.name[LI[lang]])}</p>` : ''}
    ${lg.unesco ? `<p><span class="k">${t('status')}:</span> <span class="badge u${lg.unesco}">${t('unesco')[lg.unesco]}</span></p>` : ''}
    ${lg.scripts?.length ? `<p><span class="k">${t('scripts')}:</span> ${esc(lg.scripts.map(scriptName).join(', '))}</p>` : ''}
    ${spark(p)}</div>`;
}
function drawSide() {
  const el = document.getElementById('side');
  const y = yr();
  if (selected != null) {
    const u = units[selected], c = u.census[y];
    const rows = c ? top(c) : [];
    const rest = c ? c.total - rows.reduce((s, [, n]) => s + n, 0) : 0;
    el.innerHTML = `<section class="district"><button type="button" class="back" id="back">${t('back')}</button>
      <h2>${esc(L(u))}</h2><p class="where">${y}${c ? ` · ${t('total')(nf().format(c.total))}` : ` · ${t('nodata')}`}</p>
      ${c ? `<div class="bar" aria-hidden="true">${rows.map(([p, n]) => `<span style="flex:${n};background:${color(p)}" title="${esc(pname(p))}"></span>`).join('')}</div>
      <table><thead><tr><th>${t('people')}</th><th>${t('count')}</th><th>${t('share')}</th></tr></thead><tbody>
      ${rows.map(([p, n]) => `<tr><td><i style="background:${color(p)}"></i><button type="button" data-p="${esc(p)}">${esc(pname(p))}</button></td><td>${nf().format(n)}</td><td>${pct(n, c.total)}</td></tr>`).join('')}
      ${rest > 0 ? `<tr><td><i style="background:var(--rule)"></i>${t('others')}</td><td>${nf().format(rest)}</td><td>${pct(rest, c.total)}</td></tr>` : ''}</tbody></table>` : ''}
      <p class="note">${t('note')}</p></section>`;
    el.querySelector('#back').onclick = () => selectDistrict(null);
    el.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { selectDistrict(null, false); setPeople(b.dataset.p); });
    return;
  }
  const list = (dots[y]?.peoples ?? []).filter((p) => p !== 'Other').map((p) => [p, repCount(p) ?? sumDistricts(p, y)]).sort((a, b) => b[1] - a[1]);
  const ranked = people ? units.map((u) => ({ u, n: u.census[y]?.[people] ?? 0, total: u.census[y]?.total })).filter((z) => z.n > 0).sort((a, b) => b.n - a.n).slice(0, 8) : [];
  el.innerHTML = (people ? card(people) + (ranked.length ? `<section class="rank"><h2 class="sec">${t('where')} · ${y}</h2><ol>${ranked.map((z, i) => `<li><button type="button" data-u="${z.u.fid}"><span class="v">${i + 1}</span><span>${esc(L(z.u))}</span><span class="v">${nf().format(z.n)} · ${pct(z.n, z.total)}</span></button></li>`).join('')}</ol></section>` : '') : '')
    + `<section><h2 class="sec"><span>${t('peoples')} · ${y}</span>${people ? `<button type="button" id="all">${t('all')}</button>` : ''}</h2><ul class="peoplelist">${list.map(([p, n]) => `<li><button type="button" data-p="${esc(p)}" aria-pressed="${p === people}" class="${people && p !== people ? 'off' : ''}"><i style="background:${color(p)}"></i><span>${esc(pname(p))}</span><span class="v">${n != null ? nf().format(n) : '—'}</span></button></li>`).join('')}</ul></section>
    <p class="note">${t('note')}</p>`;
  el.querySelector('#all')?.addEventListener('click', () => setPeople(null));
  el.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => setPeople(b.dataset.p === people ? null : b.dataset.p));
  el.querySelectorAll('[data-u]').forEach((b) => b.onclick = () => selectDistrict(+b.dataset.u));
}
function setPeople(p) { people = p; setPaint(); draw(); document.getElementById('body').scrollTop = 0; }
function selectDistrict(fid, fly = true) {
  if (selected != null) map.setFeatureState({ source: 'units', id: selected }, { sel: false });
  selected = fid;
  if (fid != null) {
    map.setFeatureState({ source: 'units', id: fid }, { sel: true });
    map.fitBounds(bbox(geoData.features[fid].geometry), { padding: pad(), maxZoom: 9.5, duration: still() ? 0 : 700 });
  }
  draw();
  document.getElementById('body').scrollTop = 0;
}
function bbox(g) { let b = [180, 90, -180, -90]; for (const poly of g.type === 'Polygon' ? [g.coordinates] : g.coordinates) for (const [x, y] of poly[0]) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; return [[b[0], b[1]], [b[2], b[3]]]; }
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (people) q.set('p', people);
  if (round !== 3) q.set('y', yr());
  if (selected != null) q.set('d', units[selected].key);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
function draw() { drawControls(); if (!units.length) return; drawLegend(); drawSide(); keepUrl(); }
document.getElementById('play').onclick = togglePlay;
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight' && round < ROUNDS.length - 1) setRound(round + 1);
  if (e.key === 'ArrowLeft' && round > 0) setRound(round - 1);
  if (e.key === 'Escape') { if (selected != null) selectDistrict(null); else if (people) setPeople(null); }
});
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
