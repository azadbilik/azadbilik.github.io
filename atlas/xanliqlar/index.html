const L = (p) => p[lang] ?? p.az;
let areas = [], caps = [], geo = null, selected = null, show1897 = false, showToday = false, U1897 = {}, scan = 0;

const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 60, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 32, bottom: 32, left: 27 * 16 + 32 };
const labelExpr = () => ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']];
map.on('style.load', () => {

function bboxOf(f) { let b = [180, 90, -180, -90]; const g = f.geometry; const pts = g.type === 'Point' ? [g.coordinates] : g.coordinates.flatMap((p) => p[0]); for (const [x, y] of pts) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; return [[b[0], b[1]], [b[2], b[3]]]; }

  const south = caps.filter((c) => c.south);
  el.innerHTML = `<p class="caveat">${t('caveat')}</p>
    <h2 class="sec">${t('north')}</h2><ul class="klist">${north.map((a) => `<li><button type="button" data-k="${a.id}"><i style="background:${a.color}"></i><span>${esc(L(a))}</span><span class="v">${a.annexed ?? ''}</span></button></li>`).join('')}</ul>
    <h2 class="sec">${t('south')}</h2><ul class="klist">${south.map((c) => `<li><button type="button" data-k="${c.id}"><i class="pt"></i><span>${esc(L(c))}</span><span class="v">${c.annexed ?? ''}</span></button></li>`).join('')}</ul>
    <p class="note">${t('note')}</p>`;
  el.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => select(b.dataset.k));
}
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (selected) q.set('k', selected);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
function draw() { drawLegend(); if (!areas.length) return; drawSide(); keepUrl(); }
document.getElementById('scan').oninput = (e) => {
  scan = +e.target.value / 100;
  if (!map.getLayer('scan')) return;
  map.setPaintProperty('scan', 'raster-opacity', scan);
  map.setPaintProperty('k-fill', 'fill-opacity', scan ? ['*', ['case', ['boolean', ['feature-state', 'sel'], false], .7, ['boolean', ['feature-state', 'hover'], false], .6, .45], 1 - scan * .85] : ['case', ['boolean', ['feature-state', 'sel'], false], .7, ['boolean', ['feature-state', 'hover'], false], .6, .45]);
};
document.getElementById('u1897').onchange = (e) => { show1897 = e.target.checked; map.setLayoutProperty('u1897', 'visibility', show1897 ? 'visible' : 'none'); drawLegend(); };
document.getElementById('today').onchange = (e) => { showToday = e.target.checked; map.setLayoutProperty('today', 'visibility', showToday ? 'visible' : 'none'); drawLegend(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) select(null); });
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getLayer('cap-names')) map.setLayoutProperty('cap-names', 'text-field', ['get', lang]);
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field'] && l.id !== 'cap-names') map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
