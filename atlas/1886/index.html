  map.addLayer({ id: 'uezds', type: 'line', source: 'uezds', paint: { 'line-color': css('--ink'), 'line-width': .8, 'line-opacity': .35 } }, firstSymbol);
  const r = ['interpolate', ['exponential', 1.6], ['zoom'], 6, ['max', 1.2, ['*', .06, ['sqrt', ['get', 't']]]], 9, ['max', 2.5, ['*', .2, ['sqrt', ['get', 't']]]], 12, ['max', 5, ['*', .5, ['sqrt', ['get', 't']]]]];
  map.addLayer({ id: 'v', type: 'circle', source: 'v', layout: { 'circle-sort-key': ['-', ['get', 't']] }, paint: {
    'circle-radius': r,
    'circle-color': ['coalesce', ['feature-state', 'c'], '#999'],
    'circle-opacity': ['case', ['has', 'a'], 0, .88],
    'circle-stroke-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--ink'), ['has', 'a'], ['coalesce', ['feature-state', 'c'], '#999'], css('--paper')],
    'circle-stroke-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.5, ['has', 'a'], 1.6, .5],
  } });
  map.addLayer({ id: 'towns', type: 'symbol', source: 'v', filter: ['has', 'town'], layout: { 'text-field': ['coalesce', ['get', `n_${lang}`], ['get', 'n']], 'text-font': ['Noto Sans Regular'], 'text-size': 12, 'text-offset': [0, 1.2], 'text-anchor': 'top' },
    paint: { 'text-color': css('--ink'), 'text-halo-color': css('--paper'), 'text-halo-width': 1.5 } });
  map.on('mousemove', 'v', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const p = feats[e.features[0].id].properties;
    const g = p[KEY[by]];
    const k = one ?? p[TOP[by]];
    tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(p.n)}</strong> · ${nf().format(p.t)} ${t('persons')}${k && g[k] ? ` · ${esc(gname(by, k))} ${pct(g[k], p.t)}` : ''}`).addTo(map);
  });
  map.on('mouseleave', 'v', () => { map.getCanvas().style.cursor = ''; tip.remove(); });
  map.on('click', 'v', (e) => select(e.features[0].id));
  if (params.get('v')) { const f = feats.find((x) => x.properties.n === params.get('v')); if (f) { select(f.id); fly(f); } }
  draw();
});
function fly(f) { map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 10), padding: pad(), duration: still() ? 0 : 800 }); }
function select(id) {
  if (sel != null) map.setFeatureState({ source: 'v', id: sel }, { sel: false });
  sel = id;
  if (id != null) map.setFeatureState({ source: 'v', id }, { sel: true });
  draw();
  document.getElementById('body').scrollTop = 0;
}
function paint() {
  const seq = SEQ();
  for (const f of feats) {
    const p = f.properties, g = p[KEY[by]];
    let c;
    if (one) { const s = (g[one] ?? 0) / p.t; c = s <= 0 ? (dark ? 'rgba(255,255,255,.12)' : 'rgba(26,20,16,.12)') : seq[Math.min(5, Math.floor(s * 6 - 1e-9))]; }
    else c = gcol(by, p[TOP[by]]);
    map.setFeatureState({ source: 'v', id: f.id }, { c });
  }
}
function drawControls() {
  const el = document.getElementById('by');
  el.innerHTML = ['people', 'faith', 'estate'].map((m) => `<button type="button" data-by="${m}" aria-pressed="${m === by}">${t(m)}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { by = b.dataset.by; one = null; draw(); });
  document.getElementById('q').placeholder = t('find');
  document.getElementById('kondLabel').textContent = t('kond');
  document.getElementById('kond').checked = kond;
}
function drawLegend() {
  const el = document.getElementById('legend');
  const extra = `<div><span class="ring"></span>${t('ringNote')}</div><div style="color:var(--muted)">${t('sizeNote')}</div>`;
  if (one) {
    el.innerHTML = `<span>${esc(gname(by, one))} · ${t('share')}</span><div class="ramp">${SEQ().map((x) => `<span style="background:${x}"></span>`).join('')}</div><div class="ticks"><span>0</span><span>50%</span><span>100%</span></div>` + extra;
    return;
  }
  const tot = summary[by];
  const shown = Object.keys(tot).filter((k) => feats.some((f) => f.properties[TOP[by]] === k));
  el.innerHTML = `<span>${t('top')}</span>` + shown.map((k) => `<div><i class="sw" style="background:${gcol(by, k)}"></i>${esc(gname(by, k))}</div>`).join('') + extra;
}
function groupTable(kind, g, total) {
  const rows = Object.entries(g).sort((a, b) => b[1] - a[1]);
  return `<div class="bar" aria-hidden="true">${rows.map(([k, n]) => `<span style="flex:${n};background:${gcol(kind, k)}"></span>`).join('')}</div>
    <table><tbody>${rows.map(([k, n]) => `<tr><td><i style="background:${gcol(kind, k)}"></i>${esc(gname(kind, k))}</td><td>${nf().format(n)}</td><td>${pct(n, total)}</td></tr>`).join('')}</tbody></table>`;
}
function drawSide() {
  const el = document.getElementById('side');
  if (sel != null) {
    const p = feats[sel].properties;
    const U = uezds.features.find((f) => f.properties.key === p.u)?.properties;
    const where = p.town ? t('town') : [p.s && `${p.s} ${t('society')}`, U && U[lang]].filter(Boolean).join(' · ');
    el.innerHTML = `<section class="unit"><button type="button" class="back">${t('back')}</button>
      <h2 class="title">${esc(p[`n_${lang}`] ?? p.n)}</h2><p class="where">${esc(where)}</p>
      <p class="where">${nf().format(p.t)} ${t('persons')}${p.h ? ` · ${nf().format(p.h)} ${t('households')}` : ''}${p.today ? ` · ${t('today')}: ${esc(p.today)}` : ''}</p>
      ${p.nm ? `<p class="where">${t('named')(esc(p.nm))}</p>` : p.a ? `<p class="where">${t('approx')}</p>` : p.m ? `<p class="where">${t('onmap')}</p>` : ''}
      <h3>${t('people')}</h3>${groupTable('people', p.p, p.t)}
      <h3>${t('faith')}</h3>${groupTable('faith', p.f, p.t)}
      ${p.e && Object.keys(p.e).length ? `<h3>${t('estate')}</h3>${groupTable('estate', p.e, p.t)}` : ''}
      <p class="src">${t('src')}: <a href="/arxiv/?i=svod-1886" data-keep-lang>${t('spread')(p.sp)}</a>${p.no ? ` · № ${p.no}` : ''}</p>
      <p class="note">${t('note')}</p></section>`;
    el.querySelector('.back').onclick = () => select(null);
    return;
  }
  const tot = summary[by], all = Object.values(summary.people).reduce((a, b) => a + b, 0);
  const villages = Object.values(summary.uezd).reduce((a, u) => a + u.villages, 0);
  const unpl = Object.values(summary.uezd).reduce((a, u) => a + u.unplaced, 0);
  const ranked = one ? `<section class="rank"><h2>${esc(gname(by, one))} · ${t('where')}</h2><ul class="grouplist">${feats.filter((f) => f.properties[KEY[by]][one]).sort((a, b) => b.properties[KEY[by]][one] - a.properties[KEY[by]][one]).slice(0, 10).map((f) => `<li><button type="button" data-v="${f.id}"><i style="background:${gcol(by, one)}"></i><span>${esc(f.properties.n)}</span><span class="v">${nf().format(f.properties[KEY[by]][one])}</span></button></li>`).join('')}</ul></section>` : '';
  el.innerHTML = `<div class="totals"><b>${nf().format(all)}</b><small>${t('area')(nf().format(villages))}</small></div>${ranked}
    <section class="rank"><h2>${t(by)}</h2><ul class="grouplist">${Object.entries(tot).map(([k, n]) => `<li><button type="button" data-g="${k}" aria-pressed="${k === one}"><i style="background:${gcol(by, k)}"></i><span>${esc(gname(by, k))}</span><span class="v">${nf().format(n)} · ${pct(n, all)}</span></button></li>`).join('')}</ul></section>
    <p class="note">${t('unplacedN')(nf().format(unpl), nf().format(Object.values(summary.uezd).reduce((a, u) => a + u.unplacedPop, 0)))}</p>
    <p class="note">${t('note')}</p>`;
  el.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { one = one === b.dataset.g ? null : b.dataset.g; draw(); });
  el.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { const f = feats[+b.dataset.v]; select(f.id); fly(f); });
}
document.getElementById('kond').onchange = (e) => {
  kond = e.target.checked;
  for (const id of Object.keys(KJ).map((k) => `k-${k}`)) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', kond ? 'visible' : 'none');
  keepUrl();
};
const q = document.getElementById('q'), hits = document.getElementById('hits');
const fold = (s) => s.toLowerCase().replace(/ъ(?=\b|$)/g, '').replace(/[ъ]/g, '').replace(/і/g, 'и').replace(/ѣ/g, 'е').replace(/ё/g, 'е');
q.oninput = () => {
  const s = fold(q.value.trim());
  if (s.length < 2) { hits.hidden = true; return; }
  const m = feats.filter((f) => fold(f.properties.n).includes(s) || (f.properties.today && f.properties.today.toLowerCase().includes(q.value.trim().toLowerCase()))).slice(0, 30);
  hits.innerHTML = m.map((f) => `<li><button type="button" data-v="${f.id}">${esc(f.properties.n)} <small>${esc(f.properties.today ?? '')} · ${nf().format(f.properties.t)}</small></button></li>`).join('');
  hits.hidden = !m.length;
  hits.querySelectorAll('button').forEach((b) => b.onclick = () => { const f = feats[+b.dataset.v]; hits.hidden = true; q.value = ''; select(f.id); fly(f); });
};
function keepUrl() {
  const u = new URLSearchParams();
  if (lang !== 'az') u.set('lang', lang);
  if (by !== 'people') u.set('by', by);
  if (one) u.set('g', one);
  if (kond) u.set('k', '1');
  if (sel != null) u.set('v', feats[sel].properties.n);
  history.replaceState(null, '', `${location.pathname}${u.size ? '?' + u : ''}`);
}
function draw() { drawControls(); if (!feats.length) return; drawLegend(); drawSide(); paint(); keepUrl(); applyKeep(); }
function applyKeep() { document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; }); }
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  applyKeep();
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getLayer('towns')) map.setLayoutProperty('towns', 'text-field', ['coalesce', ['get', `n_${lang}`], ['get', 'n']]);
});
})();
</script>
