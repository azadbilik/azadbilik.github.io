  map.addLayer({ id: 'units-line', type: 'line', source: 'units', paint: {
    'line-color': ['case', ['boolean', ['feature-state', 'sel'], false], css('--ink'), ['boolean', ['feature-state', 'hover'], false], css('--ink'), css('--paper')],
    'line-width': ['case', ['boolean', ['feature-state', 'sel'], false], 2.25, ['boolean', ['feature-state', 'hover'], false], 1.5, .6],
  } }, firstSymbol);
  map.on('mousemove', 'units', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const u = units[e.features[0].id];
    if (hovered !== u.fid) { if (hovered != null) map.setFeatureState({ source: 'units', id: hovered }, { hover: false }); hovered = u.fid; map.setFeatureState({ source: 'units', id: hovered }, { hover: true }); }
    const x = at(u);
    const c = carried(u);
    tip.setLngLat(e.lngLat).setHTML(`<strong>${esc(L(u))}</strong> · ${gone(u) ? t('goneShort') : x ? t('of')(nf().format(x[0]), fmt(value(u, round, 'share'), 'share')) : t('nodata')}${c ? ` <small>(${t('lastKnown')(c.year)})</small>` : ''}`).addTo(map);
  });
  map.on('mouseleave', 'units', () => { map.getCanvas().style.cursor = ''; tip.remove(); if (hovered != null) map.setFeatureState({ source: 'units', id: hovered }, { hover: false }); hovered = null; });
  map.on('click', 'units', (e) => select(e.features[0].id, false));
  map.on('click', (e) => { if (!map.queryRenderedFeatures(e.point, { layers: ['units'] }).length && selected != null) select(null); });
  document.getElementById('units-list').innerHTML = units.map((u) => `<option value="${esc(L(u))}">`).join('');
  draw();
  const start = params.get('u') && units.find((u) => u.key === params.get('u'));
  if (start) select(start.fid);
});
function bboxOf(g) {
  let b = [180, 90, -180, -90];
  for (const poly of g.type === 'Polygon' ? [g.coordinates] : g.coordinates) for (const [x, y] of poly[0]) b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)];
  return [[b[0], b[1]], [b[2], b[3]]];
}
function paint() {
  for (const u of units) {
    const v = value(u);
    map.setFeatureState({ source: 'units', id: u.fid }, { color: v == null ? (dark ? 'rgba(255,255,255,.05)' : 'rgba(26,20,16,.06)') : gone(u) ? (dark ? '#3A2E2A' : '#D9D2C8') : SEQ[classOf(v)], carried: !!carried(u) });
  }
}
function drawControls() {
  const ms = document.getElementById('measures');
  ms.style.gridTemplateColumns = 'repeat(2, 1fr)';
  ms.innerHTML = ['share', 'count'].map((m) => `<button type="button" data-m="${m}" aria-pressed="${m === measure}">${t(m)}</button>`).join('');
  ms.querySelectorAll('button').forEach((b) => b.onclick = () => { measure = b.dataset.m; draw(); });
  const rs = document.getElementById('rounds');
  rs.innerHTML = ROUNDS.map((r) => `<button type="button" data-r="${r.i}" aria-pressed="${r.i === round}">${r.label}</button>`).join('');
  rs.querySelectorAll('button').forEach((b) => b.onclick = () => { if (playing) togglePlay(); round = +b.dataset.r; draw(); });
  const r = ROUNDS[round];
  document.getElementById('round-note').innerHTML = `<span>${['geo', 'dag', 'arm'].filter((k) => r[k]).map((k) => `${t(k)} ${r[k]}`).join(' · ')}</span>`;
  const play = document.getElementById('play');
  play.textContent = playing ? '❚❚' : '▶';
  play.setAttribute('aria-label', playing ? t('pause') : t('play'));
  play.title = play.getAttribute('aria-label');
}
function togglePlay() {
  if (playing) { clearInterval(playing); playing = null; drawControls(); return; }
  if (round >= ROUNDS.length - 1) round = 0;
  playing = setInterval(() => { if (round >= ROUNDS.length - 1) { clearInterval(playing); playing = null; drawControls(); return; } round++; draw(); }, still() ? 2500 : 1500);
  draw();
}
function drawLegend() {
  document.getElementById('legend').innerHTML = `<span>${t(measure)}${measure === 'share' ? ` (${t('ofTotal')})` : ''}</span>
    <div class="ramp">${SEQ.map((x) => `<span style="background:${x}"></span>`).join('')}</div>
    <div class="ticks">${SCALES[measure].ticks.slice(1).map((x) => `<span>${x}</span>`).join('')}</div>
    <div class="nodata"><i style="background:${SEQ[3]};opacity:.4"></i>${t('carriedNote')}</div>
    ${ROUNDS[round].arm ? '' : `<div class="nodata"><i style="background:${dark ? '#3A2E2A' : '#D9D2C8'}"></i>${t('goneShort')}</div>`}
    <div class="nodata"><i></i>${t('nodata')}</div>`;
}
// Each country's totals: a line per country, Azerbaijanis counted at each census
function chart() {
  const W = 320, H = 96, P = 18, C = { geo: css('--accent'), dag: css('--second'), arm: css('--third') || '#5B6B2E' };
  const years = [1926, 1939, 1959, 1970, 1979, 1989, 2002, 2010, 2014, 2021];
  const max = Math.max(1, ...Object.values(extras.totals).flatMap((o) => Object.values(o).map((x) => x.az ?? 0)));
  const X = (y) => P + (y - 1926) / (2021 - 1926) * (W - 2 * P), Y = (v) => H - 14 - v / max * (H - 24);
  const lines = Object.entries(extras.totals).map(([k, o]) => {
    const pts = Object.entries(o).filter(([, x]) => x.az != null).sort(([a], [b]) => a - b);
    return pts.length ? `<polyline points="${pts.map(([y, x]) => `${X(+y)},${Y(x.az)}`).join(' ')}" fill="none" stroke="${C[k]}" stroke-width="1.75"/>${pts.map(([y, x]) => `<circle cx="${X(+y)}" cy="${Y(x.az)}" r="2" fill="${C[k]}"><title>${t(k)} ${y}: ${nf().format(x.az)}</title></circle>`).join('')}` : '';
  }).join('');
  const keys = Object.keys(extras.totals).filter((k) => Object.keys(extras.totals[k]).length).map((k) => `<tspan fill="${C[k]}">● </tspan><tspan>${t(k)}  </tspan>`).join('');
  return `<svg viewBox="0 0 ${W} ${H + 14}" role="img" aria-label="${t('count')}">${lines}
    ${[1926, 1959, 1989, 2021].map((y) => `<text x="${X(y)}" y="${H}" text-anchor="middle">${y}</text>`).join('')}
    <text x="${P}" y="${H + 13}">${keys}</text></svg>`;
}
function drawSide() {
  const el = document.getElementById('side');
  if (selected != null) return drawUnit(el, units[selected]);
  const tot = (k) => { const y = ROUNDS[round][k]; if (k === 'arm' && !y) return `<div class="total"><span>${t(k)}</span><b>0</b><small>${t('goneShort')}</small></div>`;
    // No census this round: the last total known, said so
    let yy = y, x = y && extras.totals[k]?.[y], last = false;
    if (!x) for (let r = round - 1; r >= 0; r--) { const z = ROUNDS[r][k]; if (z && extras.totals[k]?.[z]) { yy = z; x = extras.totals[k][z]; last = true; break; } }
    if (last) return `<div class="total"><span>${t(k)} · ${yy}</span><b>${nf().format(x.az)}</b><small>${t('lastKnown')(yy)}</small></div>`; return `<div class="total"><span>${t(k)}${y ? ` · ${y}` : ''}</span><b>${x?.az != null ? nf().format(x.az) : '—'}</b><small>${x?.az != null && x.total ? fmt(x.az / x.total * 100, 'share') + ' ' + t('ofTotal') : ''}</small></div>`; };
  const born = (k) => {
    const ps = units.filter((u) => u.region === k).flatMap((u) => extras.poets[u.id] ?? []);
    if (!ps.length) return '';
    const link = (p) => `<a href="${lang === 'az' ? '' : ''}https://kitabxana.az${lang === 'az' ? '' : '/' + lang}/authors/${p.slug}">${esc(L(p))}</a>`;
    return `<p class="who">${t('bornIn')[k]} ${ps.slice(0, 8).map(link).join(', ')}${ps.length > 8 ? ` ${t('more')(ps.length - 8)}` : ''}</p>`;
  };
  el.innerHTML = `<div class="totals">${tot('geo')}${tot('dag')}${tot('arm')}</div><div class="chart">${chart()}</div>
    ${COMMUNITIES.map((c, i) => `<section class="community"><h3>${esc(L(c.name))}</h3><p>${esc(L(c.text))}</p>${born(c.region)}<button type="button" class="go" data-c="${i}">${t('show')} →</button></section>`).join('')}
    <p class="note">${t('note')}</p>`;
  el.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => map.fitBounds(COMMUNITIES[+b.dataset.c].focus, { padding: pad(), duration: still() ? 0 : 700 }));
}
function drawUnit(el, u) {
  const years = [...new Set(ROUNDS.map((r) => r[u.region]).filter(Boolean))];
  const rows = years.map((y) => {
    const x = u.series[y], s = extras.sources[u.id]?.[y];
    return `<tr><td>${y}</td><td>${x ? nf().format(x[0]) : '—'}</td><td>${x && x[1] ? fmt(x[0] / x[1] * 100, 'share') : ''}</td><td>${s ? `<a href="${esc(s)}" target="_blank" rel="noopener">${t('src')} ↗</a>` : ''}</td></tr>`;
  }).join('');
  const ps = extras.poets[u.id] ?? [];
  el.innerHTML = `<div class="unit"><button type="button" class="back" id="back">${t('back')}</button>
    <p class="title">${esc(L(u))}</p><p class="where">${t(u.region)}</p>
    ${ps.length ? `<p class="who">${t('born')} ${ps.map((p) => `<a href="https://kitabxana.az${lang === 'az' ? '' : '/' + lang}/authors/${p.slug}">${esc(L(p))}</a>`).join(', ')}</p>` : ''}
    <table><thead><tr><th>${t('year')}</th><th>${t('az')}</th><th>${t('pct')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  document.getElementById('back').onclick = () => select(null);
}
function select(fid, fly = true) {
  if (selected != null) map.setFeatureState({ source: 'units', id: selected }, { sel: false });
  selected = fid;
  if (fid != null) map.setFeatureState({ source: 'units', id: fid }, { sel: true });
  if (fid != null && fly) map.fitBounds(units[fid].bbox, { padding: pad(), maxZoom: 9, duration: still() ? 0 : 700 });
  drawSide(); keepUrl();
}
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (measure !== 'share') q.set('m', measure);
  if (round !== 5) q.set('y', ROUNDS[round].label);
  if (selected != null) q.set('u', units[selected].key);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}`);
}
function draw() { drawControls(); drawLegend(); drawSide(); if (map.getSource('units')) paint(); if (units.length) keepUrl(); }
document.getElementById('play').onclick = togglePlay;
document.getElementById('find').addEventListener('change', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const u = units.find((x) => [x.az, x.ru, x.en, x.key].some((n) => n?.toLowerCase() === q)) ?? units.find((x) => [x.az, x.ru, x.en].some((n) => n?.toLowerCase().includes(q)));
  if (u) { select(u.fid); e.target.value = ''; e.target.blur(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight' && round < ROUNDS.length - 1) { round++; draw(); }
  if (e.key === 'ArrowLeft' && round > 0) { round--; draw(); }
  if (e.key === 'Escape' && selected != null) select(null);
});
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('find').placeholder = t('find');
  if (units.length) document.getElementById('units-list').innerHTML = units.map((u) => `<option value="${esc(L(u))}">`).join('');
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
}
applyLang();
draw();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang(); draw();
  if (map.getStyle()) for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) map.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
