(() => {
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const LANGS = ['az', 'ru', 'en'];

})();
const T = {
  az: { offLegend: 'xəritədə yoxdur', offNote: 'Musiqi xəritəsində yoxdur; yalnız cümlələrdə ustad kimi adı keçir.', doc: 'Silsilə · Azad Bilik', title: 'Silsilə', sub: 'Ustaddan şagirdə', music: 'Musiqi',
    lede: (s) => `${s.people} xanəndə, tarzən və aşıq arasında ${s.links} ustad-şagird əlaqəsi: ${s.wd}-i Wikidata-da yazılıb, ${s.tx}-i Vikipediya məqalələrindəki cümlələrdən çıxarılıb (cümlə hər əlaqənin yanındadır). Bu iki növ ayrı göstərilir: qırıq xətt mətndən çıxarılan əlaqədir.`,
    sWd: 'Wikidata', sTx: 'Mətndən', rKhanende: 'Xanəndə', rTar: 'Tarzən', rAshik: 'Aşıq', rOther: 'Başqa',
    hint: 'Nəsillər soldan sağa düzülüb: ustad solda, şagirdi sağda. Musiqiçinin üstünə gəlin və ya toxunun: ustadları, şagirdləri və bütün silsiləsi işıqlanır. Təkərlə və ya iki barmaqla yaxınlaşdırın; «Şəbəkə» eyni əlaqələri sərbəst düzür. Aşağıda eyni silsilələr siyahı ilə də var.',
    pick: 'Musiqiçi seçin.', born: 'Doğulub', place: 'Yer', teachers: 'Ustadları', students: 'Şagirdləri', read: 'Vikipediya', kx: 'Kitabxana', wdLink: 'Wikidata',
    viaWd: 'Wikidata', viaTx: 'mətndən', none: '—', years: 'illər',
    linH: 'Silsilələr siyahı ilə', linNote: 'Hər silsilənin kökü: ustadı bilinməyən musiqiçi; altında şagirdləri. ● Wikidata, ◦ mətndən.',
    methodH: 'Necə yığılıb',
    method: (s) => `<ul><li><b>Adamlar:</b> <a href="../">Musiqi</a> səhifəsinin xəritəsindəki ${s.base} xanəndə, tarzən və aşıq (Wikidata Q2493398, Q12846426, Q7097633) və onların ustad-şagird əlaqəsində olub xəritədə olmayanlar. Yalnız əlaqəsi olanlar göstərilir.</li>
<li><b>Xəritədən kənar ustadlar (${s.offmap}):</b> cümlələrdə adı keçən, amma xəritədə olmayan ustadlar (Nəvvab, Məşədi İsi, Sarabski...) yalnız bu silsilə məlumatındadır (boş dairə); Wikidata nömrəsi olanlar nömrəsi ilə.</li><li><b>Wikidata:</b> «şagirdi» (P1066) və «şagirdləri» (P802) xassələri; ${s.wd} əlaqə. Wikidata-da bu xassələr çox seyrəkdir.</li>
<li><b>Mətndən:</b> az, ru və en Vikipediya məqalələrində «şagird», «ustad», «ученик», «учился у», «student of» kimi sözlə yanaşı başqa musiqiçinin adı olan cümlələr. Cümlələri əl ilə oxuyub istiqaməti (kim kimin şagirdi) yalnız cümlənin dediyi qədər qoymuşam; ${s.candidates} namizəd cümlədən yalnız aydın olanlar götürülüb (qalanı başqa adla qarışıb, istiqamətsiz ya şübhəlidir). Bu əlaqələr Vikipediyanın iddiasıdır, Wikidata-nın yox; <a href="data/lineage.quickstatements.txt">QuickStatements faylı</a> onların Wikidata-ya əlavə edilməsi üçün siyahıdır.</li>
<li><b>Düzülüş:</b> ELK-in qatlı alqoritmi (elkjs): hər nəsil bir sütun, kəsişmələr azaldılıb; «Şəbəkə» görünüşü ForceAtlas2-dir (sigma.js, graphology). Silsilənin yaşı «ustad–şagird» əlaqələrinin sayından asılıdır, tarixi tamlıqdan yox: məsələn, Qaryağdıoğlu və Hacı Hüsü silsilələri Wikidata-da və Vikipediyada tam yazılmayıb.</li></ul>`,
    foot: (d) => `Mənbə: Wikidata (CC0) və az/ru/en Vikipediya (CC BY-SA, cümlələr qısa sitatdır), ${d}. Fayl: <a href="data/lineage.json">lineage.json</a>.` },
  ru: { offLegend: 'нет на карте', offNote: 'Нет на карте музыки; назван в предложениях как учитель.', doc: 'Школы · Azad Bilik', title: 'Школы', sub: 'От учителя к ученику', music: 'Музыка',
    lede: (s) => `Среди ${s.people} ханенде, тарзенов и ашугов — ${s.links} связей «учитель — ученик»: ${s.wd} записаны в Wikidata, ${s.tx} выделены из предложений статей Википедии (предложение приведено рядом со связью). Два вида показаны отдельно: пунктир — связь из текста.`,
    sWd: 'Wikidata', sTx: 'Из текста', rKhanende: 'Ханенде', rTar: 'Тарзен', rAshik: 'Ашуг', rOther: 'Другое',
    hint: 'Поколения идут слева направо: учитель левее ученика. Наведите на музыканта или коснитесь его: подсветятся учителя, ученики и вся линия. Колесо или два пальца — масштаб; «Сеть» раскладывает те же связи свободно. Ниже те же линии списком.',
    pick: 'Выберите музыканта.', born: 'Родился', place: 'Место', teachers: 'Учителя', students: 'Ученики', read: 'Википедия', kx: 'Библиотека', wdLink: 'Wikidata',
    viaWd: 'Wikidata', viaTx: 'из текста', none: '—', years: 'годы',
    linH: 'Линии списком', linNote: 'Корень каждой линии — музыкант без известного учителя, под ним его ученики. ● Wikidata, ◦ из текста.',
    methodH: 'Как собрано',
    method: (s) => `<ul><li><b>Люди:</b> ${s.base} ханенде, тарзенов и ашугов с карты на странице «<a href="../">Музыка</a>» (Wikidata Q2493398, Q12846426, Q7097633) и те, кто связан с ними как учитель или ученик, но не на карте. Показаны только имеющие связи.</li>
<li><b>Учителя вне карты (${s.offmap}):</b> названные в предложениях, но отсутствующие на карте (Навваб, Машади Иси, Сарабский...) есть только в данных этой страницы (пустой кружок); с номером Wikidata — где он есть.</li><li><b>Wikidata:</b> свойства «ученик» (P802) и «учитель» (P1066); ${s.wd} связей. В Wikidata эти свойства заполнены редко.</li>
<li><b>Из текста:</b> предложения статей az, ru и en Википедии, где рядом со словом вроде «şagird», «ученик», «учился у», «student of» названо другое имя из списка. Я прочитал предложения и поставил направление (кто чей ученик) лишь настолько, насколько оно сказано; из ${s.candidates} предложений-кандидатов оставлены только ясные (остальные — совпадение имён, без направления или сомнительные). Это утверждения Википедии, не Wikidata; <a href="data/lineage.quickstatements.txt">файл QuickStatements</a> — список для добавления их в Wikidata.</li>
<li><b>Раскладка:</b> послойный алгоритм ELK (elkjs): каждое поколение — столбец, пересечения сведены к минимуму; вид «Сеть» — ForceAtlas2 (sigma.js, graphology). Размер линии зависит от числа записанных связей, а не от исторической полноты: линии Карьягдыоглу и Хаджи Хюсю в Wikidata и Википедии записаны неполно.</li></ul>`,
    foot: (d) => `Источники: Wikidata (CC0) и az/ru/en Википедия (CC BY-SA, предложения — короткие цитаты), ${d}. Файл: <a href="data/lineage.json">lineage.json</a>.` },
  en: { offLegend: 'not on the map', offNote: 'Not on the music map; named as a master in the sentences.', doc: 'Lineages · Azad Bilik', title: 'Lineages', sub: 'From master to student', music: 'Music',
    lede: (s) => `Among ${s.people} khanendes, tar players and ashiks, ${s.links} master–student links: ${s.wd} are stated on Wikidata, ${s.tx} are read from sentences in Wikipedia articles (the sentence sits beside each link). The two kinds are shown apart: a dashed line is a link from text.`,
    sWd: 'Wikidata', sTx: 'From text', rKhanende: 'Khanende', rTar: 'Tar player', rAshik: 'Ashik', rOther: 'Other',
    hint: 'Generations run left to right: a master stands left of their students. Hover or tap a musician: their masters, students and whole line light up. Wheel or pinch to zoom; «Network» lays the same links out freely. The same lineages are listed below.',
    pick: 'Pick a musician.', born: 'Born', place: 'Place', teachers: 'Masters', students: 'Students', read: 'Wikipedia', kx: 'Library', wdLink: 'Wikidata',
    viaWd: 'Wikidata', viaTx: 'from text', none: '—', years: 'years',
    linH: 'Lineages as lists', linNote: 'The root of each lineage is a musician with no known master, their students beneath. ● Wikidata, ◦ from text.',
    methodH: 'How it was gathered',
    method: (s) => `<ul><li><b>People:</b> the ${s.base} khanendes, tar players and ashiks on the map of <a href="../">Music</a> (Wikidata Q2493398, Q12846426, Q7097633) plus anyone tied to them as master or student who is not on the map. Only those with a link are shown.</li>
<li><b>Masters not on the map (${s.offmap}):</b> teachers named in the sentences but absent from the map (Navvab, Mashadi Isi, Sarabski...) live only in this page's data (hollow circle), with a Wikidata id where one exists.</li><li><b>Wikidata:</b> the properties student of (P1066) and student (P802); ${s.wd} links. These are sparsely filled on Wikidata.</li>
<li><b>From text:</b> sentences of az, ru and en Wikipedia articles with a word such as «şagird», «ученик», «учился у», «student of» beside another musician's name from the list. I read the sentences and set the direction (who was whose student) only as far as the sentence says; of ${s.candidates} candidate sentences only the clear ones were kept (the rest were name mix-ups, had no direction, or were doubtful). These are Wikipedia's claims, not Wikidata's; the <a href="data/lineage.quickstatements.txt">QuickStatements file</a> lists them for adding to Wikidata.</li>
<li><b>Layout:</b> ELK's layered algorithm (elkjs): each generation a column, crossings kept few; the «Network» view is ForceAtlas2 (sigma.js, graphology). A lineage's size reflects how many links are written down, not history: the Qaryağdıoğlu and Hacı Hüsü lines are thinly recorded on Wikidata and Wikipedia.</li></ul>`,
    foot: (d) => `Sources: Wikidata (CC0) and az/ru/en Wikipedia (CC BY-SA; the sentences are short quotations), ${d}. File: <a href="data/lineage.json">lineage.json</a>.` },
};
const t = (k) => T[lang][k];
const COL = { khanende: 'var(--accent)', tar: 'var(--second)', ashik: 'var(--third)', other: 'var(--muted)' };
const ROLEK = { khanende: 'rKhanende', tar: 'rTar', ashik: 'rAshik', other: 'rOther' };
let D = null, sel = null, show = { wikidata: true, text: true };
const info = document.getElementById('info'), stage = document.getElementById('stage');
let G = null;
const nm = (p) => p[lang] || p.az || p.en || p.ru || p.qid;
const role = (p) => (p.roles?.[0] ?? 'other');
const kxBase = () => `https://kitabxana.az${lang === 'az' ? '' : '/' + lang}`;
const yrs = (p) => p.born || p.died ? `${p.born ?? '?'}–${p.died ?? ''}` : '';

let byQ, links, kids, parents;
function index() {
  byQ = new Map(D.people.map((p) => [p.qid, p]));
  links = D.links.filter((l) => show[l.src]);
  kids = new Map(); parents = new Map();
  for (const l of links) { (kids.get(l.t) ?? kids.set(l.t, []).get(l.t)).push(l); (parents.get(l.s) ?? parents.set(l.s, []).get(l.s)).push(l); }
}
const closure = (q, map, key) => { const out = new Set([q]), st = [q]; while (st.length) for (const l of map.get(st.pop()) ?? []) if (!out.has(l[key])) { out.add(l[key]); st.push(l[key]); } return out; };

// ---- the graph (shared/graph.js): a layered tree by ELK, or a force network; the source chips only hide links
const LINKS = () => D.links.map((l, i) => ({ ...l, id: `${l.t}>${l.s}`, source: l.t, target: l.s }));
let allKids;
function draw() {
  if (!D) return;
  if (G) { describe(); return; }
  const edges = LINKS(), ids = new Set(edges.flatMap((e) => [e.t, e.s]));
  allKids = new Map(); for (const l of D.links) allKids.set(l.t, (allKids.get(l.t) ?? 0) + 1);
  const nodes = [...ids].map((q) => byQ.get(q));
  const lab = (p) => nm(p);
  G = createGraph(stage, {
    nodes: nodes.map((p) => ({ ...p, id: p.qid })), edges,
    layout: 'layered', direction: 'RIGHT', toggle: true, edgeClick: false,
    label: lab, searchText: (p) => [p.az, p.ru, p.en].join(' '), color: (p) => COL[role(p)], hollow: (p) => !!p.offmap,
    size: (p) => 4.2 + 1.5 * Math.sqrt(allKids.get(p.qid) ?? 0),
    // Wikidata solid and dark, text dashed and lighter; a focused line in the musician's own colour
    dashed: (e) => e.src === 'text', dash: [3, 3.5], edgeWidth: (e) => (e.src === 'text' ? 1 : 1.45), edgeAlpha: 0.65, labelSize: 12,
    edgeColor: (e) => (e.src === 'text' ? 'var(--muted)' : 'var(--ink)'), litColor: 'node',
    // labels down to 9.5 px, cut short rather than dropped; open on the main lineage (a phone: its left part)
    minLabel: 9.5, trimLabels: true, start: 'main', panHint: true,
    // a musician lights up their whole line: every master above and every student below
    focus: (q) => {
      const up = closure(q, parents, 't'), down = closure(q, kids, 's'), es = new Set();
      for (const l of links) if ((up.has(l.t) && up.has(l.s)) || (down.has(l.t) && down.has(l.s))) es.add(`${l.t}>${l.s}`);
      return { nodes: new Set([...up, ...down]), edges: es };
    },
    tooltip: (p) => `<div class="tt"><b>${esc(nm(p))}</b><span>${esc([t(ROLEK[role(p)]), yrs(p)].filter(Boolean).join(' · '))}</span></div>`,
    panel: info,
    onSelect: (f) => { sel = f?.type === 'node' ? f.id : null; describe(); },
  });
  G.setFilter(null, (e) => show[e.src]);
}
const wikiLink = (p, l) => p.wiki?.[l] ? `<a href="https://${l}.wikipedia.org/wiki/${encodeURI(p.wiki[l])}">${l}</a>` : '';
function linkLine(l, other) {
  const q = byQ.get(other);
  return `<li><a href="#" data-q="${other}">${esc(nm(q))}</a> <span class="muted">${yrs(q)}</span>${l.src === 'text' ? `<span class="tag">${esc(t('viaTx'))}</span>` : `<span class="tag">${esc(t('viaWd'))}</span>`}${l.src === 'text' && l.sentence ? `<blockquote>${esc(l.sentence)} <a href="${esc(l.article)}">${esc(l.lang)}.wikipedia</a></blockquote>` : ''}</li>`;
}
function describe() {
  const p = sel && byQ.get(sel);
  if (!p) { info.innerHTML = `<p class="empty">${esc(t('pick'))}</p>`; return; }
  const ts = parents.get(sel) ?? [], ss = kids.get(sel) ?? [];
  const row = (k, v) => v ? `<dt>${esc(t(k))}</dt><dd>${v}</dd>` : '';
  info.innerHTML = `<div class="k">${esc(t(ROLEK[role(p)]))}</div><h3>${esc(nm(p))}</h3><dl>
    ${row('born', esc(yrs(p)))}${p.offmap ? '' : row('place', esc(p.place ?? ''))}
    ${row('teachers', ts.length ? `<ul>${ts.map((l) => linkLine(l, l.t)).join('')}</ul>` : '')}
    ${row('students', ss.length ? `<ul>${ss.map((l) => linkLine(l, l.s)).join('')}</ul>` : '')}
    ${row('read', LANGS.map((l) => wikiLink(p, l)).filter(Boolean).join(' · '))}
    ${/^Q\d/.test(p.qid) ? row('wdLink', `<a href="https://www.wikidata.org/wiki/${p.qid}">${p.qid}</a>`) : ''}${p.offmap ? row('place', esc(t('offNote'))) : ''}${p.kitabxana ? row('kx', `<a href="${kxBase()}/authors/${encodeURIComponent(p.kitabxana)}">kitabxana.az</a>`) : ''}</dl>${MQL.block(p.qid)}`;
  info.querySelectorAll('a[data-q]').forEach((a) => a.onclick = (e) => { e.preventDefault(); G?.focus(a.dataset.q); });
}

function tree() {
  // Every musician with no known master is a root; their students beneath, once per path (no cycles)
  const roots = [...new Set(links.flatMap((l) => [l.t, l.s]))].filter((q) => !(parents.get(q) ?? []).length).sort((a, b) => (byQ.get(a).born ?? 9999) - (byQ.get(b).born ?? 9999));
  const item = (q, l, path) => {
    const p = byQ.get(q), c = (kids.get(q) ?? []).filter((x) => !path.has(x.s));
    return `<li><span class="who"><i class="dot" style="--c:${COL[role(p)]}"></i><b>${esc(nm(p))}</b> <span class="yr">${yrs(p)}</span>${l ? `<span class="link">${l.src === 'wikidata' ? '●' : '◦'}</span>` : ''}</span>${c.length ? `<ul>${c.map((x) => item(x.s, x, new Set([...path, q]))).join('')}</ul>` : ''}</li>`;
  };
  document.getElementById('lin').innerHTML = roots.map((q) => `<div><ul>${item(q, null, new Set())}</ul></div>`).join('');
}

function chips() {
  const n = (s) => D.links.filter((l) => l.src === s).length;
  document.getElementById('src').innerHTML = ['wikidata', 'text'].map((s) => `<button type="button" data-s="${s}" aria-pressed="${show[s]}"><i class="${s === 'text' ? 'dash' : ''}"></i>${esc(t(s === 'text' ? 'sTx' : 'sWd'))} · ${n(s)}</button>`).join('');
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { show[b.dataset.s] = !show[b.dataset.s]; if (!show.wikidata && !show.text) show[b.dataset.s] = true; render(); G?.setFilter(null, (e) => show[e.src]); });
  document.getElementById('legend').innerHTML = ['khanende', 'tar', 'ashik'].map((r) => `<span><i style="--c:${COL[r]}"></i>${esc(t(ROLEK[r]))}</span>`).join('') + `<span><i class="off"></i>${esc(t('offLegend'))}</span>`;
}
function render() { index(); chips(); draw(); tree(); if (G) { G.setStrings(); G.relabel(); } }
function applyLang() {
  document.documentElement.lang = lang; document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((e) => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
  if (!D) return;
  const s = { ...D.stats };
  document.getElementById('lede').textContent = t('lede')(s);
  document.getElementById('hint').textContent = t('hint');
  document.getElementById('method').innerHTML = t('method')(s);
  document.getElementById('foot').innerHTML = t('foot')(D.built);
  render();
}
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  applyLang();
});
applyLang();
Promise.all([fetch('data/lineage.json').then((r) => r.json()), MQL.load()]).then(([d]) => { D = d; applyLang(); });
})();
</script>
