    method: (s) => `<ul><li><b>Bəstəkarlar:</b> Wikidata-da «bəstəkar» (Q36834) peşəsi olan və Azərbaycan vətəndaşı, azərbaycanlı etnik mənşəli, yaxud Azərbaycanda doğulmuş şəxslər (275). Azərbaycanda doğulub başqa xalqın bəstəkarı olan beş nəfər (Tərteryan, Kajlayev, Kogan, Rabinoviç-Barakovski, Yekimyan) çıxarılıb. Müslüm Maqomayev (1885) və Niyazi filtrdən keçmədiyi üçün nömrə ilə əlavə olunub.</li>

<li><b>Kitabxana:</b> libretto və ya əsas mətn kitabxana.az-da varsa göstərilir (Hacıbəylinin librettoları, Nizami, Füzuli, Cabbarlı); əlaqəni əl ilə qurmuşam.</li>
<li><b>Yenidən qurmaq:</b> <code>node scripts/composers.mjs</code> (Wikidata), <code>node scripts/people-text.mjs</code> (cümlələr), sonra <code>node scripts/composers-build.mjs</code>.</li></ul>

  ru: { doc: 'Композиторы · Azad Bilik', music: 'Музыка', title: 'Композиторы', sub: 'От Гаджибекова до наших дней',
    lede: (s) => `В 1908 году Узеир Гаджибеков написал оперу «Лейли и Меджнун», первую оперу мусульманского Востока. Здесь ${s.people} композиторов, ${s.works} их сценических и оркестровых произведений (${s.byType.opera} опер, ${s.byType.ballet} балетов, ${s.byType.musical} музыкальных комедий, ${s.byType.orchestral} симфонических), ${s.links} связей «учитель — ученик»; у ${s.withLibrary} произведений либретто или первоисточник есть на <a href="https://kitabxana.az">kitabxana.az</a>. Всё из Wikidata (CC0), связи, извлечённые из текстов, отмечены отдельно.`,

    pickW: 'Выберите произведение.', composer: 'Композитор', year: 'Год', premiere: 'Премьера', basedOn: 'По мотивам', libretto: 'Либретто', kind: 'Жанр', read: 'Википедия', wd: 'Wikidata', place: 'Место', born: 'Родился', teachers: 'Учителя', students: 'Ученики', kx: 'Библиотека',

    lLibretto: 'Либретто', lSource: 'Первоисточник', lEssay: 'Статья композитора',

    jHac: 'Линия Гаджибекова', jQar: 'Школа Караева', offLegend: 'вне списка', pick: 'Выберите композитора.', linH: 'Линии списком',
    allH: 'Все произведения', thYear: 'Год', thTitle: 'Произведение', thComp: 'Композитор', thType: 'Жанр', thLib: 'Библиотека',
    methodH: 'Как собрано',
    method: (s) => `<ul><li><b>Композиторы:</b> в Wikidata с профессией «композитор» (Q36834) и гражданством Азербайджана, азербайджанским этносом или местом рождения в Азербайджане (275). Пятеро, родившихся там, но принадлежащих другим традициям (Тертерян, Кажлаев, Коган, Рабинович-Бараковский, Экимян), исключены. Муслим Магомаев (1885) и Ниязи не проходили фильтр и добавлены по номеру.</li>
<li><b>Произведения:</b> те, у кого композитор (P86) — эти люди; отобраны опера, балет, музыкальная комедия и симфонические (не песни, не музыка к фильмам). Дата — премьера (P1191), иначе первая указанная. Wikidata знает не всё: например, нет оперы Караева «Ватан» и многих сочинений Джевдета Гаджиева; <i>список не полный</i>. ${s.unreffed} дат премьер в Wikidata без источника.</li>
<li><b>Учитель — ученик:</b> ${s.wd} связей записаны в Wikidata (P802, P1066) и ${s.tx} извлечены из предложений статей az, ru и en Википедии, прочитанных вручную (предложение рядом со связью). Списки «учеников Гаджибекова» и «учеников Караева» взяты из русской Википедии. Кандидаты: <a href="data/composers.candidates.json">composers.candidates.json</a>, отобранные: <a href="data/composers.text.spec.json">composers.text.spec.json</a>.</li>
<li><b>Библиотека:</b> показаны либретто и первоисточники, которые есть на kitabxana.az (либретто Гаджибекова, Низами, Физули, Джаббарлы); связи подобрал вручную.</li>
<li><b>Пересборка:</b> <code>node scripts/composers.mjs</code> (Wikidata), <code>node scripts/people-text.mjs</code> (предложения), затем <code>node scripts/composers-build.mjs</code>.</li></ul>
<p class="hint">Оговорки: утверждений вроде «первый балет» в Wikidata нет, поэтому я утверждаю лишь то, что есть в английской Википедии: «Лейли и Меджнун» — первая опера Востока (1908), Шафига Ахундова — первая женщина Востока, написавшая оперу («Невестина башня», 1972). Связи охватывают композиторские классы, но не частные уроки. Часть связей в Wikidata без источника (с источником — 8 из ${s.wd}).</p>`,

  en: { doc: 'Composers · Azad Bilik', music: 'Music', title: 'Composers', sub: 'From Hajibeyov to today',
    lede: (s) => `In 1908 Uzeyir Hajibeyov wrote «Leyli and Majnun», the first opera of the Muslim East. This page holds ${s.people} composers, ${s.works} of their stage and orchestral works (${s.byType.opera} operas, ${s.byType.ballet} ballets, ${s.byType.musical} musical comedies, ${s.byType.orchestral} symphonic pieces) and ${s.links} teacher–student links; for ${s.withLibrary} works the libretto or source text is at <a href="https://kitabxana.az">kitabxana.az</a>. All from Wikidata (CC0); links read from texts are marked apart.`,
    tlH: 'Premieres, 1908 to today', tlHint: 'Each dot is a work; pick one. Colour is the composer\'s generation. The date is Wikidata\'s premiere date; where there is none, the first date on the item is used and marked.',

    method: (s) => `<ul><li><b>Composers:</b> on Wikidata with occupation composer (Q36834) and citizenship of Azerbaijan, Azerbaijani ethnicity or a birthplace in Azerbaijan (275). Five born there but belonging to other traditions (Terterian, Kajlayev, Kogan, Rabinovitch-Barakovsky, Ekimyan) are left out. Muslim Magomayev (1885) and Niyazi did not pass the filter and are added by id.</li>

<li><b>Library:</b> libretti and source texts that exist at kitabxana.az are shown (Hajibeyov's libretti, Nizami, Fuzuli, Jabbarli); I matched them by hand.</li>
<li><b>Rebuild:</b> <code>node scripts/composers.mjs</code> (Wikidata), <code>node scripts/people-text.mjs</code> (sentences), then <code>node scripts/composers-build.mjs</code>.</li></ul>
<p class="hint">Caveats: Wikidata has no «first ballet» claims, so I only state what English Wikipedia says: «Leyli and Majnun» is the first opera of the East (1908), Shafiga Akhundova the first woman of the East to compose an opera («Galin gayasi», 1972). The links cover composition classes, not private lessons. Some Wikidata links carry no reference (8 of ${s.wd} do).</p>`,
    foot: (d) => `Sources: Wikidata (CC0) and az/ru/en Wikipedia (CC BY-SA; the sentences are short quotations), kitabxana.az, ${d}. File: <a href="data/composers.json">composers.json</a>.` },
};
const TYPES = ['opera', 'musical', 'ballet', 'orchestral'], TK = { opera: 'tOpera', musical: 'tMusical', ballet: 'tBallet', orchestral: 'tOrchestral' };
const COHORT = (p) => (p.born ?? 9999) < 1900 ? 'var(--accent)' : p.born <= 1925 ? 'var(--second)' : p.born <= 1945 ? 'var(--third)' : p.born < 9999 ? 'var(--fourth)' : 'var(--muted)';
const COH = [['c1', 'var(--accent)'], ['c2', 'var(--second)'], ['c3', 'var(--third)'], ['c4', 'var(--fourth)']];
let REC = [], D = null, byQ, byW, show = { wikidata: true, text: true }, off = new Set(), selW = null, net = null, selP = null;
const t = (k, ...a) => MQ.t(k, ...a);
const wtitle = (w) => w[MQ.lang] || w.az || w.en || w.ru;
const cname = (q) => nm(byQ.get(q));
const kxHref = (k) => `${MQ.kxBase()}/${k.path}`;
const LK = { libretto: 'lLibretto', source: 'lSource', essay: 'lEssay' };
const kxLinks = (w) => (w.kx ?? []).map((k) => `<a href="${kxHref(k)}">${esc(t(LK[k.kind]))}</a>`).join(' · ');

function timeline() {
  const items = D.works.filter((w) => !off.has(w.type)).map((w) => ({ id: w.qid, lane: w.type, x0: w.year + (w.date ? (Number(w.date.slice(5, 7)) - 1) / 12 : 0), label: wtitle(w), sub: nm(byQ.get(w.composers[0])).split(' ').pop(), color: COHORT(byQ.get(w.composers[0])) }));
  MQ.timeline(document.getElementById('tl'), { items, lanes: TYPES.filter((x) => !off.has(x)).map((x) => ({ id: x, label: t(TK[x]) })), from: 1905, to: 2025, px: 14, selected: selW, onPick: (id) => { selW = selW === id ? null : id; timeline(); describeW(); } });
}
function describeW() {
  const w = byW.get(selW), el = document.getElementById('winfo');
  if (!w) { el.innerHTML = `<p class="empty">${esc(t('pickW'))}</p>`; return; }
  const row = (k, v) => v ? `<dt>${esc(t(k))}</dt><dd>${v}</dd>` : '';
  const wk = w.wiki ? `<a href="https://en.wikipedia.org/wiki/${encodeURI(w.wiki)}">en</a>` : '';
  el.innerHTML = `<div class="k">${esc(t(TK[w.type]))}</div><h3>${esc(wtitle(w))}</h3><dl>
    ${row('composer', w.composers.map((q) => `<a href="#" data-p="${q}">${esc(cname(q))}</a>`).join(', '))}
    ${row('premiere', `${esc(w.date ?? w.year)}${w.dated === 'other' ? `<span class="tag warn">${esc(t('otherDate'))}</span>` : w.ref ? '' : `<span class="tag warn">${esc(t('noRef'))}</span>`}`)}
    ${row('basedOn', (w.base ?? []).map((b) => `${esc(b[MQ.lang] || b.az || b.en || b.ru || b.qid)}${b.author ? ` <span class="muted">(${esc(b.author)})</span>` : ''}`).join(', '))}
    ${row('libretto', (w.librettists ?? []).map((b) => esc(b[MQ.lang] || b.az || b.en || b.ru)).join(', '))}
    ${row('kx', kxLinks(w))}${row('read', wk)}${row('wd', `<a href="https://www.wikidata.org/wiki/${w.qid}">${w.qid}</a>`)}</dl>`;
  el.querySelectorAll('a[data-p]').forEach((a) => a.onclick = (e) => { e.preventDefault(); document.getElementById('h-net').scrollIntoView({ behavior: 'smooth' }); net?.select(a.dataset.p); });
}
function types() {
  document.getElementById('types').innerHTML = TYPES.map((x) => `<button type="button" data-x="${x}" aria-pressed="${!off.has(x)}">${esc(t(TK[x]))} (${D.stats.byType[x]})</button>`).join('');
  document.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => { off.has(b.dataset.x) ? off.delete(b.dataset.x) : off.add(b.dataset.x); if (off.size === TYPES.length) off.clear(); types(); timeline(); });
  document.getElementById('legend').innerHTML = COH.map(([k, c]) => `<span><i style="--c:${c}"></i>${esc(t(k))}</span>`).join('');
}
function cards() {
  const ws = D.works.filter((w) => w.kx);
  document.getElementById('kxNote').textContent = t('kxNote', ws.length);
  document.getElementById('kx').innerHTML = ws.map((w) => `<div class="card"><div class="row"><h3>${esc(wtitle(w))}</h3><span class="yr">${w.year}</span></div><div class="muted">${esc(t(TK[w.type]))} · ${w.composers.map((q) => esc(cname(q))).join(', ')}</div>${(w.base ?? []).length ? `<div class="muted">${esc(t('basedOn'))}: ${(w.base).map((b) => esc(b[MQ.lang] || b.az || b.en || '')).filter(Boolean).join(', ')}</div>` : ''}<div>${kxLinks(w)}</div></div>`).join('');
}
function links() { return D.links.filter((l) => show[l.src]); }
function network() {
  const ls = links(), used = new Set(ls.flatMap((l) => [l.t, l.s]));
  net = MQ.network({ svg: '#net', scroller: '#nscroll', people: D.people, links: ls, name: nm, color: COHORT, off: (p) => !!p.offmap, onSelect: (q) => { selP = q; describeP(); } });
  document.getElementById('nlegend').innerHTML = COH.map(([k, c]) => `<span><i style="--c:${c}"></i>${esc(t(k))}</span>`).join('') + `<span><i class="off"></i>${esc(t('offLegend'))}</span>`;
  document.getElementById('lin').innerHTML = MQ.treeList(D.people, ls, { name: nm, color: COHORT });
  const jump = [['Q317397', 'jHac'], ['Q580027', 'jQar']].filter(([q]) => used.has(q));
  document.getElementById('jump').innerHTML = jump.map(([q, k]) => `<button type="button" data-j="${q}" style="border:1px solid var(--rule);border-radius:999px;padding:.25rem .6rem;font-size:.75rem">${esc(t(k))}</button>`).join('');
  document.querySelectorAll('[data-j]').forEach((b) => b.onclick = () => net.select(b.dataset.j));
  describeP();
}
function describeP() {
  const p = byQ.get(selP), el = document.getElementById('pinfo');
  if (!p) { el.innerHTML = `<p class="empty">${esc(t('pick'))}</p>`; return; }
  const ls = links(), ts = ls.filter((l) => l.s === p.qid), ss = ls.filter((l) => l.t === p.qid);
  const row = (k, v) => v ? `<dt>${esc(t(k))}</dt><dd>${v}</dd>` : '';
  const line = (l, o) => `<li><a href="#" data-q="${o}">${esc(cname(o))}</a> <span class="muted">${yrs(byQ.get(o))}</span><span class="tag">${esc(t(l.src === 'text' ? 'viaTx' : 'viaWd'))}</span>${l.src === 'text' && l.sentence ? `<blockquote>${esc(l.sentence)} <a href="${esc(l.article)}">${esc(l.lang)}</a></blockquote>` : ''}</li>`;
  const works = D.works.filter((w) => w.composers.includes(p.qid));
  el.innerHTML = `<h3>${esc(nm(p))}</h3><dl>${row('born', esc(yrs(p)))}${row('place', esc(p.place ?? ''))}
    ${row('teachers', ts.length ? `<ul>${ts.map((l) => line(l, l.t)).join('')}</ul>` : '')}${row('students', ss.length ? `<ul>${ss.map((l) => line(l, l.s)).join('')}</ul>` : '')}
    ${row('premiere', works.map((w) => `${w.year} ${esc(wtitle(w))}`).join('<br>'))}
    ${row('read', MQ.wikiLinks(p.wiki))}${MQ.ytRow(p.qid)}${/^Q\d/.test(p.qid) ? row('wd', `<a href="https://www.wikidata.org/wiki/${p.qid}">${p.qid}</a>`) : ''}${p.kitabxana ? row('kx', `<a href="${MQ.kxBase()}/authors/${esc(p.kitabxana)}">${esc(nm(p))}</a>`) : ''}</dl>${MQL.block(p.qid)}`;
  el.querySelectorAll('a[data-q]').forEach((a) => a.onclick = (e) => { e.preventDefault(); net?.select(a.dataset.q); });
}
function chips() {
  const n = (s) => D.links.filter((l) => l.src === s).length;
  document.getElementById('src').innerHTML = ['wikidata', 'text'].map((s) => `<button type="button" data-s="${s}" aria-pressed="${show[s]}"><i class="${s === 'text' ? 'dash' : ''}"></i>${esc(t(s === 'text' ? 'sTx' : 'sWd'))} (${n(s)})</button>`).join('');
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { show[b.dataset.s] = !show[b.dataset.s]; if (!show.wikidata && !show.text) show[b.dataset.s] = true; selP = null; chips(); network(); });
}
function table() {
  const th = ['thYear', 'thTitle', 'thComp', 'thType', 'thLib'];
  document.getElementById('all').innerHTML = `<thead><tr>${th.map((k, i) => `<th${i === 3 ? ' class="hide-s"' : ''}>${esc(t(k))}</th>`).join('')}</tr></thead><tbody>${D.works.map((w) => `<tr><td class="n">${w.date ?? w.year}</td><td>${esc(wtitle(w))}${w.dated === 'other' ? `<span class="tag warn">${esc(t('otherDate'))}</span>` : ''}</td><td>${w.composers.map((q) => esc(cname(q))).join(', ')}</td><td class="hide-s">${esc(t(TK[w.type]))}</td><td>${kxLinks(w)}</td></tr>`).join('')}</tbody>`;
}
function render() {
  if (!D) return;
  byQ = new Map(D.people.map((p) => [p.qid, p])); byW = new Map(D.works.map((w) => [w.qid, w]));
  document.getElementById('lede').innerHTML = t('lede', D.stats);
  document.getElementById('method').innerHTML = t('method', D.stats);
  document.getElementById('foot').innerHTML = t('foot', D.built);
  document.querySelectorAll('[data-i18n-label]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.i18nLabel)));
  types(); timeline(); describeW(); cards(); chips(); network(); table(); document.getElementById('listen').innerHTML = MQ.audio(REC);
}
const apply = MQ.boot(T, render);
Promise.all([fetch('data/composers.json').then((r) => r.json()), fetch('data/recordings.json').then((r) => r.json()), MQ.loadYT(), MQL.load()]).then(([d, r]) => { D = d; REC = r; apply(); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (D) { timeline(); network(); } }, 150); });
})();
</script>
</body>
</html>
