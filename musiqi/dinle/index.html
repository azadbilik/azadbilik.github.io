<style>

.tr:hover, .tr:focus-visible { background: var(--surface-2); outline: none; }

.tr .du { color: var(--muted); font-size: .8125rem; text-align: right; font-variant-numeric: tabular-nums; }
.free { display: inline-block; font-size: .6875rem; font-weight: 700; padding: 0 .4rem; border-radius: 3px; background: color-mix(in oklab, var(--ok, #2a7) 22%, transparent); color: var(--ink); margin-right: .35rem; vertical-align: 1px; }
.tl-head { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--rule); min-height: 2rem; cursor: default; }
.tl-head:hover { background: none; }
@media (max-width: 760px) { .tr { grid-template-columns: 1.5rem minmax(0, 1fr) 2.8rem; gap: .6rem; padding: .3rem .25rem; } .tr .al { display: none; } }
.note { color: var(--muted); font-size: .8125rem; max-width: 46rem; line-height: 1.5; }
.note a { color: inherit; }
.about { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.about h2 { font-size: 1rem; margin: 0 0 .4rem; }
/* albums */
.alb .im { box-shadow: 0 4px 14px #0002; }
/* search */
.sbox { position: sticky; top: 0; z-index: 2; padding: 1rem clamp(1rem, 2.5vw, 1.75rem) .5rem; background: var(--surface); }
.sbox label { display: flex; align-items: center; gap: .6rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 0 1rem; min-height: 3rem; max-width: 30rem; }
.sbox label:focus-within { border-color: var(--ink); }
.sbox input { border: 0; background: none; color: var(--ink); font: inherit; font-size: 1rem; flex: 1; min-width: 0; outline: none; }
.sbox svg { width: 1.2rem; height: 1.2rem; color: var(--muted); flex: none; }
.empty { color: var(--muted); padding: 2rem 0; }
/* player bar */
.player { position: fixed; left: 0; right: 0; bottom: var(--tabs); height: var(--bar); z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: 1rem; padding: 0 1rem; background: var(--paper); border-top: 1px solid var(--rule); }
.np { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.np img, .np .ph { width: 3.5rem; height: 3.5rem; border-radius: 4px; object-fit: cover; flex: none; background: var(--surface-2); }

.prog span:last-child { text-align: left; } .prog span:first-child { text-align: right; }

.right { display: flex; justify-content: flex-end; align-items: center; gap: .6rem; min-width: 0; }

    const albumName = x[2] >= 0 ? D.albums[x[2]][0] : (x[7] ?? '');
    const third = ctx.third === 'artist' && it.a ? `<a href="#/a/${it.a.q}">${esc(nm(it.a))}</a>` : (x[2] >= 0 && D.albums[x[2]][2] ? `<a href="${esc(X(D.albums[x[2]][2]))}" rel="noopener">${esc(albumName)}</a>` : esc(albumName));
    return `<li class="tr" tabindex="0" role="button" data-i="${i}" data-n="${i + 1}" data-src="${esc(x[3])}" aria-label="${esc(t('play'))}: ${esc(trTitle(x))}"><div class="n"><span>${i + 1}</span>${I.play}</div><div class="ti">${im ? `<img src="${esc(im)}" alt="" loading="lazy">` : ph(trTitle(x), hueOf(owner(it)?.q ?? 'x'))}<div><b>${x[6] === 1 ? `<span class="free">${esc(t('freeMark'))}</span>` : ''}${esc(trTitle(x))}</b><span>${sub}</span></div></div><div class="al">${third}</div><div class="du">${x[5] ? fmt(x[5]) : ''}</div></li>`;
  }).join('');
  return `<ol class="tl" data-tl>${rows}</ol>`;
};
let LISTS = []; // the current view's track lists, so a click can play from row i onward
const tl = (items, ctx) => { LISTS.push(items); return tracklist(items, ctx).replace('data-tl', `data-tl="${LISTS.length - 1}"`); };

// ---- views
const V = document.getElementById('view');
const views = {
  home() {
    const quick = [['period', 'soviet'], ['genre', 'classic'], ['genre', 'mugham'], ['genre', 'estrada'], ['genre', 'jazz'], ['period', 'early']];
    const q = quick.map(([kind, k]) => { const c = COLL[kind](k); return `<a class="qt" href="#/c/${kind}/${k}" style="--h:${c.h}"><i>${esc(initials(c.title))}</i><span>${esc(c.title)}<small>${esc(c.sub)}</small></span></a>`; });
    q.push(`<a class="qt" href="#/works" style="--h:${hueOf('works')}"><i>♫</i><span>${esc(t('works'))}<small>${esc(t('tracks', D.works.reduce((s, w) => s + w.t.length, 0)))}</small></span></a>`);
    if (D.artists.some((a) => a.t.some((x) => x[6] === 1))) q.push(`<a class="qt" href="#/c/free/all" style="--h:${hueOf('free')}"><i>✦</i><span>${esc(t('free'))}<small>Commons</small></span></a>`);
    const by = (k, f) => D.artists.filter(f).map(aCard);
    return `<div class="hero" style="--h:${hueOf('soviet')}"><div><div class="kind">${esc(t('popular'))}</div><h1>${esc(t('hello'))}</h1><div class="meta">${esc(t('helloSub'))}</div></div></div>
      <div class="pad"><div class="quick">${q.join('')}</div>
      ${shelf(t('p_soviet'), '#/c/period/soviet', COLL.period('soviet').artists.slice(0, 24).map(aCard))}
      ${shelf(t('works'), '#/works', D.works.slice(0, 20).map(wCard))}
      ${shelf(t('g_mugham'), '#/c/genre/mugham', COLL.genre('mugham').artists.slice(0, 20).map(aCard))}
      ${shelf(t('g_estrada'), '#/c/genre/estrada', COLL.genre('estrada').artists.map(aCard))}
      ${shelf(t('schools'), '#/browse', D.schools.map(sCard))}
      ${shelf(t('g_jazz'), '#/c/genre/jazz', COLL.genre('jazz').artists.slice(0, 20).map(aCard))}
      ${shelf(t('g_classic'), '#/c/genre/classic', COLL.genre('classic').artists.map(aCard))}
      ${shelf(t('free'), '#/c/free/all', COLL.free().artists.map(aCard))}
      ${shelf(t('p_indep'), '#/c/period/indep', COLL.period('indep').artists.slice().reverse().slice(0, 20).map(aCard))}
      <div class="about"><h2>${esc(t('aboutH'))}</h2><p class="note">${t('about')}</p><p class="note">${esc(t('gaps'))}</p></div></div>`;
  },
  browse() {
    const tile = (href, title, sub, h) => `<a class="tile" href="${href}" style="--h:${h}">${esc(title)}<small>${esc(sub)}</small></a>`;
    const P3 = ['early', 'soviet', 'indep'].map((k) => { const c = COLL.period(k); return tile(`#/c/period/${k}`, c.title, `${c.sub} · ${t('people', c.artists.length)}`, c.h); });
    const G = ['mugham', 'instr', 'ashiq', 'classic', 'estrada', 'pop', 'jazz'].map((k) => { const c = COLL.genre(k); return c.artists.length ? tile(`#/c/genre/${k}`, c.title, `${c.sub} · ${t('people', c.artists.length)}`, c.h) : ''; });
    const S = D.schools.map((s) => tile(`#/c/school/${s.k}`, t('schoolOf', nm(s.n)), t('people', s.m.length), hueOf(s.k)));
    return `<div class="pad"><h2 class="sh">${esc(t('periods'))}</h2><div class="tiles">${P3.join('')}</div>
      <h2 class="sh">${esc(t('genres'))}</h2><div class="tiles">${G.join('')}${tile('#/works', t('works'), t('tracks', D.works.reduce((s, w) => s + w.t.length, 0)), hueOf('works'))}${tile('#/c/free/all', t('free'), 'Commons', hueOf('free'))}</div>
      <h2 class="sh">${esc(t('schools'))}</h2><div class="tiles">${S.join('')}</div></div>`;
  },
  works() {
    const items = D.works.map((w) => ({ x: w.t[0], w }));
    return `<div class="hero" style="--h:${hueOf('works')}"><div><div class="kind">${esc(t('collection'))}</div><h1>${esc(t('works'))}</h1><div class="meta">${esc(t('tracks', D.works.reduce((s, w) => s + w.t.length, 0)))} · 1908–2022</div></div></div>
      <div class="actions"><button class="bigplay" type="button" data-play="works" aria-label="${esc(t('play'))}">${I.play}</button></div>
      <div class="pad"><div class="grid">${D.works.map(wCard).join('')}</div></div>`;
  },
  c(kind, k) {
    const c = COLL[kind]?.(k); if (!c) return views.home();
    const items = collTracks(c);
    return `<div class="hero" style="--h:${c.h}"><div><div class="kind">${esc(c.kind)}</div><h1>${esc(c.title)}</h1><div class="meta">${esc(c.sub)} · ${esc(t('people', c.artists.length))} · ${esc(t('tracks', items.length))}</div></div></div>
      <div class="actions"><button class="bigplay" type="button" data-play="c:${kind}/${k}" aria-label="${esc(t('play'))}">${I.play}</button></div>
      <div class="pad">${tl(items, { third: 'artist', showBy: false })}
      <h2 class="sh">${esc(t('artists'))}</h2><div class="grid">${c.artists.map(aCard).join('')}</div></div>`;
  },
  a(q) {
    const a = byQ.get(q); if (!a) return views.home();
    const im = aImg(a, 500), items = a.t.map((x) => ({ x, a }));
    const outs = [a.am ? `<a class="out" href="${esc(X(a.am))}" rel="noopener">Apple Music ↗</a>` : '', a.sp ? `<a class="out" href="https://open.spotify.com/artist/${esc(a.sp)}" rel="noopener">Spotify ↗</a>` : '', a.yt ? `<a class="out" href="${esc(a.yt)}" rel="noopener">YouTube ↗</a>` : ''].join('');
    const chips = [...a.p.map((k) => `<a class="chip" href="#/c/period/${k}">${esc(t('p_' + k))}</a>`), ...a.g.map((k) => `<a class="chip" href="#/c/genre/${k}">${esc(t('g_' + k))}</a>`), ...a.s.map((k) => `<a class="chip" href="#/c/school/${k}">${esc(t('schoolOf', nm(sByK.get(k).n)))}</a>`)].join('');
    const wk = D.works.filter((w) => w.c.includes(q));
    const al = a.al.map((i) => D.albums[i]).filter(Boolean).reverse();
    return `<div class="hero" style="--h:${hueOf(q)}">${im ? `<img class="cover round" src="${esc(im)}" alt="">` : `<div class="cover round">${ph(nm(a), hueOf(q))}</div>`}<div><div class="kind">${esc(t('artist'))}</div><h1>${esc(nm(a))}</h1><div class="meta">${esc([t('yrs', a.b, a.d), ...a.g.map((k) => t('g_' + k))].filter(Boolean).join(' · '))}</div></div></div>
      <div class="actions">${items.length ? `<button class="bigplay" type="button" data-play="a:${q}" aria-label="${esc(t('play'))}">${I.play}</button>` : ''}${outs}</div>
      <div class="pad"><div class="chips">${chips}</div>
      ${items.length ? `<h2 class="sh">${esc(t('popular'))}</h2>${tl(items, { showBy: true })}${a.note ? `<p class="note"><b>${esc(nm(a.note))}</b></p>` : ''}` : ''}
      ${wk.length ? `<h2 class="sh">${esc(t('worksShort'))}</h2><div class="shelf">${wk.map(wCard).join('')}</div>` : ''}
      ${al.length ? `<h2 class="sh">${esc(t('albums'))}</h2><div class="grid">${al.map((x) => `<div class="card alb"><a href="${esc(X(x[2]))}" rel="noopener" style="position:absolute;inset:0" aria-label="${esc(x[0])} · Apple Music"></a><div class="im">${x[3] ? `<img src="${esc(X(x[3]).replace(/\{s\}/g, 300))}" alt="" loading="lazy">` : ph(x[0], hueOf(x[0]))}</div><b>${esc(x[0])}</b><span>${esc(x[1])} · Apple Music ↗</span></div>`).join('')}</div><p class="note">${esc(t('albumsNote'))}</p>` : ''}
      ${a.s.map((k) => { const s = sByK.get(k); return `<h2 class="sh"><span>${esc(t('schoolOf', nm(s.n)))}</span><a href="#/c/school/${k}">${esc(t('showAll'))}</a></h2><div class="shelf">${s.m.filter((x) => x !== q).map((x) => byQ.get(x)).filter(Boolean).map(aCard).join('')}</div>`; }).join('')}
      <p class="note" style="margin-top:2rem">${esc(t('pvLong'))}.</p></div>`;
  },
  w(q) {
    const w = wByQ.get(q); if (!w) return views.works();
    const items = w.t.map((x) => ({ x, w })), cs = w.c.map((c) => byQ.get(c)).filter(Boolean);
    const im = art(w.t[0][2], 500);
    return `<div class="hero" style="--h:${hueOf(q)}">${im ? `<img class="cover" src="${esc(im)}" alt="">` : ''}<div><div class="kind">${esc(t('work', w.ty))} · ${w.y}</div><h1>${esc(nm(w))}</h1><div class="meta">${cs.map((c) => `<a class="chip" href="#/a/${c.q}">${esc(nm(c))}</a>`).join(' ')} ${esc(t('tracks', items.length))}</div></div></div>
      <div class="actions"><button class="bigplay" type="button" data-play="w:${q}" aria-label="${esc(t('play'))}">${I.play}</button></div>
      <div class="pad">${tl(items, { showBy: true })}<p class="note">${esc(t('pvLong'))}. ${esc(t('albumsNote'))}</p>
      ${cs.length ? `<h2 class="sh">${esc(t('composer'))}</h2><div class="shelf">${cs.map(aCard).join('')}</div>` : ''}</div>`;
  },
  search(q0 = '') {
    return `<div class="sbox"><label>${I.search}<span class="sr">${esc(t('search'))}</span><input id="sq" type="search" autocomplete="off" placeholder="${esc(t('searchPh'))}" value="${esc(q0)}"></label></div><div class="pad" id="hits">${hits(q0)}</div>`;
  },
};
const hits = (q) => {
  const f = fold(q).trim();
  if (!f) return views.browse().replace(/^<div class="pad">/, '<div>');
  const m = (s) => fold(s).includes(f);
  const A = D.artists.filter((a) => [a.az, a.ru, a.en].some(m));
  const W = D.works.filter((w) => [w.az, w.ru, w.en].some(m));
  const TR = []; for (const a of D.artists) for (const x of a.t) if (m(trTitle(x)) && TR.length < 30) TR.push({ x, a });
  for (const w of D.works) for (const x of w.t) if (m(x[0]) && TR.length < 40) TR.push({ x, w });
  LISTS = [];
  if (!A.length && !W.length && !TR.length) return `<p class="empty">${esc(t('noHits'))}</p>`;
  return `${A.length ? `<h2 class="sh">${esc(t('hitsA'))}</h2><div class="grid">${A.map(aCard).join('')}</div>` : ''}${W.length ? `<h2 class="sh">${esc(t('hitsW'))}</h2><div class="grid">${W.map(wCard).join('')}</div>` : ''}${TR.length ? `<h2 class="sh">${esc(t('hitsT'))}</h2>${tl(TR, { showArtist: true, third: 'artist' })}` : ''}`;
};

// ---- what a play button plays
const queueOf = (key) => {
  if (key === 'works') return D.works.map((w) => ({ x: w.t[0], w }));
  const [k, v] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
  if (k === 'a') { const a = byQ.get(v); return a ? a.t.map((x) => ({ x, a })) : []; }
  if (k === 'w') { const w = wByQ.get(v); return w ? w.t.map((x) => ({ x, w })) : []; }
  if (k === 'c') { const [kind, kk] = v.split('/'); const c = COLL[kind]?.(kk); return c ? collTracks(c) : []; }
  return [];
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-play]');
  if (b) { e.preventDefault(); const q = queueOf(b.dataset.play); const same = P.q.length && P.q[0] && q[0] && P.q[0].x[3] === q[0].x[3] && P.q.length === q.length; if (same) toggle(); else playQueue(q, 0); return; }
  const r = e.target.closest('.tr[data-i]');
  if (r && !e.target.closest('a')) { const list = LISTS[+r.closest('[data-tl]').dataset.tl]; const i = +r.dataset.i; if (P.q === list && P.i === i) toggle(); else playQueue(list, i); }
});
document.addEventListener('keydown', (e) => { const r = e.target.closest?.('.tr[data-i]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); } });

// ---- navigation
const side = () => {
  const here = location.hash || '#/';
  const a = (href, label, icon) => `<a href="${href}"${here === href ? ' aria-current="page"' : ''}>${icon}${esc(label)}</a>`;
  const sw = (href, label, h, sub) => `<a href="${href}"${here === href ? ' aria-current="page"' : ''}><span class="sw" style="background:linear-gradient(135deg,oklch(58% .14 ${h}),oklch(40% .1 ${h + 40}))">${esc(initials(label))}</span><span class="sub">${esc(label)}</span></a>`;
  document.getElementById('side').innerHTML = `<div class="box">${a('#/', t('home'), I.home)}${a('#/search', t('search'), I.search)}${a('#/browse', t('browse'), I.browse)}</div>
    <div class="box"><h3>${esc(t('periods'))}</h3>${['early', 'soviet', 'indep'].map((k) => sw(`#/c/period/${k}`, t('p_' + k), hueOf(k))).join('')}
    <h3>${esc(t('genres'))}</h3>${['mugham', 'instr', 'ashiq', 'classic', 'estrada', 'jazz'].map((k) => sw(`#/c/genre/${k}`, t('g_' + k), hueOf(k))).join('')}${sw('#/works', t('worksShort'), hueOf('works'))}${sw('#/c/free/all', t('free'), hueOf('free'))}
    <h3>${esc(t('schools'))}</h3>${D.schools.map((s) => sw(`#/c/school/${s.k}`, nm(s.n), hueOf(s.k))).join('')}</div>`;
  const tab = (href, label, icon, on) => `<a href="${href}"${on ? ' aria-current="page"' : ''}>${icon}${esc(label)}</a>`;
  document.getElementById('tabs').innerHTML = tab('#/', t('home'), I.home, here === '#/' || here === '#') + tab('#/search', t('search'), I.search, here.startsWith('#/search')) + tab('#/browse', t('browse'), I.browse, here.startsWith('#/browse') || here.startsWith('#/c/') || here.startsWith('#/works'));
};
let lastHash = null;
const route = (keepScroll) => {
  LISTS = [];
  const h = (location.hash || '#/').slice(2).split('?')[0], parts = h.split('/').map(decodeURIComponent);
  const sq = new URLSearchParams((location.hash.split('?')[1] ?? '')).get('q') ?? '';
  let html;
  if (parts[0] === 'a') html = views.a(parts[1]);
  else if (parts[0] === 'w') html = views.w(parts[1]);
  else if (parts[0] === 'c') html = views.c(parts[1], parts[2]);
  else if (parts[0] === 'works') html = views.works();
  else if (parts[0] === 'browse') html = views.browse();
  else if (parts[0] === 'search') html = views.search(sq);
  else html = views.home();
  V.innerHTML = html; side(); mark();
  const nmView = parts[0] === 'a' ? nm(byQ.get(parts[1])) : parts[0] === 'w' ? nm(wByQ.get(parts[1])) : '';
  document.title = nmView ? `${nmView} · ${t('doc')}` : t('doc');
  if (!keepScroll && lastHash !== location.hash) { window.scrollTo(0, 0); }
  lastHash = location.hash;
  const sqi = document.getElementById('sq');
  if (sqi) {
    if (!keepScroll) sqi.focus();
    sqi.addEventListener('input', () => { document.getElementById('hits').innerHTML = hits(sqi.value); mark(); history.replaceState(null, '', '#/search' + (sqi.value ? '?q=' + encodeURIComponent(sqi.value) : '')); lastHash = location.hash; });
  }
};
addEventListener('hashchange', () => route(false));

// ---- language: the header's buttons re-label the page in place
const applyLang = () => {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  ['prev', 'next', 'seek', 'vol'].forEach((k) => document.getElementById(k === 'seek' || k === 'vol' ? k : 'b-' + k).setAttribute('aria-label', t(k)));
  bPlay.setAttribute('aria-label', au.paused ? t('play') : t('pause'));
  if (D) { route(true); drawNow(); }
};
document.querySelectorAll('.hub-header [data-lang]').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  applyLang();
}));
bPlay.innerHTML = I.play; applyLang();

fetch('data/catalog.json').then((r) => r.json()).then((d) => {
  D = d;
  D.artists.forEach((a) => byQ.set(a.q, a)); D.works.forEach((w) => wByQ.set(w.q, w)); D.schools.forEach((s) => sByK.set(s.k, s));
  route(true);
}).catch(() => { V.innerHTML = `<p class="loading">catalog.json?</p>`; });
})();
</script>
</body>
</html>
