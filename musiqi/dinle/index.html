  w(q) {
    const w = wByQ.get(q); if (!w) return views.works();
    const items = w.t.map((x) => ({ x, w })), cs = w.c.map((c) => byQ.get(c)).filter(Boolean);
    const im = w.t.length ? art(w.t[0][2], 500) : '';
    return `<div class="hero" style="--h:${hueOf(q)}">${im ? `<img class="cover" src="${esc(im)}" alt="">` : ''}<div><div class="kind">${esc(t('work', w.ty))} · ${w.y}</div><h1>${esc(nm(w))}</h1><div class="meta">${cs.map((c) => `<a class="chip" href="#/a/${c.q}">${esc(nm(c))}</a>`).join(' ')} ${items.length ? esc(t('tracks', items.length)) : ''}</div></div></div>
      ${items.length || w.v?.length ? `<div class="actions"><button class="bigplay" type="button" data-play="w:${q}" aria-label="${esc(t('play'))}">${I.play}</button></div>` : ''}
      <div class="pad">${items.length ? `${tl(items, { showBy: true })}<p class="note">${esc(t('pvLong'))}. ${esc(t('albumsNote'))}</p>` : ''}
      ${vids(w.v, w)}
      ${cs.length ? `<h2 class="sh">${esc(t('composer'))}</h2><div class="shelf">${cs.map(aCard).join('')}</div>` : ''}</div>`;
  },
  search(q0 = '') {
    return `<div class="sbox"><label>${I.search}<span class="sr">${esc(t('search'))}</span><input id="sq" type="search" autocomplete="off" placeholder="${esc(t('searchPh'))}" value="${esc(q0)}"></label></div><div class="pad" id="hits">${hits(q0)}</div>`;
  },
};
const hits = (q) => {
  const f = fold(q).trim();
  if (!f) return views.browse().replace(/^<div class="pad">/, '<div>');
  const m = (s) => fold(s).includes(f);
  const A = D.artists.filter((a) => [a.az, a.ru, a.en].some(m));
  const W = D.works.filter((w) => [w.az, w.ru, w.en].some(m));
  const TR = []; for (const a of D.artists) for (const x of a.t) if (m(trTitle(x)) && TR.length < 30) TR.push({ x, a });
  for (const w of D.works) for (const x of w.t) if (m(x[0]) && TR.length < 40) TR.push({ x, w });
  LISTS = [];
  if (!A.length && !W.length && !TR.length) return `<p class="empty">${esc(t('noHits'))}</p>`;
  return `${A.length ? `<h2 class="sh">${esc(t('hitsA'))}</h2><div class="grid">${A.map(aCard).join('')}</div>` : ''}${W.length ? `<h2 class="sh">${esc(t('hitsW'))}</h2><div class="grid">${W.map(wCard).join('')}</div>` : ''}${TR.length ? `<h2 class="sh">${esc(t('hitsT'))}</h2>${tl(TR, { showArtist: true, third: 'artist' })}` : ''}`;
};

// ---- what a play button plays
const queueOf = (key) => {
  if (key === 'works') return D.works.filter((w) => w.t.length).map((w) => ({ x: w.t[0], w }));
  const [k, v] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
  if (k === 'a') { const a = byQ.get(v); return !a ? [] : a.t.length ? a.t.map((x) => ({ x, a })) : (a.v ?? []).map((vid) => ({ vid, a })); }
  if (k === 'w') { const w = wByQ.get(v); return !w ? [] : w.t.length ? w.t.map((x) => ({ x, w })) : (w.v ?? []).map((vid) => ({ vid, w })); }
  if (k === 'c') { const [kind, kk] = v.split('/'); const c = COLL[kind]?.(kk); return c ? collTracks(c) : []; }
  return [];
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-play]');
  if (b) { e.preventDefault(); const q = queueOf(b.dataset.play); const k0 = (it) => it ? (it.vid ? it.vid[0] : it.x[3]) : ''; const same = P.q.length && q.length && k0(P.q[0]) === k0(q[0]) && P.q.length === q.length; if (same) toggle(); else playQueue(q, 0); return; }
  const tvb = e.target.closest('[data-tv]');
  if (tvb) { e.stopPropagation(); const list = LISTS[+tvb.closest('[data-tl]').dataset.tl], it = list[+tvb.dataset.tv]; const v = vidOf(owner(it), it.x); const q = list.map((x) => x); q[+tvb.dataset.tv] = { vid: v, a: it.a, w: it.w, song: it }; playQueue(q, +tvb.dataset.tv); return; }
  const vc = e.target.closest('.vc[data-i]');
  if (vc && !e.target.closest('a')) { const list = LISTS[+vc.closest('[data-tl]').dataset.tl], i = +vc.dataset.i; if (P.q === list && P.i === i) toggle(); else playQueue(list, i); return; }
  const r = e.target.closest('.tr[data-i]');
  if (r && !e.target.closest('a')) { const list = LISTS[+r.closest('[data-tl]').dataset.tl]; const i = +r.dataset.i; if (P.q === list && P.i === i) toggle(); else playQueue(list, i); }
});
document.addEventListener('keydown', (e) => { const r = e.target.closest?.('.tr[data-i], .vc[data-i]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); } });

// ---- navigation
const side = () => {
  const here = location.hash || '#/';
  const a = (href, label, icon) => `<a href="${href}"${here === href ? ' aria-current="page"' : ''}>${icon}${esc(label)}</a>`;
  const sw = (href, label, h, sub) => `<a href="${href}"${here === href ? ' aria-current="page"' : ''}><span class="sw" style="background:linear-gradient(135deg,oklch(58% .14 ${h}),oklch(40% .1 ${h + 40}))">${esc(initials(label))}</span><span class="sub">${esc(label)}</span></a>`;
  document.getElementById('side').innerHTML = `<div class="box">${a('#/', t('home'), I.home)}${a('#/search', t('search'), I.search)}${a('#/browse', t('browse'), I.browse)}</div>
    <div class="box"><h3>${esc(t('periods'))}</h3>${['early', 'soviet', 'indep'].map((k) => sw(`#/c/period/${k}`, t('p_' + k), hueOf(k))).join('')}
    <h3>${esc(t('genres'))}</h3>${['mugham', 'instr', 'ashiq', 'classic', 'estrada', 'jazz'].map((k) => sw(`#/c/genre/${k}`, t('g_' + k), hueOf(k))).join('')}${sw('#/works', t('worksShort'), hueOf('works'))}${sw('#/c/free/all', t('free'), hueOf('free'))}
    <h3>${esc(t('schools'))}</h3>${D.schools.map((s) => sw(`#/c/school/${s.k}`, nm(s.n), hueOf(s.k))).join('')}</div>`;
  const tab = (href, label, icon, on) => `<a href="${href}"${on ? ' aria-current="page"' : ''}>${icon}${esc(label)}</a>`;
  document.getElementById('tabs').innerHTML = tab('#/', t('home'), I.home, here === '#/' || here === '#') + tab('#/search', t('search'), I.search, here.startsWith('#/search')) + tab('#/browse', t('browse'), I.browse, here.startsWith('#/browse') || here.startsWith('#/c/') || here.startsWith('#/works'));
};
let lastHash = null;
const route = (keepScroll) => {
  LISTS = [];
  const h = (location.hash || '#/').slice(2).split('?')[0], parts = h.split('/').map(decodeURIComponent);
  const sq = new URLSearchParams((location.hash.split('?')[1] ?? '')).get('q') ?? '';
  let html;
  if (parts[0] === 'a') html = views.a(parts[1]);
  else if (parts[0] === 'w') html = views.w(parts[1]);
  else if (parts[0] === 'c') html = views.c(parts[1], parts[2]);
  else if (parts[0] === 'works') html = views.works();
  else if (parts[0] === 'browse') html = views.browse();
  else if (parts[0] === 'search') html = views.search(sq);
  else html = views.home();
  V.innerHTML = html; side(); mark();
  const nmView = parts[0] === 'a' ? nm(byQ.get(parts[1])) : parts[0] === 'w' ? nm(wByQ.get(parts[1])) : '';
  document.title = nmView ? `${nmView} · ${t('doc')}` : t('doc');
  if (!keepScroll && lastHash !== location.hash) { window.scrollTo(0, 0); }
  lastHash = location.hash;
  const sqi = document.getElementById('sq');
  if (sqi) {
    if (!keepScroll) sqi.focus();
    sqi.addEventListener('input', () => { document.getElementById('hits').innerHTML = hits(sqi.value); mark(); history.replaceState(null, '', '#/search' + (sqi.value ? '?q=' + encodeURIComponent(sqi.value) : '')); lastHash = location.hash; });
  }
};
addEventListener('hashchange', () => route(false));

// ---- language: the header's buttons re-label the page in place
const applyLang = () => {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  ['prev', 'next', 'seek', 'vol'].forEach((k) => document.getElementById(k === 'seek' || k === 'vol' ? k : 'b-' + k).setAttribute('aria-label', t(k)));
  bPlay.setAttribute('aria-label', au.paused ? t('play') : t('pause')); document.getElementById('v-size').setAttribute('aria-label', t('bigger')); document.getElementById('v-close').setAttribute('aria-label', t('closeV'));
  if (D) { route(true); drawNow(); }
};
document.querySelectorAll('.hub-header [data-lang]').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  applyLang();
}));
bPlay.innerHTML = I.play; applyLang();

fetch('data/catalog.json').then((r) => r.json()).then((d) => {
  D = d;
  D.artists.forEach((a) => byQ.set(a.q, a)); D.works.forEach((w) => wByQ.set(w.q, w)); D.schools.forEach((s) => sByK.set(s.k, s));
  route(true);
}).catch(() => { V.innerHTML = `<p class="loading">catalog.json?</p>`; });
})();
</script>
</body>
</html>
