<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Musiqi · Azad Bilik</title>
<meta name="description" content="Azərbaycan musiqisinin ilk səs yazıları (1902–1963), sərbəst istifadədə, və xanəndələrin, tarzənlərin, aşıqların doğulduğu yerlər. The first recordings of Azerbaijani music and where its singers and players were born.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://azadbilik.org/musiqi/">
<meta property="og:title" content="Musiqi · Azerbaijani music">
<meta property="og:description" content="İlk səs yazıları və musiqiçilərin xəritəsi: Qaryağdıoğlu, Keçəçioğlu, Qədirbala, Bülbül, Şuşa, Göyçə, Borçalı.">
<meta property="og:image" content="https://azadbilik.org/musiqi/og.png">

<script>
  (() => { const L = ['az', 'ru', 'en']; let l = new URLSearchParams(location.search).get('lang'); if (!L.includes(l)) { try { l = localStorage.getItem('lang'); } catch {} } if (L.includes(l)) document.documentElement.lang = l; })();
</script>
<style>
  :root {
    --paper: #F4EFE6; --ink: #1A1410; --muted: #675E55; --rule: rgb(26 20 16 / .14); --frame: #E9E2D6;
    --accent: #A81E28; --second: #1F5C73; --third: #5B6B2E; --fourth: #8A6A3B; --water: #E4DCCF; --land: #F4EFE6;
    --vinyl: #171310; --groove: rgb(255 255 255 / .07);
    --serif: 'Literata', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    --gutter: clamp(1rem, 4vw, 3rem);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #14100D; --ink: #F1EBE1; --muted: #A0968B; --rule: rgb(241 235 225 / .14); --frame: #1F1914;
      --accent: #DA5A61; --second: #6FB3CC; --third: #A9BC6A; --fourth: #CDA56A; --water: #0C0A08; --land: #1C1713; --vinyl: #050403; --groove: rgb(255 255 255 / .06); }
  }
  :root[data-theme="dark"] { --paper: #14100D; --ink: #F1EBE1; --muted: #A0968B; --rule: rgb(241 235 225 / .14); --frame: #1F1914;
      --accent: #DA5A61; --second: #6FB3CC; --third: #A9BC6A; --fourth: #CDA56A; --water: #0C0A08; --land: #1C1713; --vinyl: #050403; --groove: rgb(255 255 255 / .06); }

  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .22em; text-decoration-color: var(--rule); }
  a:hover { text-decoration-color: currentColor; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  [hidden] { display: none !important; }
  .wrap { max-width: 80rem; margin: 0 auto; padding: 0 var(--gutter); }

  /* The hub's header */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; padding-block: 1.75rem; }
  .brand { display: inline-flex; align-items: center; gap: .6rem; font-weight: 600; font-size: .9375rem; text-decoration: none; white-space: nowrap; }
  .brand svg { width: 1.375rem; height: 1.375rem; }
  .star { fill: currentColor; } .gem { fill: var(--accent); }
  header nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .25rem 1.25rem; }
  header nav a { font-size: .875rem; color: var(--muted); text-decoration: none; }
  header nav a:hover, header nav a[aria-current] { color: var(--ink); }
  header nav a[aria-current] { box-shadow: inset 0 -1px currentColor; }
  .langs { display: inline-flex; gap: .15rem; margin-left: .25rem; }
  .langs button { font-size: .75rem; letter-spacing: .04em; padding: .1rem .3rem; min-height: 1.75rem; min-width: 1.75rem; border-radius: 2px; color: var(--muted); }
  .langs button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -1px currentColor; }

  /* The stage: the record playing, and where its singer was born */
  .stage { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 2rem 4rem; align-items: center; min-height: calc(100svh - 6rem); padding-block: 1rem 3rem; }
  h1 { font: 300 clamp(2.5rem, 1.6rem + 3vw, 4.5rem)/1 var(--serif); letter-spacing: -.03em; }
  h1 + .sub { margin-top: .75rem; font: italic 300 clamp(1.0625rem, 1rem + .4vw, 1.3125rem)/1.4 var(--serif); color: var(--muted); }
  .deck { margin-top: 2.5rem; display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; }
  .deck .disc { width: clamp(9rem, 16vw, 14rem); }
  .now-title { font: 400 clamp(1.75rem, 1.3rem + 1.6vw, 2.75rem)/1.1 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
  .now-who { margin-top: .5rem; font-size: 1.0625rem; }
  .now-who button { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: .22em; text-decoration-thickness: 1px; }
  .now-who button:hover { text-decoration-color: currentColor; }
  .now-meta { margin-top: .35rem; font-size: .875rem; color: var(--muted); }
  .now-meta a { color: inherit; }
  .controls { margin-top: 2rem; display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: .75rem 1rem; max-width: 36rem; }
  .controls .big { width: 3.5rem; height: 3.5rem; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; transition: transform .15s; }
  .controls .big:hover { transform: scale(1.05); }
  .controls .big:active { transform: scale(.97); }
  .controls .small { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .controls .small:hover { color: var(--ink); background: var(--rule); }
  .controls svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
  .controls .big svg { width: 1.25rem; height: 1.25rem; }
  .seek { display: grid; grid-template-columns: auto 1fr auto; gap: .6rem; align-items: center; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 1.5rem; background: transparent; cursor: pointer; --p: 0%; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--rule) var(--p)); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--rule) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: .85rem; height: .85rem; margin-top: -.35rem; border-radius: 50%; background: var(--ink); border: 0; }
  input[type=range]::-moz-range-thumb { width: .85rem; height: .85rem; border-radius: 50%; background: var(--ink); border: 0; }
  .inset { position: relative; margin: 0; aspect-ratio: 4 / 5; max-height: calc(100svh - 9rem); width: 100%; border-radius: 3px; overflow: hidden; background: var(--water); }
  .inset #mini { position: absolute; inset: 0; }
  .inset figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5rem 1rem .9rem; font-size: .8125rem; line-height: 1.4; color: #F1EBE1; background: linear-gradient(to top, rgb(20 16 13 / .78), rgb(20 16 13 / 0)); }
  .inset figcaption strong { font: 400 1.125rem var(--serif); display: block; }

  /* Records: a disc of shellac, its paper label coloured by what is sung */
  .disc { position: relative; aspect-ratio: 1; border-radius: 50%; display: block; }
  .disc svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 14px rgb(0 0 0 / .18)); }
  .disc .spinner { transform-origin: 50% 50%; transform-box: view-box; }
  .disc.spin .spinner { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .k-mugham { --k: var(--accent); } .k-tesnif { --k: var(--second); } .k-song { --k: var(--third); } .k-instrumental { --k: var(--fourth); }

  /* Sections below the stage */
  section.block { padding-block: 3.5rem 4rem; border-top: 1px solid var(--rule); }
  .block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem 2rem; margin-bottom: 2rem; }
  .block-head h2 { font: 300 clamp(2rem, 1.5rem + 1.8vw, 3rem)/1.05 var(--serif); letter-spacing: -.025em; }
  .block-head p { color: var(--muted); max-width: 40rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chips button { font-size: .8125rem; padding: .35rem .8rem; border-radius: 999px; color: var(--muted); display: inline-flex; align-items: center; gap: .4rem; }
  .chips button:hover { background: var(--rule); color: var(--ink); }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--k); }
  .chips small { font-variant-numeric: tabular-nums; opacity: .8; }

  /* The shelf: one row per singer, their discs side by side */
  .singer { display: grid; grid-template-columns: minmax(12rem, 16rem) 1fr; gap: 1rem 2.5rem; padding-block: 1.75rem; border-top: 1px solid var(--rule); }
  .singer:first-child { border-top: 0; padding-top: 0; }
  .singer h3 { font: 400 1.5rem/1.15 var(--serif); letter-spacing: -.015em; }
  .singer .who { margin-top: .35rem; font-size: .8125rem; color: var(--muted); }
  .singer .who button { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: .2em; }
  .singer .who button:hover { color: var(--ink); }
  .singer .face { width: 3.5rem; height: 3.5rem; border-radius: 50%; object-fit: cover; margin-bottom: .75rem; background: var(--frame); }
  .discs { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 1.5rem 1.25rem; }
  .discs button { display: block; width: 100%; text-align: center; font-size: .8125rem; line-height: 1.3; }
  .discs .disc { width: 100%; transition: transform .25s cubic-bezier(.2, .7, .2, 1); }
  .discs button:hover .disc { transform: translateY(-3px) rotate(8deg); }
  .discs .t { display: block; margin-top: .6rem; }
  .discs .m { display: block; color: var(--muted); font-size: .75rem; }
  .discs button[aria-current] .t { color: var(--accent); }

  /* The mugham system */
  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); gap: 1rem; }
  .mode { border: 1px solid var(--rule); border-radius: 3px; padding: 1.25rem 1.25rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
  .mode h3 { font: 400 1.5rem/1.1 var(--serif); }
  .mode .mood { font: italic 300 1rem/1.35 var(--serif); color: var(--muted); }
  .mode .secs { display: flex; flex-wrap: wrap; gap: .25rem; }
  .mode .secs span { font-size: .6875rem; padding: .05rem .4rem; border-radius: 3px; background: var(--rule); color: var(--muted); }
  .tracks { list-style: none; padding: 0; margin-top: .25rem; border-top: 1px solid var(--rule); }
  .tracks button { display: grid; grid-template-columns: 1.75rem 1fr; gap: 0 .6rem; align-items: center; width: 100%; text-align: left; padding: .45rem 0; border-bottom: 1px solid var(--rule); font-size: .875rem; }
  .tracks button:hover .t, .tracks button[aria-current] .t { color: var(--accent); }
  .tracks .dot { grid-row: span 2; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--vinyl); display: grid; place-items: center; }
  .tracks .dot::after { content: ''; width: .7rem; height: .7rem; border-radius: 50%; background: var(--k); }
  .tracks .m { font-size: .75rem; color: var(--muted); }
  .tracks .prob { font-size: .6875rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 .3rem; margin-left: .3rem; }
  .mode .none { font-size: .8125rem; color: var(--muted); }
  .fine { margin-top: 1.5rem; font-size: .8125rem; color: var(--muted); max-width: 46rem; }

  /* The musicians: their birthplaces on the map, the list beside it */
  .people-grid { display: grid; grid-template-columns: minmax(0, 1fr) 24rem; gap: 2rem; align-items: start; }
  .bigmap { position: sticky; top: 1rem; height: calc(100svh - 2rem); max-height: 52rem; border-radius: 3px; overflow: hidden; background: var(--water); }
  #map { position: absolute; inset: 0; }
  .legend { position: absolute; top: .75rem; right: .75rem; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1px solid var(--rule); border-radius: 3px; padding: .5rem .7rem; font-size: .75rem; display: grid; gap: .2rem; }
  .legend i { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .45rem; vertical-align: -.05rem; }
  .pcol { height: calc(100svh - 2rem); max-height: 52rem; display: flex; flex-direction: column; min-height: 0; }
  .pcol .plist { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .plist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .5rem; }
  .plist-head h3 { font: 400 1.375rem/1.2 var(--serif); }
  .plist-head button { font-size: .8125rem; color: var(--accent); }
  .plist { list-style: none; padding: 0; border-top: 1px solid var(--rule); }
  .plist li { border-bottom: 1px solid var(--rule); }
  .plist .p { display: grid; grid-template-columns: 1fr auto; gap: 0 .75rem; width: 100%; text-align: left; padding: .5rem 0; font-size: .9375rem; }
  .plist .p:hover .n { color: var(--accent); }
  .plist .r { font-size: .75rem; color: var(--muted); }
  .plist .y { grid-row: span 2; align-self: center; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .plist .more { display: flex; flex-wrap: wrap; gap: .25rem 1rem; padding: 0 0 .5rem; font-size: .75rem; }
  .plist .more a { color: var(--muted); text-decoration: none; }
  .plist .more button { color: var(--accent); }
  .plist .more a:hover { color: var(--accent); }
  .plist .on .n { color: var(--accent); }
  .pulse { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); animation: pulse 1.4s ease-out infinite; pointer-events: none; }
  @keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  .maplibregl-popup-content { background: var(--paper); color: var(--ink); font: .8125rem/1.4 var(--sans); padding: .5rem .75rem; border-radius: 3px; box-shadow: 0 2px 10px rgb(0 0 0 / .2); }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--paper) 85%, transparent) !important; color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }

  /* Once the turntable scrolls away, the record follows in a bar at the bottom */
  .dock { position: fixed; left: 50%; bottom: max(.75rem, env(safe-area-inset-bottom)); translate: -50% 0; z-index: 10; width: min(34rem, calc(100% - 1.5rem));
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .75rem; padding: .5rem .5rem .5rem .6rem; border-radius: 999px;
    background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--rule); box-shadow: 0 8px 28px rgb(0 0 0 / .18); transition: opacity .25s, translate .35s cubic-bezier(.2, .7, .2, 1); }
  .dock.off { opacity: 0; translate: -50% 150%; pointer-events: none; }
  .dock .disc { width: 2.75rem; }
  .dock .txt { min-width: 0; text-align: left; line-height: 1.25; }
  .dock .txt b { display: block; font: 400 1rem var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock .txt span { display: block; font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock .play { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
  .dock .play svg { width: 1rem; height: 1rem; fill: currentColor; }
  .dock .bar { position: absolute; left: 1.5rem; right: 1.5rem; bottom: 0; height: 2px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), transparent var(--p, 0%)); }
  footer { border-top: 1px solid var(--rule); padding-block: 1.75rem 2.5rem; font-size: .8125rem; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 2rem; }
  footer p { max-width: 46rem; }

  @media (max-width: 56rem) {
    .stage { grid-template-columns: 1fr; min-height: 0; padding-top: 0; }
    .inset { aspect-ratio: 4 / 3; max-height: none; }
    .deck { grid-template-columns: 7.5rem 1fr; gap: 1.25rem; margin-top: 1.75rem; }
    .deck .disc { width: 7.5rem; }
    .controls { grid-template-columns: auto auto auto; justify-content: start; }
    .seek { grid-column: 1 / -1; }
    .singer { grid-template-columns: 1fr; gap: .75rem; }
    .singer .face { display: none; }
    /* On a phone each singer's discs are one row to swipe through */
    .discs { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: calc(var(--gutter) * -1); padding: .25rem var(--gutter) .5rem; scroll-padding-inline: var(--gutter); }
    .discs::-webkit-scrollbar { display: none; }
    .discs li { flex: 0 0 6.25rem; scroll-snap-align: start; }
    .singer { padding-block: 1.25rem; }
    .singer h3 { font-size: 1.25rem; }
    .block-head { margin-bottom: 1.25rem; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); width: calc(100% + 2 * var(--gutter)); }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: none; }
    section.block { padding-block: 2.5rem 3rem; }
    .stage h1 { font-size: 2.5rem; }
    footer { padding-bottom: 5.5rem; }
    .people-grid { grid-template-columns: 1fr; }
    .bigmap { position: relative; top: 0; height: 60svh; }
    .pcol { height: 70svh; }
    header nav { gap: .25rem .9rem; } header nav a { font-size: .8125rem; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } .disc.spin .spinner, .pulse { animation: none; } }
  /* Phones: the language switch on the brand's line, the sections on the line below */
  @media (max-width: 40rem) { header { position: relative; } header .langs { position: absolute; top: calc(1.75rem - .19rem); right: 0; margin: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/" data-keep-lang><svg viewBox="0 0 512 512" aria-hidden="true"><g class="star"><rect x="126" y="126" width="260" height="260"/><polygon points="256,72 440,256 256,440 72,256"/></g><polygon class="gem" points="256,196 316,256 256,316 196,256"/></svg>Azad Bilik</a>
    <nav aria-label="Azad Bilik"><a href="https://kitabxana.az" id="kx" data-i18n="library">Kitabxana</a><a href="/qalereya/" data-keep-lang data-i18n="gallery">Qalereya</a><a href="/xeriteler/" data-keep-lang data-i18n="maps">Ədəbi xəritələr</a><a href="/atlas/" data-keep-lang data-i18n="atlas">Atlas</a><a href="./" aria-current="page" data-keep-lang data-i18n="title">Musiqi</a><span class="langs" role="group" aria-label="Dil · Язык · Language"><button type="button" data-lang="az">AZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></span></nav>
  </header>
</div>

<main>
  <section class="stage wrap" aria-labelledby="t-title">
    <div>
      <h1 id="t-title" data-i18n="title">Musiqi</h1>
      <p class="sub" data-i18n="sub">İlk səs yazıları, 1902-dən</p>
      <div class="deck">
        <span class="disc" id="deck-disc"></span>
        <div aria-live="polite">
          <h2 class="now-title" id="now-title"></h2>
          <p class="now-who" id="now-who"></p>
          <p class="now-meta" id="now-meta"></p>
        </div>
      </div>
      <div class="controls">
        <button type="button" class="small" id="prev" data-i18n-label="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button type="button" class="big" id="toggle"><svg viewBox="0 0 24 24" aria-hidden="true" id="toggle-icon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button type="button" class="small" id="next" data-i18n-label="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" step="1" data-i18n-label="position"><span id="dur">–:––</span></div>
      </div>
      <audio id="audio" preload="none"></audio>
    </div>
    <figure class="inset"><div id="mini" aria-hidden="true"></div><figcaption id="from"></figcaption></figure>
  </section>

  <section class="block wrap" id="shelf" aria-labelledby="h-shelf">
    <div class="block-head">

const t = (k) => T[lang][k];
const L = (o) => o?.[lang] || o?.az || o?.en || '';
const KX = () => `https://kitabxana.az${lang === 'az' ? '' : '/' + lang}`;
const short = (p) => L(p).replace(/ \(.*\)$/, '');
const when = (y) => !y ? '' : lang === 'en' ? y.replace(/^Unknown date$/i, '').replace(/^Early XX c\.$/i, 'early 20th century') : y
  .replace(/^early 20th century$/i, lang === 'ru' ? 'начало XX века' : 'XX əsrin əvvəli')
  .replace(/^first half of 20th century$/i, lang === 'ru' ? 'первая половина XX века' : 'XX əsrin birinci yarısı')
  .replace(/^Early XX c\.$/i, lang === 'ru' ? 'начало XX века' : 'XX əsrin əvvəli')
  .replace(/^(\d{4})s$/, lang === 'ru' ? '$1-е' : '$1-cı illər').replace(/^c\. (\d{4})$/, lang === 'ru' ? 'ок. $1' : 'təq. $1')
  .replace(/^Unknown date$/i, '');
const years = (p) => p.born || p.died ? `${p.born ?? '?'}–${p.died ?? ''}` : '';
const ROLE = () => ({ khanende: css('--accent'), tar: css('--second'), ashik: css('--third') });
const KINDS = ['mugham', 'tesnif', 'song', 'instrumental'];

const params = new URLSearchParams(location.search);
let recs = [], people = [], byQid = new Map(), places = new Map(), placeIds = [], mugham = { dastgahs: [], pieces: [] }, litSlug = new Map();
let kind = null, current = null, place = null, first = null;
const recsOf = (qid) => recs.filter((r) => r.performer?.qid === qid);
const keyOf = (r) => r.performer?.qid ?? r.performer?.az ?? '_';
const pieceOf = (r) => mugham.pieces.find((p) => p.name === r.title.az.replace(/ \((\d|qarmonda|sazda)\)$/, ''));
function dastgahOf(r) {
  if (r.kind === 'song' || r.kind === 'tesnif') return null;
  const p = pieceOf(r);
  const d = p?.dastgah && mugham.dastgahs.find((x) => x.id === p.dastgah);

// A 78 of shellac: grooves, a paper label in the colour of its kind, the title round the label
let uid = 0;
function disc(r, spin, id) {
  const arc = `arc${uid++}`;
  const grooves = Array.from({ length: 9 }, (_, i) => `<circle cx="50" cy="50" r="${47 - i * 2.4}" fill="none" stroke="var(--groove)" stroke-width=".6"/>`).join('');
  const title = esc(L(r.title).slice(0, 26));
  return `<span${id ? ` id="${id}"` : ''} class="disc k-${r.kind}${spin ? ' spin' : ''}"><svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="49.5" fill="var(--vinyl)"/>${grooves}
    <g class="spinner"><circle cx="50" cy="50" r="18" fill="var(--k)"/><circle cx="50" cy="50" r="16.2" fill="none" stroke="rgb(255 255 255 / .35)" stroke-width=".4"/>
    <path id="${arc}" d="M50 37 a13 13 0 1 1 -0.01 0" fill="none"/><text font-size="3.6" fill="rgb(255 255 255 / .9)" font-family="Inter, sans-serif" letter-spacing=".3"><textPath href="#${arc}">${title}</textPath></text>
    <rect x="48.6" y="40" width="2.8" height="2.8" transform="rotate(45 50 41.4)" fill="rgb(255 255 255 / .8)"/></g>
    <circle cx="50" cy="50" r="1.6" fill="var(--paper)"/>
    <path d="M14 32 A40 40 0 0 1 40 11" fill="none" stroke="rgb(255 255 255 / .12)" stroke-width="3" stroke-linecap="round"/></svg></span>`;
}

// Two maps: a small one beside the record, lighting the singer's birthplace; a large one of all 201
const STYLE = `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`;
const BOUNDS = [[43, 37.5], [50.6, 42.5]];
const labelExpr = () => ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']];
function tint(m) {
  m.on('style.load', () => {
    for (const l of m.getStyle().layers) {
      if (l.type === 'background') m.setPaintProperty(l.id, 'background-color', css('--land'));
      if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) m.setPaintProperty(l.id, 'fill-color', css('--water'));
      if (l.type === 'symbol' && l.layout?.['text-field']) m.setLayoutProperty(l.id, 'text-field', labelExpr());
    }
  });
}
const mini = new maplibregl.Map({ container: 'mini', style: STYLE, bounds: BOUNDS, interactive: false, attributionControl: false, fitBoundsOptions: { padding: 24 } });
tint(mini);
const map = new maplibregl.Map({ container: 'map', style: STYLE, bounds: BOUNDS, minZoom: 3, maxZoom: 11, cooperativeGestures: true,
  attributionControl: { compact: true, customAttribution: '<a href="https://commons.wikimedia.org">Wikimedia Commons</a> · <a href="https://www.wikidata.org">Wikidata</a>' } });
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
tint(map);
const pulseOn = () => { const el = document.createElement('div'); el.innerHTML = '<div class="pulse"></div>'; return new maplibregl.Marker({ element: el }); };
const miniPulse = pulseOn(), bigPulse = pulseOn();
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });

const ready = (m) => new Promise((ok) => m.loaded() ? ok() : m.once('load', ok));
Promise.all([...['recordings.json', 'musicians.json', 'mugham.json'].map((f) => fetch(`data/${f}`).then((r) => r.json())), ready(mini), ready(map)]).then(([r, p, m]) => {
  recs = r; people = p; mugham = m;
  byQid = new Map(people.map((x) => [x.qid, x]));
  for (const x of people) {
    if (!places.has(x.place.id)) places.set(x.place.id, { ...x.place, people: [] });
    places.get(x.place.id).people.push(x);
  }
  placeIds = [...places.keys()];
  addDots(map, true); addDots(mini, false);
  // What to put on the turntable first: a linked recording, a linked singer's first, else the oldest disc
  const who = params.get('who');
  first = recs.find((x) => x.year === '1902') ?? recs[0];
  current = recs.find((x) => x.id === params.get('r')) ?? (who && recs.find((x) => keyOf(x) === who)) ?? first;
  const person = byQid.get(params.get('person'));
  drawAll();
  load(current, false);
  if (person) showPlace(person.place.id, person.qid, true);
  else if (params.get('tab') === 'people') document.getElementById('people').scrollIntoView();
  else if (params.get('tab') === 'mugham') document.getElementById('mugham').scrollIntoView();

});

// A dot per birthplace, sized by how many were born there, coloured by the commonest role; a ring where someone is on record
function addDots(m, big) {
  const C = ROLE();
  m.addSource('places', { type: 'geojson', generateId: true, data: { type: 'FeatureCollection', features: placeIds.map((id) => {
    const pl = places.get(id);
    const roles = pl.people.flatMap((x) => x.roles);
    const top = ['khanende', 'tar', 'ashik'].sort((a, b) => roles.filter((x) => x === b).length - roles.filter((x) => x === a).length)[0];
    return { type: 'Feature', geometry: { type: 'Point', coordinates: [pl.lng, pl.lat] }, properties: { id, n: pl.people.length, color: C[top], rec: pl.people.some((x) => recsOf(x.qid).length) } };
  }) } });
  const r = big ? ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 1, 4, 3, 9, 6, 16] : ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 1, 2.5, 6, 7];
  if (big) m.addLayer({ id: 'rings', type: 'circle', source: 'places', filter: ['get', 'rec'], paint: { 'circle-radius': ['+', r, 4], 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': css('--ink'), 'circle-stroke-width': 1.25, 'circle-stroke-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], .2, .7] } });
  m.addLayer({ id: 'places', type: 'circle', source: 'places', paint: { 'circle-radius': r, 'circle-color': ['get', 'color'],
    'circle-opacity': big ? ['case', ['boolean', ['feature-state', 'dim'], false], .2, .85] : .45,
    'circle-stroke-color': css('--paper'), 'circle-stroke-width': big ? ['case', ['boolean', ['feature-state', 'sel'], false], 2.5, 1] : .5 } });
  if (!big) return;
  m.on('mousemove', 'places', (e) => {
    m.getCanvas().style.cursor = 'pointer';
    const pl = places.get(e.features[0].properties.id);
    const recd = pl.people.filter((x) => recsOf(x.qid).length);
    tip.setLngLat(e.features[0].geometry.coordinates).setHTML(`<strong>${esc(L(pl))}</strong> · ${t('here')(pl.people.length)}${recd.length ? `<br>♪ ${recd.map((x) => esc(L(x))).join(', ')}` : ''}`).addTo(m);
  });
  m.on('mouseleave', 'places', () => { m.getCanvas().style.cursor = ''; tip.remove(); });
  m.on('click', 'places', (e) => showPlace(e.features[0].properties.id));
}

// ---- The turntable
const audio = document.getElementById('audio');
const seek = document.getElementById('seek');
const PLAY = '<path d="M7 4.5v15l13-7.5z"/>', PAUSE = '<path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/>';
const fmt = (s) => !isFinite(s) ? '–:––' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let singerOrder = [];
const order = (r) => singerOrder.indexOf(keyOf(r)) * 1000 + KINDS.indexOf(r.kind) * 100 + recs.indexOf(r) / 100;
const queue = () => recs.filter((r) => !kind || r.kind === kind).sort((a, b) => order(a) - order(b));
let placed = null;
function load(r, autoplay) {
  current = r;
  if (audio.dataset.id !== r.id) {
    audio.src = r.mp3; audio.dataset.id = r.id;
    seek.value = 0; seek.style.setProperty('--p', '0%');
    document.getElementById('cur').textContent = '0:00'; document.getElementById('dur').textContent = '–:––';
  }
  drawNow();
  if (autoplay) audio.play().catch(() => {});
  drawShelfState(); drawDock();
  keepUrl();
}
function drawNow() {
  const r = current; if (!r) return;
  const p = r.performer?.qid && byQid.get(r.performer.qid);
  const dg = dastgahOf(r);
  document.getElementById('deck-disc').outerHTML = disc(r, !audio.paused, 'deck-disc');
  document.getElementById('now-title').textContent = L(r.title);
  document.getElementById('now-who').innerHTML = r.performer ? (p ? `<button type="button" id="now-singer">${esc(short(r.performer))}</button>` : esc(short(r.performer))) : t('unknown');
  document.getElementById('now-meta').innerHTML = [t('one')[r.kind], dg ? `${esc(L(dg.d.name))}${dg.sure ? '' : ` (${t('probable')})`}${dg.d.character ? ` — <i>${esc(L(dg.d.character))}</i>` : ''}` : '', esc(when(r.year)), `<a href="${esc(r.commons)}" target="_blank" rel="noopener">${t('commons')} ↗</a>`].filter(Boolean).join(' · ');
  document.getElementById('now-singer')?.addEventListener('click', () => showPlace(p.place.id, p.qid, true));
  document.getElementById('toggle').setAttribute('aria-label', `${audio.paused ? t('play') : t('pause')}: ${L(r.title)}`);
  document.getElementById('toggle-icon').innerHTML = audio.paused ? PLAY : PAUSE;
  // Where the singer was born, lit on the small map (moved only when the place changes)
  const from = document.getElementById('from');
  const at = p ? p.place.id : null;
  from.innerHTML = p ? `<strong>${esc(L(p.place))}</strong>${esc(t('bornHere')(short(r.performer)))}${years(p) ? ` · ${years(p)}` : ''}` : `<strong>${t('noPlace')}</strong>`;
  if (at === placed) return;
  placed = at;
  if (p) {
    miniPulse.setLngLat([p.place.lng, p.place.lat]).addTo(mini);
    mini.easeTo({ center: [p.place.lng, p.place.lat], zoom: 6.4, duration: still() ? 0 : 1200 });
  } else {
    miniPulse.remove();
    mini.fitBounds(BOUNDS, { padding: 24, duration: still() ? 0 : 1200 });
  }
}
// The dock: shown once something has played and the turntable is out of view
const dock = document.getElementById('dock');
let stageSeen = true, played = false;
new IntersectionObserver(([e]) => { stageSeen = e.isIntersecting; drawDock(); }, { threshold: .15 }).observe(document.querySelector('.stage'));
function drawDock() {
  const show = played && !stageSeen && current;
  dock.classList.toggle('off', !show); dock.setAttribute('aria-hidden', !show);
  dock.querySelectorAll('button').forEach((b) => b.tabIndex = show ? 0 : -1);
  if (!current) return;
  document.getElementById('dock-disc').outerHTML = disc(current, !audio.paused, 'dock-disc');
  document.getElementById('dock-title').textContent = L(current.title);
  document.getElementById('dock-who').textContent = current.performer ? short(current.performer) : t('unknown');
  document.getElementById('dock-icon').innerHTML = audio.paused ? PLAY : PAUSE;
  document.getElementById('dock-toggle').setAttribute('aria-label', `${audio.paused ? t('play') : t('pause')}: ${L(current.title)}`);
}
document.getElementById('dock-toggle').onclick = () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
document.getElementById('dock-top').onclick = document.getElementById('dock-txt').onclick = () => toTop();
function step(d) {
  const q = queue(); const i = q.indexOf(current);
  const n = q[(i + d + q.length) % q.length];
  if (n) load(n, true);
}
document.getElementById('toggle').onclick = () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
document.getElementById('prev').onclick = () => { if (audio.currentTime > 3) audio.currentTime = 0; else step(-1); };
document.getElementById('next').onclick = () => step(1);
audio.addEventListener('play', () => { played = true; drawNow(); drawShelfState(); drawDock(); });
audio.addEventListener('pause', () => { drawNow(); drawShelfState(); drawDock(); });
audio.addEventListener('ended', () => step(1));
audio.addEventListener('loadedmetadata', () => { document.getElementById('dur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  if (!seek.matches(':active')) seek.value = Math.round(p * 1000);
  seek.style.setProperty('--p', `${p * 100}%`);
  document.getElementById('dock-bar').style.setProperty('--p', `${p * 100}%`);
  document.getElementById('cur').textContent = fmt(audio.currentTime);
});
seek.oninput = () => { seek.style.setProperty('--p', `${seek.value / 10}%`); if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; };
const toTop = () => window.scrollTo({ top: 0, behavior: still() ? 'auto' : 'smooth' });
const playFrom = (id) => { const r = recs.find((x) => x.id === id); if (r === current) { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); } else load(r, true); };

// ---- The shelf
function drawKinds() {
  const n = (k) => recs.filter((r) => !k || r.kind === k).length;
  const el = document.getElementById('kinds');
  el.setAttribute('aria-label', t('recs'));
  el.innerHTML = [null, ...KINDS].filter((k) => !k || n(k)).map((k) => `<button type="button" data-kind="${k ?? ''}" aria-pressed="${(kind ?? '') === (k ?? '')}"${k ? ` class="k-${k}"` : ''}>${k ? '<i></i>' : ''}${k ? t(k) : t('all')} <small>${n(k)}</small></button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { kind = b.dataset.kind || null; drawKinds(); drawShelf(); });
}
function drawShelf() {
  const groups = new Map();
  for (const r of recs) { const k = keyOf(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  singerOrder = [...groups.keys()].sort((a, b) => (a === '_') - (b === '_') || groups.get(b).length - groups.get(a).length);
  document.getElementById('singers').innerHTML = singerOrder.map((k) => {
    const rs = groups.get(k).filter((r) => !kind || r.kind === kind).sort((a, b) => KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind));
    if (!rs.length) return '';
    const perf = rs[0].performer, p = perf?.qid && byQid.get(perf.qid);
    return `<article class="singer" data-singer="${esc(k)}"><div>${p?.image ? `<img class="face" src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
      <h3>${perf ? esc(short(perf)) : t('unknown')}</h3>
      <p class="who">${p ? `${p.roles.map((x) => t(x)).join(', ')} · <button type="button" data-place="${esc(p.place.id)}" data-q="${esc(p.qid)}">${esc(L(p.place))}</button>${years(p) ? ` · ${years(p)}` : ''} · ` : ''}${t('discs')(groups.get(k).length)}</p></div>
      <ul class="discs">${rs.map((r) => `<li><button type="button" data-play="${esc(r.id)}">${disc(r)}<span class="t">${esc(L(r.title))}</span><span class="m">${t('one')[r.kind]}${when(r.year) ? ` · ${esc(when(r.year))}` : ''}</span></button></li>`).join('')}</ul></article>`;
  }).join('');
  document.querySelectorAll('#singers [data-play]').forEach((b) => b.onclick = () => playFrom(b.dataset.play));
  document.querySelectorAll('#singers [data-place]').forEach((b) => b.onclick = () => showPlace(b.dataset.place, b.dataset.q, true));
  drawShelfState();
}
function drawShelfState() {
  document.querySelectorAll('[data-play]').forEach((b) => {
    const on = current && b.dataset.play === current.id;
    if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    b.querySelector('.disc')?.classList.toggle('spin', on && !audio.paused);
    b.setAttribute('aria-label', `${on && !audio.paused ? t('pause') : t('play')}: ${b.querySelector('.t')?.textContent ?? ''}`);
  });
}

// ---- The mugham system
function drawModes() {
  const seen = new Set();
  const row = (r, dg) => `<li><button type="button" data-play="${esc(r.id)}" class="k-${r.kind}"><span class="dot"></span><span class="t">${esc(L(r.title))}${dg && !dg.sure ? `<span class="prob">${t('probable')}</span>` : ''}</span><span class="m">${r.performer ? esc(short(r.performer)) : t('unknown')}</span></button></li>`;
  const cards = mugham.dastgahs.map((d) => {
    const rs = recs.filter((r) => dastgahOf(r)?.d.id === d.id);
    rs.forEach((r) => seen.add(r.id));
    return `<article class="mode"><h3>${esc(L(d.name))}</h3>${d.character ? `<p class="mood">${esc(L(d.character))}</p>` : ''}
      <div class="secs" aria-label="${t('sectionsL')}">${d.sections.map((x) => `<span>${esc(x[lang] ?? x.az)}</span>`).join('')}</div>
      ${rs.length ? `<ol class="tracks">${rs.map((r) => row(r, dastgahOf(r))).join('')}</ol>` : `<p class="none">${t('noRec')}</p>`}</article>`;
  }).join('');
  const rest = recs.filter((r) => !seen.has(r.id) && (r.kind === 'mugham' || r.kind === 'instrumental'));
  document.getElementById('modes').innerHTML = cards + (rest.length ? `<article class="mode"><h3>${t('others')}</h3><ol class="tracks">${rest.map((r) => row(r)).join('')}</ol></article>` : '');
  document.querySelectorAll('#modes [data-play]').forEach((b) => b.onclick = () => playFrom(b.dataset.play));
  drawShelfState();
}

// ---- The musicians
function mark() { placeIds.forEach((id, fid) => map.setFeatureState({ source: 'places', id: fid }, { dim: place != null && id !== place, sel: id === place })); }
function showPlace(id, qid, scroll) {
  place = id; mark();
  const pl = places.get(id);
  if (scroll) document.getElementById('people').scrollIntoView({ behavior: still() ? 'auto' : 'smooth' });
  map.easeTo({ center: [pl.lng, pl.lat], zoom: Math.max(map.getZoom(), 7), duration: still() ? 0 : 700 });
  drawPeople(qid);
}
function drawPeople(qid) {
  if (!people.length) return;
  const recd = people.filter((p) => recsOf(p.qid).length).length;
  document.getElementById('people-lead').textContent = t('allPeople')(people.length, recd);
  const pl = place && places.get(place);
  const list = (pl ? [...pl.people] : [...people]).sort((a, b) => recsOf(b.qid).length - recsOf(a.qid).length || (a.born ?? 9999) - (b.born ?? 9999));
  document.getElementById('plist-title').textContent = pl ? L(pl) : `${t('plistAll')} · ${people.length}`;
  const back = document.getElementById('back'); back.hidden = !pl; back.textContent = t('back');
  back.onclick = () => { place = null; mark(); drawPeople(); map.fitBounds(BOUNDS, { padding: 40, duration: still() ? 0 : 700 }); };
  document.getElementById('plist').innerHTML = list.map((p) => {
    const n = recsOf(p.qid).length;
    const more = [n ? `<button type="button" data-listen="${p.qid}">${t('listen')(n)}</button>` : '', p.kitabxana ? `<a href="${KX()}/authors/${p.kitabxana}">${t('poems')}</a>` : '', litSlug.has(p.qid) ? `<a href="/xerite/?author=${litSlug.get(p.qid)}${lang === 'az' ? '' : '&lang=' + lang}">${t('alsoLit')}</a>` : ''].filter(Boolean).join('');
    return `<li${p.qid === qid ? ' class="on"' : ''}><button type="button" class="p" data-p="${p.qid}"><span class="n">${esc(L(p))}</span><span class="y">${years(p)}</span><span class="r">${p.roles.map((x) => t(x)).join(', ')}${pl ? '' : ` · ${esc(L(p.place))}`}${p.byHand ? ` (${t('byHand')})` : ''}</span></button>${more ? `<div class="more">${more}</div>` : ''}</li>`;
  }).join('');
  document.querySelectorAll('#plist [data-p]').forEach((b) => b.onclick = () => { const p = byQid.get(b.dataset.p); showPlace(p.place.id, p.qid); });
  document.querySelectorAll('#plist [data-listen]').forEach((b) => b.onclick = () => load(recsOf(b.dataset.listen)[0], true));
  if (qid) document.querySelector('#plist .on')?.scrollIntoView({ block: 'nearest' });
  const p = qid && byQid.get(qid);
  if (p) bigPulse.setLngLat([p.place.lng, p.place.lat]).addTo(map); else bigPulse.remove();
}
function drawLegend() {
  const C = ROLE();
  document.getElementById('legend').innerHTML = ['khanende', 'tar', 'ashik'].map((r) => `<div><i style="background:${C[r]}"></i>${t(r)}</div>`).join('')
    + `<div><i style="background:transparent;border:1.25px solid ${css('--ink')}"></i>${t('withRecs')}</div>`;
}

function drawAll() { drawKinds(); drawShelf(); drawModes(); drawPeople(); drawLegend(); }
function keepUrl() {
  const q = new URLSearchParams();
  if (lang !== 'az') q.set('lang', lang);
  if (current && current !== first) q.set('r', current.id);
  history.replaceState(null, '', `${location.pathname}${q.size ? '?' + q : ''}${location.hash}`);
}
function applyLang() {
  { const a = document.getElementById('lin-link'); if (a) a.textContent = { az: 'Ustad-şagird silsilələri →', ru: 'Линии «учитель — ученик» →', en: 'Master–student lineages →' }[lang] ?? ''; }
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => { const v = t(el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-i18n-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
  document.getElementById('kx').href = KX();
}
applyLang();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang();
  if (recs.length) { placed = undefined; drawAll(); drawNow(); keepUrl(); }
  for (const m of [map, mini]) if (m.getStyle()) for (const l of m.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field']) m.setLayoutProperty(l.id, 'text-field', labelExpr());
});
})();
</script>
