<body>
<div class="wrap">
  <header class="head">
    <div id="top"></div>
    <h1 data-i18n="title">Caz</h1>
    <p class="sub" data-i18n="sub">Muğamdan cazadək</p>
    <p class="lede" id="lede"></p>
  </header>
  <main>
    <section aria-labelledby="h-tl">
      <h2 id="h-tl" data-i18n="tlH">Zaman xətti</h2>
      <div class="legend" id="legend"></div>
      <div class="scroller" style="margin-top:.6rem"><svg id="tl" role="img" data-i18n-label="tlH"></svg></div>
      <p class="hint" data-i18n="tlHint"></p>
      <div class="info" id="tinfo" aria-live="polite"></div>
    </section>
    <section aria-labelledby="h-net">
      <h2 id="h-net" data-i18n="netH">Kim kimlə, kim kimdən</h2>
      <div class="bar"><div class="chips" id="kinds" role="group"></div><div class="legend" id="nlegend"></div></div>
      <div class="stage s gx-wide" id="nstage" role="region" aria-labelledby="h-net"></div>

      <div class="info" id="pinfo" aria-live="polite"></div>
    </section>
    <section aria-labelledby="h-listen">
      <h2 id="h-listen" data-i18n="listenH">Dinləmək üçün</h2>

    <section aria-labelledby="h-method">
      <h2 id="h-method" data-i18n="methodH">Necə yığılıb</h2>

  </main>
  <footer id="foot"></footer>
</div>
<script src="../ui.js"></script>
<script src="../listen.js"></script>
<script>
(() => {
const { esc, nm, yrs } = MQ;
const T = {
  az: { doc: 'Caz · Azad Bilik', music: 'Musiqi', title: 'Caz', sub: 'Muğamdan cazadək',
    lede: (s) => `Vaqif Mustafazadə muğamı cazla birləşdirib (muğam-caz); qızı Aziza onu dünyaya tanıtdı, Tofiq Quliyev və Rauf Hacıyev isə daha əvvəl estrada-cazı qurmuşdular. Burada ${s.people} musiqiçi, aralarında ${s.links} əlaqə (${s.wd} Wikidata, ${s.tx} Vikipediya cümləsindən) və Wikidata-da qeyd olunan ${s.albums} albom var. Siyahı tam deyil: Wikidata cazı zəif əhatə edir.`,
    tlH: 'Zaman xətti', tlHint: 'Zolaqlar ömür illəridir. «Albomlar» sırasındakı nöqtələr Wikidata-da tarixli albomlardır (yalnız Əzizə Mustafazadə və Eldar Mansurovunkudur), «Apple Music» sırasındakılar Apple Music kataloqundakı albomlardır: il kataloqdakı nəşrin çıxdığı ildir (çox vaxt köhnə yazının yenidən buraxılışı), yazıldığı il deyil. Festival da nöqtədir. Apple Music sırasında yalnız 2012-yə qədərki nəşrlər var, hamısı şəxsin kartındadır. Seçin.',
    lLife: 'Ömür illəri', lAlbum: 'Albomlar', lApple: 'Apple Music', lEvent: 'Festival', c1: '1930-dək doğulanlar', c2: '1930–1959', c3: '1960-dan sonra',
    pickT: 'Seçin.', born: 'Doğulub', place: 'Yer', teachers: 'Ustad / tərəfdaş', students: 'Şagird / tərəfdaş', read: 'Vikipediya', wd: 'Wikidata', performers: 'İfaçı', year: 'İl', note: 'Qeyd', appleAlb: 'Apple Music kataloqunda albom', by: 'İfaçı',
    netH: 'Kim kimlə, kim kimdən', netHint: 'Xəttin rəngi əlaqənin növüdür (yuxarıdakı düymələrlə gizlədin). Oxlar ustaddan şagirdə, rəhbərdən iştirakçıya, təsir edəndən təsirlənənə gedir. Düz xətt Wikidata-dır, qırıq xətt Vikipediya cümləsindən çıxarılıb (cümlə düyün seçiləndə görünür). Boş dairə: siyahıdakı caz musiqiçisi olmayan ustad (bəstəkar və s.).',
    offLegend: 'siyahıdan kənar', viaWd: 'Wikidata', viaTx: 'mətndən', kTeacher: 'ustad', kCollab: 'birgə iş', kInfluence: 'təsir', kFamily: 'ailə',
    listenH: 'Dinləmək üçün', listenNote: `Pulsuz və hüquqi cəhətdən azad caz yazısı tapa bilmədim: Commons-da «Azerbaijani jazz» kateqoriyası boşdur, archive.org-dakı Vaqif və Aziza Mustafazadə radio verilişləri üçüncü şəxslər tərəfindən «ictimai mülkiyyət» işarələnib, amma kommersiya materialıdır; ona görə çalmıram və keçid vermirəm. Müəllif hüququ olan yazılar yalnız rəsmi kanallardadır. Oxumaq üçün: <a href="https://en.wikipedia.org/wiki/Vagif_Mustafazadeh">Vagif Mustafazadeh (Vikipediya)</a>. Apple Music dinləmələri ayrıdır: şəxsin kartında Apple Music-dən birbaşa ötürülən üç ədədə qədər 30 saniyəlik fraqment, Apple Music və Spotify keçidləri var; bunlar azad yazı deyil, yalnız tanış olmaq üçündür.`,
    methodH: 'Necə yığılıb',
    method: (s) => `<ul><li><b>Adlar:</b> əl ilə seçilmiş ${s.people} nəfər: tapşırıqda adı çəkilənlər və Wikidata-da caz janrı və Azərbaycanla əlaqəsi qeyd olunanlar. Wikidata Tofiq Quliyev və Rauf Hacıyevi caz kimi qeyd etmir; onları əl ilə əlavə etmişəm.</li>
<li><b>Əlaqələr:</b> ${s.wd} əlaqə Wikidata-da «şagirdi/ustadı» kimidir; ${s.tx} əlaqəni az, ru, en Vikipediya cümlələrindən əl ilə oxumuşam (namizədlər: <a href="data/jazz.candidates.json">jazz.candidates.json</a>, seçilənlər: <a href="data/jazz.text.spec.json">jazz.text.spec.json</a>). Birgə iş əlaqələri («rəhbərlik etdi», «layihə hazırladı») subyektivdir və yalnız bir cümləyə əsaslanır.</li>
<li><b>Tarixlər:</b> albomlar Wikidata-da P175 (ifaçı) və P577 (tarix) ilə, festival isə P571 ilə yazılıb. 1930–60-cı illərin estrada-caz orkestrləri üçün tarixli Wikidata yazısı tapmadım, ona görə zaman xəttində yoxdur.</li>
<li><b>Yenidən qurmaq:</b> <code>node scripts/jazz.mjs</code>, <code>node scripts/people-text.mjs caz/data/people.json caz/data/jazz.candidates.json both</code>, sonra <code>node scripts/jazz-build.mjs</code>.</li></ul>`,
    foot: (d) => `Mənbə: Wikidata (CC0) və az/ru/en Vikipediya (CC BY-SA, cümlələr qısa sitatdır), ${d}. Fayl: <a href="data/jazz.json">jazz.json</a>.` },
  ru: { doc: 'Джаз · Azad Bilik', music: 'Музыка', title: 'Джаз', sub: 'От мугама к джазу',
    lede: (s) => `Вагиф Мустафазаде соединил мугам с джазом (мугам-джаз); его дочь Азиза сделала этот сплав известным миру, а Тофик Кулиев и Рауф Гаджиев ещё раньше создали эстрадный джаз. Здесь ${s.people} музыкантов, ${s.links} связей между ними (${s.wd} из Wikidata, ${s.tx} из предложений Википедии) и ${s.albums} альбомов с датой в Wikidata. Список неполон: Wikidata слабо описывает джаз.`,
    tlH: 'Хронология', tlHint: 'Полосы — годы жизни. Точки в ряду «Альбомы» — альбомы с датой в Wikidata (есть только у Азизы Мустафазаде и Эльдара Мансурова), в ряду «Apple Music» — альбомы каталога Apple Music: год — это год выхода издания в каталоге (часто переиздание старой записи), а не год записи. Фестиваль тоже точка. В ряду Apple Music только издания до 2012 года, все они — в карточке человека. Выберите.',
    lLife: 'Годы жизни', lAlbum: 'Альбомы', lApple: 'Apple Music', lEvent: 'Фестиваль', c1: 'родились до 1930', c2: '1930–1959', c3: 'после 1960',
    pickT: 'Выберите.', born: 'Родился', place: 'Место', teachers: 'Учитель / партнёр', students: 'Ученик / партнёр', read: 'Википедия', wd: 'Wikidata', performers: 'Исполнитель', year: 'Год', appleAlb: 'Альбом в каталоге Apple Music', by: 'Исполнитель', note: 'Примечание',
    netH: 'Кто с кем и у кого', netHint: 'Цвет линии — вид связи (кнопками выше их можно скрыть). Стрелки идут от учителя к ученику, от руководителя к участнику, от повлиявшего к испытавшему влияние. Сплошная линия — Wikidata, пунктир — из предложения Википедии (оно видно при выборе узла). Пустой кружок — учитель вне списка джазменов (композитор и т. п.).',
    offLegend: 'вне списка', viaWd: 'Wikidata', viaTx: 'из текста', kTeacher: 'учитель', kCollab: 'совместная работа', kInfluence: 'влияние', kFamily: 'семья',
    listenH: 'Где послушать', listenNote: `Свободных джазовых записей я не нашёл: категория Commons «Azerbaijani jazz» пуста, радиопрограммы Вагифа и Азизы Мустафазаде на archive.org помечены третьими лицами как общественное достояние, но это коммерческий материал, поэтому я их не проигрываю и не ссылаюсь. Записи под охраной — только на официальных каналах. Для чтения: <a href="https://en.wikipedia.org/wiki/Vagif_Mustafazadeh">Vagif Mustafazadeh (Википедия)</a>. Фрагменты Apple Music — отдельно: в карточке человека до трёх 30-секундных отрывков, идущих напрямую с Apple Music, и ссылки на Apple Music и Spotify; это не свободные записи, а лишь возможность познакомиться.`,
    methodH: 'Как собрано',
    method: (s) => `<ul><li><b>Люди:</b> ${s.people} человек, выбраны вручную: названные в задании и те, у кого в Wikidata указан жанр джаз и связь с Азербайджаном. Тофик Кулиев и Рауф Гаджиев в Wikidata не отмечены как джазовые; я добавил их вручную.</li>
<li><b>Связи:</b> ${s.wd} связей — «ученик/учитель» в Wikidata; ${s.tx} я прочитал вручную в предложениях az, ru, en Википедии (кандидаты: <a href="data/jazz.candidates.json">jazz.candidates.json</a>, выбранные: <a href="data/jazz.text.spec.json">jazz.text.spec.json</a>). Связи «совместная работа» («руководил», «подготовил проект») субъективны и держатся на одном предложении.</li>
<li><b>Даты:</b> альбомы — Wikidata P175 (исполнитель) и P577 (дата), фестиваль — P571. Для эстрадно-джазовых оркестров 1930–60-х датированных записей в Wikidata я не нашёл, поэтому их на хронологии нет.</li>
<li><b>Пересборка:</b> <code>node scripts/jazz.mjs</code>, <code>node scripts/people-text.mjs caz/data/people.json caz/data/jazz.candidates.json both</code>, затем <code>node scripts/jazz-build.mjs</code>.</li></ul>`,
    foot: (d) => `Источники: Wikidata (CC0) и az/ru/en Википедия (CC BY-SA, предложения — короткие цитаты), ${d}. Файл: <a href="data/jazz.json">jazz.json</a>.` },
  en: { doc: 'Jazz · Azad Bilik', music: 'Music', title: 'Jazz', sub: 'From mugham to jazz',
    lede: (s) => `Vagif Mustafazadeh fused mugham with jazz (mugham-jazz); his daughter Aziza carried it to the world, and Tofig Guliyev and Rauf Hajiyev had built Soviet-era estrada-jazz before them. Here: ${s.people} musicians, ${s.links} links between them (${s.wd} from Wikidata, ${s.tx} from Wikipedia sentences) and ${s.albums} albums dated on Wikidata. The list is not complete: Wikidata covers jazz thinly.`,
    tlH: 'Timeline', tlHint: 'Bars are lifespans. Dots on the Albums row are albums dated on Wikidata (only Aziza Mustafazadeh and Eldar Mansurov have any); dots on the Apple Music row are albums of the Apple Music catalogue, dated by the release of the edition there, often a reissue of an older recording, not the year it was recorded. The festival is a dot too. The Apple Music row shows releases up to 2012 only; each person\'s card lists all of them. Pick one.',
    lLife: 'Lifespans', lAlbum: 'Albums', lApple: 'Apple Music', lEvent: 'Festival', c1: 'born before 1930', c2: '1930–1959', c3: 'after 1960',
    pickT: 'Pick one.', born: 'Born', place: 'Place', teachers: 'Teacher / partner', students: 'Student / partner', read: 'Wikipedia', wd: 'Wikidata', performers: 'Performer', year: 'Year', appleAlb: 'Album in the Apple Music catalogue', by: 'Artist', note: 'Note',
    netH: 'Who played with and learned from whom', netHint: 'A line’s colour is the kind of link (hide kinds with the buttons above). Arrows run from teacher to student, from leader to member, from the influence to the influenced. A solid line is Wikidata; dashed is read from a Wikipedia sentence (shown when you pick a node). A hollow circle is a teacher outside the list of jazz players (a composer, etc.).',
    offLegend: 'outside the list', viaWd: 'Wikidata', viaTx: 'from text', kTeacher: 'teacher', kCollab: 'worked together', kInfluence: 'influence', kFamily: 'family',
    listenH: 'Where to listen', listenNote: `I found no freely licensed jazz recordings: the Commons category «Azerbaijani jazz» is empty, and the archive.org radio programmes of Vagif and Aziza Mustafazadeh carry a public-domain mark set by third parties on commercial material, so I neither play nor link them. Protected recordings are on the artists' official channels. To read: <a href="https://en.wikipedia.org/wiki/Vagif_Mustafazadeh">Vagif Mustafazadeh (Wikipedia)</a>. Apple Music previews are separate: a person's card carries up to three 30-second previews streamed straight from Apple Music, with links to Apple Music and Spotify; they are not free recordings, only a way to hear a little.`,
    methodH: 'How it was gathered',
    method: (s) => `<ul><li><b>People:</b> ${s.people} chosen by hand: those named in the brief and those Wikidata tags with genre jazz and a tie to Azerbaijan. Wikidata does not tag Tofig Guliyev or Rauf Hajiyev as jazz; I added them by hand.</li>
<li><b>Links:</b> ${s.wd} are student-of/teacher links on Wikidata; ${s.tx} I read by hand in az, ru and en Wikipedia sentences (candidates: <a href="data/jazz.candidates.json">jazz.candidates.json</a>, chosen: <a href="data/jazz.text.spec.json">jazz.text.spec.json</a>). «Worked together» links («led», «made a project with») are subjective and rest on one sentence.</li>
<li><b>Dates:</b> albums are Wikidata P175 (performer) with P577 (date); the festival is P571. I found no dated Wikidata items for the 1930s–60s estrada-jazz orchestras, so they are not on the timeline.</li>
<li><b>Rebuild:</b> <code>node scripts/jazz.mjs</code>, <code>node scripts/people-text.mjs caz/data/people.json caz/data/jazz.candidates.json both</code>, then <code>node scripts/jazz-build.mjs</code>.</li></ul>`,
    foot: (d) => `Sources: Wikidata (CC0) and az/ru/en Wikipedia (CC BY-SA; the sentences are short quotations), ${d}. File: <a href="data/jazz.json">jazz.json</a>.` },
};
const COH = (p) => p.born == null ? 'var(--muted)' : p.born < 1930 ? 'var(--accent)' : p.born < 1960 ? 'var(--second)' : 'var(--third)';
const KK = { teacher: 'kTeacher', collab: 'kCollab', influence: 'kInfluence', family: 'kFamily' };
const KC = { teacher: 'var(--ink)', collab: 'var(--fourth)', influence: 'var(--fifth)', family: 'var(--sixth)' };
let D = null, byQ, selT = null, net = null, building = null, selP = null;
const offK = new Set();
const t = (k, ...a) => MQ.t(k, ...a);
const pname = (q) => nm(byQ.get(q));
function legend() {
  const l = [['c1', 'var(--accent)'], ['c2', 'var(--second)'], ['c3', 'var(--third)']].map(([k, c]) => `<span><i style="--c:${c}"></i>${esc(t(k))}</span>`).join('');
  document.getElementById('legend').innerHTML = l; document.getElementById('nlegend').innerHTML = l + `<span><i class="off"></i>${esc(t('offLegend'))}</span>`;
}
// Albums of the Apple Music catalogue (data/apple.json): the year is that of the edition in the catalogue, often a reissue
const applePts = () => D.people.flatMap((p) => (MQL.A[p.qid]?.rec ?? []).slice(0, 40).map((r, i) => ({ q: p.qid, r, i })).filter((x) => +x.r[1] >= 1915 && +x.r[1] <= 2012)).map((x) => ({ id: 'm:' + x.q + '/' + x.i, lane: 'am', x0: +x.r[1], label: x.r[0] + ' · ' + x.r[1], bare: true, color: COH(byQ.get(x.q)) }));
function timeline() {
  const now = new Date().getFullYear();
  const items = [
    ...D.people.filter((p) => !p.offmap && p.born).map((p) => ({ id: 'p:' + p.qid, lane: 'life', x0: p.born, x1: p.died ?? now, label: nm(p), sub: '', color: COH(p), dead: !!p.died })),
    ...D.albums.map((a) => ({ id: 'a:' + a.qid, lane: 'alb', x0: a.year, label: a[MQ.lang] || a.az || a.en || a.ru, color: COH(byQ.get(a.performers[0]) ?? {}) })),
    ...applePts(),
    ...D.events.map((e) => ({ id: 'e:' + e.qid, lane: 'ev', x0: e.year, label: e[MQ.lang] || e.az, color: 'var(--fifth)' })),
  ];
  MQ.timeline(document.getElementById('tl'), { items, lanes: [{ id: 'life', label: t('lLife') }, { id: 'alb', label: t('lAlbum') }, ...(applePts().length ? [{ id: 'am', label: t('lApple') }] : []), { id: 'ev', label: t('lEvent') }], from: 1915, to: 2026, px: 8, selected: selT, onPick: (id) => { selT = selT === id ? null : id; timeline(); describeT(); } });
}
const spotAlb = (q) => { const x = Object.values(MQL.S).flatMap((s) => s.al ?? []).find((a) => a.q === q); return x ? `<dt>Spotify</dt><dd><a href="https://open.spotify.com/album/${esc(x.id)}" rel="noopener">Spotify</a></dd>` : ''; };
function describeT() {
  const el = document.getElementById('tinfo');
  if (!selT) { el.innerHTML = `<p class="empty">${esc(t('pickT'))}</p>`; return; }
  const [k, q] = [selT.slice(0, 1), selT.slice(2)], row = (a, v) => v ? `<dt>${esc(t(a))}</dt><dd>${v}</dd>` : '';
  if (k === 'p') { const p = byQ.get(q); el.innerHTML = `<h3>${esc(nm(p))}</h3><dl>${row('born', esc(yrs(p)))}${row('place', esc(p.place ?? ''))}${row('read', MQ.wikiLinks(p.wiki))}${MQ.ytRow(q)}${row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`)}</dl>${MQL.block(q)}`; }
  else if (k === 'm') { const [pq, i] = q.split('/'), r = MQL.A[pq].rec[+i]; el.innerHTML = `<h3>${esc(r[0])}</h3><dl>${row('year', esc(r[1]))}${row('by', esc(pname(pq)))}<dt>Apple Music</dt><dd><a href="${esc(r[2])}" rel="noopener">${esc(t('appleAlb'))}</a></dd></dl><p class="hint">${esc(MQL.T[MQ.lang].recNote)}</p>`; }
  else if (k === 'a') { const a = D.albums.find((x) => x.qid === q); el.innerHTML = `<h3>${esc(a[MQ.lang] || a.az || a.en)}</h3><dl>${row('year', a.year)}${row('performers', a.performers.map((x) => esc(pname(x))).join(', '))}${row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`)}${spotAlb(q)}</dl>`; }
  else { const e = D.events.find((x) => x.qid === q); el.innerHTML = `<h3>${esc(e[MQ.lang] || e.az)}</h3><dl>${row('year', e.year)}${row('note', esc(e.note))}${row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`)}</dl>`; }
}
// The network (shared/graph.js through MQ.network): a force layout, the line coloured by the kind of link;
// built once, a language switch only relabels, the kind chips only hide links
function network() {
  kinds();
  const edge = { edgeColor: (e) => KC[e.kind] ?? 'var(--ink)', edgeAlpha: 0.8, edgeWidth: (e) => (e.src === 'text' ? 1.25 : 1.6), litColor: 'edge', start: 'all', panHint: false };
  if (!net && !building) building = MQ.network({ stage: document.getElementById('nstage'), people: D.people, links: D.links, name: nm, color: COH, off: (p) => !!p.offmap, layout: 'force', toggle: false, lineage: false, panel: document.getElementById('pinfo'), linkOn: (l) => !offK.has(l.kind), onSelect: (q) => { selP = q; describeP(q); }, edge }).then((g) => { net = g; building = null; filter(); });
  else if (net) { net.setStrings(); net.relabel(); }
  describeP(selP);
}
const filter = () => net?.setFilter(null, (e) => !offK.has(e.kind));
function kinds() {
  const n = (k) => D.links.filter((l) => l.kind === k).length;
  const el = document.getElementById('kinds');
  el.innerHTML = Object.keys(KK).filter((k) => n(k)).map((k) => `<button type="button" data-k="${k}" aria-pressed="${!offK.has(k)}"><i class="kind" style="--c:${KC[k]}"></i>${esc(t(KK[k]))} (${n(k)})</button>`).join('');
  el.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { const k = b.dataset.k; offK.has(k) ? offK.delete(k) : offK.add(k); if (offK.size >= Object.keys(KK).filter((x) => n(x)).length) offK.delete(k); kinds(); filter(); });
}
function describeP(q) {
  const p = byQ.get(q), el = document.getElementById('pinfo');
  if (!p) { el.innerHTML = `<p class="empty">${esc(t('pickT'))}</p>`; return; }
  const row = (a, v) => v ? `<dt>${esc(t(a))}</dt><dd>${v}</dd>` : '';
  const line = (l, o) => `<li><a href="#" data-q="${o}">${esc(pname(o))}</a> <span class="muted">${yrs(byQ.get(o))}</span><span class="tag">${esc(t(KK[l.kind]))}</span><span class="tag">${esc(t(l.src === 'text' ? 'viaTx' : 'viaWd'))}</span>${l.sentence ? `<blockquote>${esc(l.sentence)} <a href="${esc(l.article)}">${esc(l.lang)}</a></blockquote>` : ''}</li>`;
  const ts = D.links.filter((l) => l.s === q), ss = D.links.filter((l) => l.t === q);
  el.innerHTML = `<h3>${esc(nm(p))}</h3><dl>${row('born', esc(yrs(p)))}${row('place', esc(p.place ?? ''))}${row('teachers', ts.length ? `<ul>${ts.map((l) => line(l, l.t)).join('')}</ul>` : '')}${row('students', ss.length ? `<ul>${ss.map((l) => line(l, l.s)).join('')}</ul>` : '')}${row('read', MQ.wikiLinks(p.wiki))}${MQ.ytRow(q)}${/^Q\d/.test(q) ? row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`) : ''}</dl>${MQL.block(q)}`;
  el.querySelectorAll('a[data-q]').forEach((a) => a.onclick = (e) => { e.preventDefault(); net?.focus(a.dataset.q); });
}
function render() {
  if (!D) return;
  byQ = new Map(D.people.map((p) => [p.qid, p])); selT = null;
  document.getElementById('lede').textContent = t('lede', D.stats);
  document.getElementById('method').innerHTML = t('method', D.stats);
  document.getElementById('foot').innerHTML = t('foot', D.built);
  document.querySelectorAll('[data-i18n-label]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.i18nLabel)));
  legend(); timeline(); describeT(); network();
}
const apply = MQ.boot(T, render);
Promise.all([fetch('data/jazz.json').then((r) => r.json()), MQ.loadYT(), MQL.load()]).then(([d]) => { D = d; apply(); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (D) timeline(); }, 150); });
})();
</script>
