<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>Caz · Azad Bilik</title>
<meta name="description" content="Azərbaycan cazı: Vaqif Mustafazadədən Aziza Mustafazadəyə, kim kimlə çalıb və kim kimi öyrədib, zaman xətti. Azerbaijani jazz: who played with and taught whom, and a timeline.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://azadbilik.org/musiqi/caz/">
<meta property="og:title" content="Caz · Azerbaijani jazz">
<meta property="og:description" content="Muğam-caz, Vaqif Mustafazadə və nəsli: şəbəkə və zaman xətti. Wikidata (CC0).">
<meta property="og:image" content="https://azadbilik.org/musiqi/caz/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="../ui.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <div id="top"></div>
    <h1 data-i18n="title">Caz</h1>
    <p class="sub" data-i18n="sub">Muğamdan cazadək</p>
    <p class="lede" id="lede"></p>
  </header>
  <main>
    <section aria-labelledby="h-tl">
      <h2 id="h-tl" data-i18n="tlH">Zaman xətti</h2>
      <div class="legend" id="legend"></div>
      <div class="scroller" style="margin-top:.6rem"><svg id="tl" role="img" data-i18n-label="tlH"></svg></div>
      <p class="hint" data-i18n="tlHint"></p>
      <div class="info" id="tinfo" aria-live="polite"></div>
    </section>
    <section aria-labelledby="h-net">
      <h2 id="h-net" data-i18n="netH">Kim kimlə, kim kimdən</h2>
      <div class="legend" id="nlegend"></div>
      <div class="scroller" id="nscroll" style="margin-top:.6rem"><svg id="net" role="img" data-i18n-label="netH"></svg></div>
      <p class="hint" data-i18n="netHint"></p>
      <div class="info" id="pinfo" aria-live="polite"></div>
    </section>
    <section aria-labelledby="h-listen">
      <h2 id="h-listen" data-i18n="listenH">Dinləmək üçün</h2>
      <div class="method"><p data-i18n-html="listenNote"></p></div>
    </section>
    <section aria-labelledby="h-method">
      <h2 id="h-method" data-i18n="methodH">Necə yığılıb</h2>
      <div class="method" id="method"></div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="../ui.js"></script>
<script>
(() => {
const { esc, nm, yrs } = MQ;
const T = {
  az: { doc: 'Caz · Azad Bilik', music: 'Musiqi', title: 'Caz', sub: 'Muğamdan cazadək',
    lede: (s) => `Vaqif Mustafazadə muğamı cazla birləşdirib (muğam-caz); qızı Aziza onu dünyaya tanıtdı, Tofiq Quliyev və Rauf Hacıyev isə daha əvvəl estrada-cazı qurmuşdular. Burada ${s.people} musiqiçi, aralarında ${s.links} əlaqə (${s.wd} Wikidata, ${s.tx} Vikipediya cümləsindən) və Wikidata-da qeyd olunan ${s.albums} albom var. Siyahı tam deyil: Wikidata cazı zəif əhatə edir.`,
    tlH: 'Zaman xətti', tlHint: 'Zolaqlar ömür illəridir, nöqtələr Wikidata-da tarixli albomlar və festivaldır. Seçin. Albomlar yalnız Əzizə Mustafazadə və Eldar Mansurovunkudur, çünki Wikidata başqalarınınkını bilmir.',
    lLife: 'Ömür illəri', lAlbum: 'Albomlar', lEvent: 'Festival', c1: '1930-dək doğulanlar', c2: '1930–1959', c3: '1960-dan sonra',
    pickT: 'Seçin.', born: 'Doğulub', place: 'Yer', teachers: 'Ustad / tərəfdaş', students: 'Şagird / tərəfdaş', read: 'Vikipediya', wd: 'Wikidata', performers: 'İfaçı', year: 'İl', note: 'Qeyd',
    netH: 'Kim kimlə, kim kimdən', netHint: 'Oxlar ustaddan şagirdə, rəhbərdən iştirakçıya, təsir edəndən təsirlənənə gedir. Düz xətt Wikidata-dır, qırıq xətt Vikipediya cümləsindən çıxarılıb (cümlə düyün seçiləndə görünür). Boş dairə: siyahıdakı caz musiqiçisi olmayan ustad (bəstəkar və s.).',
    offLegend: 'siyahıdan kənar', viaWd: 'Wikidata', viaTx: 'mətndən', kTeacher: 'ustad', kCollab: 'birgə iş', kInfluence: 'təsir', kFamily: 'ailə',
    listenH: 'Dinləmək üçün', listenNote: `Pulsuz və hüquqi cəhətdən azad caz yazısı tapa bilmədim: Commons-da «Azerbaijani jazz» kateqoriyası boşdur, archive.org-dakı Vaqif və Aziza Mustafazadə radio verilişləri üçüncü şəxslər tərəfindən «ictimai mülkiyyət» işarələnib, amma kommersiya materialıdır; ona görə çalmıram və keçid vermirəm. Müəllif hüququ olan yazılar yalnız rəsmi kanallardadır. Oxumaq üçün: <a href="https://en.wikipedia.org/wiki/Vagif_Mustafazadeh">Vagif Mustafazadeh (Vikipediya)</a>.`,
    methodH: 'Necə yığılıb',
    method: (s) => `<ul><li><b>Adlar:</b> əl ilə seçilmiş ${s.people} nəfər: tapşırıqda adı çəkilənlər və Wikidata-da caz janrı və Azərbaycanla əlaqəsi qeyd olunanlar. Wikidata Tofiq Quliyev və Rauf Hacıyevi caz kimi qeyd etmir; onları əl ilə əlavə etmişəm.</li>
<li><b>Əlaqələr:</b> ${s.wd} əlaqə Wikidata-da «şagirdi/ustadı» kimidir; ${s.tx} əlaqəni az, ru, en Vikipediya cümlələrindən əl ilə oxumuşam (namizədlər: <a href="data/jazz.candidates.json">jazz.candidates.json</a>, seçilənlər: <a href="data/jazz.text.spec.json">jazz.text.spec.json</a>). Birgə iş əlaqələri («rəhbərlik etdi», «layihə hazırladı») subyektivdir və yalnız bir cümləyə əsaslanır.</li>
<li><b>Tarixlər:</b> albomlar Wikidata-da P175 (ifaçı) və P577 (tarix) ilə, festival isə P571 ilə yazılıb. 1930–60-cı illərin estrada-caz orkestrləri üçün tarixli Wikidata yazısı tapmadım, ona görə zaman xəttində yoxdur.</li>
<li><b>Yenidən qurmaq:</b> <code>node scripts/jazz.mjs</code>, <code>node scripts/people-text.mjs caz/data/people.json caz/data/jazz.candidates.json both</code>, sonra <code>node scripts/jazz-build.mjs</code>.</li></ul>`,
    foot: (d) => `Mənbə: Wikidata (CC0) və az/ru/en Vikipediya (CC BY-SA, cümlələr qısa sitatdır), ${d}. Fayl: <a href="data/jazz.json">jazz.json</a>.` },
  ru: { doc: 'Джаз · Azad Bilik', music: 'Музыка', title: 'Джаз', sub: 'От мугама к джазу',
    lede: (s) => `Вагиф Мустафазаде соединил мугам с джазом (мугам-джаз); его дочь Азиза сделала этот сплав известным миру, а Тофик Кулиев и Рауф Гаджиев ещё раньше создали эстрадный джаз. Здесь ${s.people} музыкантов, ${s.links} связей между ними (${s.wd} из Wikidata, ${s.tx} из предложений Википедии) и ${s.albums} альбомов с датой в Wikidata. Список неполон: Wikidata слабо описывает джаз.`,
    tlH: 'Хронология', tlHint: 'Полосы — годы жизни, точки — альбомы с датой в Wikidata и фестиваль. Выберите. Альбомы есть только у Азизы Мустафазаде и Эльдара Мансурова: у других Wikidata их не знает.',
    lLife: 'Годы жизни', lAlbum: 'Альбомы', lEvent: 'Фестиваль', c1: 'родились до 1930', c2: '1930–1959', c3: 'после 1960',
    pickT: 'Выберите.', born: 'Родился', place: 'Место', teachers: 'Учитель / партнёр', students: 'Ученик / партнёр', read: 'Википедия', wd: 'Wikidata', performers: 'Исполнитель', year: 'Год', note: 'Примечание',
    netH: 'Кто с кем и у кого', netHint: 'Стрелки идут от учителя к ученику, от руководителя к участнику, от повлиявшего к испытавшему влияние. Сплошная линия — Wikidata, пунктир — из предложения Википедии (оно видно при выборе узла). Пустой кружок — учитель вне списка джазменов (композитор и т. п.).',
    offLegend: 'вне списка', viaWd: 'Wikidata', viaTx: 'из текста', kTeacher: 'учитель', kCollab: 'совместная работа', kInfluence: 'влияние', kFamily: 'семья',
    listenH: 'Где послушать', listenNote: `Свободных джазовых записей я не нашёл: категория Commons «Azerbaijani jazz» пуста, радиопрограммы Вагифа и Азизы Мустафазаде на archive.org помечены третьими лицами как общественное достояние, но это коммерческий материал, поэтому я их не проигрываю и не ссылаюсь. Записи под охраной — только на официальных каналах. Для чтения: <a href="https://en.wikipedia.org/wiki/Vagif_Mustafazadeh">Vagif Mustafazadeh (Википедия)</a>.`,
    methodH: 'Как собрано',
    method: (s) => `<ul><li><b>Люди:</b> ${s.people} человек, выбраны вручную: названные в задании и те, у кого в Wikidata указан жанр джаз и связь с Азербайджаном. Тофик Кулиев и Рауф Гаджиев в Wikidata не отмечены как джазовые; я добавил их вручную.</li>
<li><b>Связи:</b> ${s.wd} связей — «ученик/учитель» в Wikidata; ${s.tx} я прочитал вручную в предложениях az, ru, en Википедии (кандидаты: <a href="data/jazz.candidates.json">jazz.candidates.json</a>, выбранные: <a href="data/jazz.text.spec.json">jazz.text.spec.json</a>). Связи «совместная работа» («руководил», «подготовил проект») субъективны и держатся на одном предложении.</li>
<li><b>Даты:</b> альбомы — Wikidata P175 (исполнитель) и P577 (дата), фестиваль — P571. Для эстрадно-джазовых оркестров 1930–60-х датированных записей в Wikidata я не нашёл, поэтому их на хронологии нет.</li>
<li><b>Пересборка:</b> <code>node scripts/jazz.mjs</code>, <code>node scripts/people-text.mjs caz/data/people.json caz/data/jazz.candidates.json both</code>, затем <code>node scripts/jazz-build.mjs</code>.</li></ul>`,
    foot: (d) => `Источники: Wikidata (CC0) и az/ru/en Википедия (CC BY-SA, предложения — короткие цитаты), ${d}. Файл: <a href="data/jazz.json">jazz.json</a>.` },
  en: { doc: 'Jazz · Azad Bilik', music: 'Music', title: 'Jazz', sub: 'From mugham to jazz',
    lede: (s) => `Vagif Mustafazadeh fused mugham with jazz (mugham-jazz); his daughter Aziza carried it to the world, and Tofig Guliyev and Rauf Hajiyev had built Soviet-era estrada-jazz before them. Here: ${s.people} musicians, ${s.links} links between them (${s.wd} from Wikidata, ${s.tx} from Wikipedia sentences) and ${s.albums} albums dated on Wikidata. The list is not complete: Wikidata covers jazz thinly.`,
    tlH: 'Timeline', tlHint: 'Bars are lifespans; dots are albums dated on Wikidata and the festival. Pick one. Albums exist only for Aziza Mustafazadeh and Eldar Mansurov because Wikidata knows no others.',
    lLife: 'Lifespans', lAlbum: 'Albums', lEvent: 'Festival', c1: 'born before 1930', c2: '1930–1959', c3: 'after 1960',
    pickT: 'Pick one.', born: 'Born', place: 'Place', teachers: 'Teacher / partner', students: 'Student / partner', read: 'Wikipedia', wd: 'Wikidata', performers: 'Performer', year: 'Year', note: 'Note',
    netH: 'Who played with and learned from whom', netHint: 'Arrows run from teacher to student, from leader to member, from the influence to the influenced. A solid line is Wikidata; dashed is read from a Wikipedia sentence (shown when you pick a node). A hollow circle is a teacher outside the list of jazz players (a composer, etc.).',
    offLegend: 'outside the list', viaWd: 'Wikidata', viaTx: 'from text', kTeacher: 'teacher', kCollab: 'worked together', kInfluence: 'influence', kFamily: 'family',
    listenH: 'Where to listen', listenNote: `I found no freely licensed jazz recordings: the Commons category «Azerbaijani jazz» is empty, and the archive.org radio programmes of Vagif and Aziza Mustafazadeh carry a public-domain mark set by third parties on commercial material, so I neither play nor link them. Protected recordings are on the artists' official channels. To read: <a href="https://en.wikipedia.org/wiki/Vagif_Mustafazadeh">Vagif Mustafazadeh (Wikipedia)</a>.`,
    methodH: 'How it was gathered',
    method: (s) => `<ul><li><b>People:</b> ${s.people} chosen by hand: those named in the brief and those Wikidata tags with genre jazz and a tie to Azerbaijan. Wikidata does not tag Tofig Guliyev or Rauf Hajiyev as jazz; I added them by hand.</li>
<li><b>Links:</b> ${s.wd} are student-of/teacher links on Wikidata; ${s.tx} I read by hand in az, ru and en Wikipedia sentences (candidates: <a href="data/jazz.candidates.json">jazz.candidates.json</a>, chosen: <a href="data/jazz.text.spec.json">jazz.text.spec.json</a>). «Worked together» links («led», «made a project with») are subjective and rest on one sentence.</li>
<li><b>Dates:</b> albums are Wikidata P175 (performer) with P577 (date); the festival is P571. I found no dated Wikidata items for the 1930s–60s estrada-jazz orchestras, so they are not on the timeline.</li>
<li><b>Rebuild:</b> <code>node scripts/jazz.mjs</code>, <code>node scripts/people-text.mjs caz/data/people.json caz/data/jazz.candidates.json both</code>, then <code>node scripts/jazz-build.mjs</code>.</li></ul>`,
    foot: (d) => `Sources: Wikidata (CC0) and az/ru/en Wikipedia (CC BY-SA; the sentences are short quotations), ${d}. File: <a href="data/jazz.json">jazz.json</a>.` },
};
const COH = (p) => p.born == null ? 'var(--muted)' : p.born < 1930 ? 'var(--accent)' : p.born < 1960 ? 'var(--second)' : 'var(--third)';
const KK = { teacher: 'kTeacher', collab: 'kCollab', influence: 'kInfluence', family: 'kFamily' };
let D = null, byQ, selT = null, net = null;
const t = (k, ...a) => MQ.t(k, ...a);
const pname = (q) => nm(byQ.get(q));
function legend() {
  const l = [['c1', 'var(--accent)'], ['c2', 'var(--second)'], ['c3', 'var(--third)']].map(([k, c]) => `<span><i style="--c:${c}"></i>${esc(t(k))}</span>`).join('');
  document.getElementById('legend').innerHTML = l; document.getElementById('nlegend').innerHTML = l + `<span><i class="off"></i>${esc(t('offLegend'))}</span>`;
}
function timeline() {
  const now = new Date().getFullYear();
  const items = [
    ...D.people.filter((p) => !p.offmap && p.born).map((p) => ({ id: 'p:' + p.qid, lane: 'life', x0: p.born, x1: p.died ?? now, label: nm(p), sub: '', color: COH(p), dead: !!p.died })),
    ...D.albums.map((a) => ({ id: 'a:' + a.qid, lane: 'alb', x0: a.year, label: a[MQ.lang] || a.az || a.en || a.ru, color: COH(byQ.get(a.performers[0]) ?? {}) })),
    ...D.events.map((e) => ({ id: 'e:' + e.qid, lane: 'ev', x0: e.year, label: e[MQ.lang] || e.az, color: 'var(--fifth)' })),
  ];
  MQ.timeline(document.getElementById('tl'), { items, lanes: [{ id: 'life', label: t('lLife') }, { id: 'alb', label: t('lAlbum') }, { id: 'ev', label: t('lEvent') }], from: 1915, to: 2026, px: 8, selected: selT, onPick: (id) => { selT = selT === id ? null : id; timeline(); describeT(); } });
}
function describeT() {
  const el = document.getElementById('tinfo');
  if (!selT) { el.innerHTML = `<p class="empty">${esc(t('pickT'))}</p>`; return; }
  const [k, q] = [selT.slice(0, 1), selT.slice(2)], row = (a, v) => v ? `<dt>${esc(t(a))}</dt><dd>${v}</dd>` : '';
  if (k === 'p') { const p = byQ.get(q); el.innerHTML = `<h3>${esc(nm(p))}</h3><dl>${row('born', esc(yrs(p)))}${row('place', esc(p.place ?? ''))}${row('read', MQ.wikiLinks(p.wiki))}${MQ.ytRow(q)}${row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`)}</dl>`; }
  else if (k === 'a') { const a = D.albums.find((x) => x.qid === q); el.innerHTML = `<h3>${esc(a[MQ.lang] || a.az || a.en)}</h3><dl>${row('year', a.year)}${row('performers', a.performers.map((x) => esc(pname(x))).join(', '))}${row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`)}</dl>`; }
  else { const e = D.events.find((x) => x.qid === q); el.innerHTML = `<h3>${esc(e[MQ.lang] || e.az)}</h3><dl>${row('year', e.year)}${row('note', esc(e.note))}${row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`)}</dl>`; }
}
function network() {
  net = MQ.network({ svg: '#net', scroller: '#nscroll', people: D.people, links: D.links, name: nm, color: COH, off: (p) => !!p.offmap, colw: 200, onSelect: describeP });
  describeP(null);
}
function describeP(q) {
  const p = byQ.get(q), el = document.getElementById('pinfo');
  if (!p) { el.innerHTML = `<p class="empty">${esc(t('pickT'))}</p>`; return; }
  const row = (a, v) => v ? `<dt>${esc(t(a))}</dt><dd>${v}</dd>` : '';
  const line = (l, o) => `<li><a href="#" data-q="${o}">${esc(pname(o))}</a> <span class="muted">${yrs(byQ.get(o))}</span><span class="tag">${esc(t(KK[l.kind]))}</span><span class="tag">${esc(t(l.src === 'text' ? 'viaTx' : 'viaWd'))}</span>${l.sentence ? `<blockquote>${esc(l.sentence)} <a href="${esc(l.article)}">${esc(l.lang)}</a></blockquote>` : ''}</li>`;
  const ts = D.links.filter((l) => l.s === q), ss = D.links.filter((l) => l.t === q);
  el.innerHTML = `<h3>${esc(nm(p))}</h3><dl>${row('born', esc(yrs(p)))}${row('place', esc(p.place ?? ''))}${row('teachers', ts.length ? `<ul>${ts.map((l) => line(l, l.t)).join('')}</ul>` : '')}${row('students', ss.length ? `<ul>${ss.map((l) => line(l, l.s)).join('')}</ul>` : '')}${row('read', MQ.wikiLinks(p.wiki))}${MQ.ytRow(q)}${/^Q\d/.test(q) ? row('wd', `<a href="https://www.wikidata.org/wiki/${q}">${q}</a>`) : ''}</dl>`;
  el.querySelectorAll('a[data-q]').forEach((a) => a.onclick = (e) => { e.preventDefault(); net.select(a.dataset.q); });
}
function render() {
  if (!D) return;
  byQ = new Map(D.people.map((p) => [p.qid, p])); selT = null;
  document.getElementById('lede').textContent = t('lede', D.stats);
  document.getElementById('method').innerHTML = t('method', D.stats);
  document.getElementById('foot').innerHTML = t('foot', D.built);
  document.querySelectorAll('[data-i18n-label]').forEach((e) => e.setAttribute('aria-label', t(e.dataset.i18nLabel)));
  legend(); timeline(); describeT(); network();
}
const apply = MQ.boot(T, render);
Promise.all([fetch('data/jazz.json').then((r) => r.json()), MQ.loadYT()]).then(([d]) => { D = d; apply(); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (D) { timeline(); network(); } }, 150); });
})();
</script>
</body>
</html>
